<main id="dice" hidden>
  <label>Modifier</label>
  <div style="display:flex;gap:8px;align-items:stretch"><input id="modin" inputmode="numeric" placeholder="0" style="font-size:22px;font-weight:800;text-align:center;width:110px"><button id="modneg" class="negbtn" title="Flip to minus / plus">±</button></div>

  <div style="display:flex;gap:6px;align-items:stretch"><button id="histbtn" class="histbtn" style="flex:1">SHOW ROLL HISTORY</button><button id="sdshow" class="histbtn" style="flex:none;width:44px;color:var(--dim);font-size:17px;font-weight:900" title="Show the Success Delta card again">Δ</button><button id="dicepop" class="histbtn" style="flex:none;width:44px;color:var(--dim);display:flex;align-items:center;justify-content:center" title="Pop out roll history"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>

  <div id="hand" class="hand" hidden></div>

<script type="module">
import OBR, { buildImage, buildImageUpload, buildLabel } from "https://esm.sh/@owlbear-rodeo/sdk@3.1.0";
import { NS, KEEP, rollKey, allRolls, clearBtn, bindClear, CLEAR_CSS, fmt, INIT, initEntries, rollLine, ROLL_CSS, rollLog, LOG_MAX, POWER_CARDS, sameName, sdResult, MARK_ITEM, DEFAULT_MARKS, initMove, turnNames } from "./shared.js";
document.head.insertAdjacentHTML("beforeend", `<style>${ROLL_CSS}${CLEAR_CSS}</style>`);
import { TYPES, SECTIONS, REF_GROUPS, getTab, sectionHtml } from "./rules.js";

const $ = (id) => document.getElementById(id);
let mod = 0, me = null, standalone = !OBR.isAvailable, localRolls = [];

// Type the modifier: "+3", "-1", "3" or blank (0). Enter rolls.
// Phone number pads have no minus key, so ± flips the sign of whatever is typed
function flipSign(el) {
  const v = el.value.trim().replace("−", "-");
  el.value = v.startsWith("-") ? v.slice(1) : "-" + v.replace(/^\+/, "");
}
$("modneg").onclick = () => flipSign($("modin"));
function readMod() {
  const t = $("modin").value.trim().replace(/^\+/, "").replace("−", "-");
  if (t === "") return 0;
  const n = Number(t);
  return Number.isInteger(n) && Math.abs(n) <= 30 ? n : null;
}
$("modin").onkeydown = (e) => { if (e.key === "Enter") $("roll").click(); };

function rollDie() { const a = new Uint32Array(1); crypto.getRandomValues(a); return (a[0] % 3) - 1; }

function card(r, large) {
  const dice = r.dice.map(d => `<div class="die ${d > 0 ? "p" : d < 0 ? "m" : ""}">${d > 0 ? "+" : d < 0 ? "−" : ""}</div>`).join("");
  const time = new Date(r.ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const pen = parseInt(r.wnd, 10);
  return `<div class="card ${large ? "big" : ""}">
    <div class="who">${esc(r.char || r.who)}${r.char ? `<small>${esc(r.who)}</small>` : ""}${r.label ? ` <small>${esc(r.label)}</small>` : ""}<small>${time}</small>${pen ? `<small style="color:#ff8f8f;font-weight:900">wounded ${fmt(pen)}</small>` : ""}</div>
    <div class="dice">${dice}${r.mod ? `<span class="modtag">${fmt(r.mod)}</span>` : ""}<span class="total">${fmt(r.total)}</span></div>
  </div>`;
}

// Roll totals use Luckiest Guy (Bangers draws 1 and 7 almost the same)
const big = (n) => fmt(n);
// Slot-machine reel: faces flicker, then each die locks in left to right, then the total.
const face = (d) => d > 0 ? "+" : d < 0 ? "−" : "";
const cls = (d) => `die ${d > 0 ? "p" : d < 0 ? "m" : ""}`;
function spin(r) {
  return new Promise((done) => {
    $("last").innerHTML = `<div class="card big"><div class="who">Rolling…</div><div class="dice">${
      r.dice.map((_, i) => `<div class="die" id="d${i}"></div>`).join("")}${r.mod ? `<span class="modtag">${fmt(r.mod)}</span>` : ""}<span class="total" id="tot">?</span></div></div>`;
    let locked = 0;
    const tick = setInterval(() => {
      for (let i = locked; i < 4; i++) { const d = rollDie(), el = $("d" + i); el.className = cls(d); el.textContent = face(d); }
    }, 70);
    const lockNext = () => {
      const el = $("d" + locked); el.className = cls(r.dice[locked]); el.textContent = face(r.dice[locked]);
      locked++;
      if (locked < 4) return setTimeout(lockNext, 350);
      clearInterval(tick);
      setTimeout(() => { $("last").innerHTML = card(r, true); done(); }, 300);
    };
    setTimeout(lockNext, 900);
  });
}

// Roll history, newest first.
// DETAIL OFF (simple): name · time · wounded -1, then dice, skill name and the result on one line.
// DETAIL ON: same top line, the full skill name, then a little table of how the result was built:
// Dice +2 / Adroitness (attribute) +1 / Skill rank +1 / Wounded -1 / Result +3
let histDetail = (() => { try { return localStorage.getItem("ns.histDetail") === "on"; } catch { return false; } })();
const line = (r) => rollLine(r, histDetail);
// Pop-out: roll history opens as the "Roll History" choice of the Reference pop-out window
$("dicepop").onclick = () => popOut("__rolls");
// the pop-out's SIMPLE/DETAILED switch and this one stay in step
window.addEventListener("storage", (e) => { if (e.key === "ns.histDetail") { histDetail = e.newValue === "on"; render(lastRolls); } });
// the background page adds Success Delta lines straight into this room's log: pick them up
window.addEventListener("storage", (e) => { try { if (!standalone && e.key && e.key.startsWith("ns.rollLog@") && OBR.room.id && e.key === "ns.rollLog@" + OBR.room.id) render(rollLog(OBR.room.id, [])); } catch {} });
let lastRolls = [];
function render(rolls) {
  lastRolls = rolls;
  const html = `<div style="display:flex;gap:6px;align-items:center"><button class="histdet" style="flex:1">${histDetail ? "DETAILED ▲ (tap for simple)" : "SIMPLE ▼ (tap for detailed)"}</button>${isGM && !standalone ? clearBtn("rs", "CLEAR HISTORY") : ""}</div>` +
    (rolls.length ? rolls.slice(0, LOG_MAX).map(line).join("") : `<div class="empty">No rolls yet.</div>`);
  // same list on the DICE tab and in REFERENCE → ROLL HISTORY
  for (const el of [$("history"), $("refRolls")]) if (el) el.innerHTML = html;
  if (GMS) try { gmsSd(); gmsRolls(); testLast(); } catch {}
  if (!standalone) bindClear(document, OBR, () => { gmsSdId = ""; });
  document.querySelectorAll(".histdet").forEach(btn => btn.onclick = (e) => { e.preventDefault(); histDetail = !histDetail; try { localStorage.setItem("ns.histDetail", histDetail ? "on" : "off"); } catch {} render(lastRolls); });
}
// Δ: bring back the Success Delta card (background.html opens it; ‹ › on it pages through the results)
$("sdshow").onclick = () => { try { localStorage.setItem("ns.sdShow", String(Date.now())); } catch {} };
$("histbtn").onclick = () => {
  const h = $("history"); h.hidden = !h.hidden;
  $("histbtn").textContent = h.hidden ? "SHOW ROLL HISTORY" : "HIDE ROLL HISTORY";
};

function showErr(msg) { $("err").textContent = msg; $("err").hidden = !msg; }

$("roll").onclick = async () => {
  showErr("");
  mod = readMod();
  if (mod === null) { showErr("Modifier must be a whole number, like +3 or -1."); return; }

async function bridgeGet(params) {
  const u = new URL(BRIDGE); Object.entries({ code: store.get("ns.code"), ...(campaign ? { campaign } : {}), ...params }).forEach(([k, v]) => u.searchParams.set(k, v));
  const res = await fetch(u); return res.json();
}
async function bridgePost(body) {

// Saved copies so the last thing you saw shows instantly, while a fresh copy loads in the background
const cache = {
  get: (k) => { try { return JSON.parse(localStorage.getItem("ns.cache." + k) || "null"); } catch { return null; } },
  set: (k, v) => {
    if (/^ma\./.test(k) && v && v.pogUrl) { const { pogUrl, ...rest } = v; v = rest; } // the ring preview is redrawn, not stored
    if (v == null && /^(ma|pt)\./.test(k)) { try { localStorage.removeItem("ns.cache." + k); } catch {} return; }
    lsSet("ns.cache." + k, JSON.stringify(v));

};

async function showSheetTab() {
  if (!store.get("ns.code") || (!isGM && !sheetId())) return connectForm();
  $("sh").innerHTML = `<div class="empty">Loading…</div>`;
  try {
    if (isGM) {
      let list;

      if (saved?.length) { list = { sheets: saved }; refreshCharList(); }
      else {
        $("sh").innerHTML = `<div class="empty">Finding characters…</div>`;
        try { list = { sheets: await characterSheets() }; }
        catch (e) { if (/code/i.test(e.message)) store.set("ns.code", ""); return connectForm(e.message); }
      }
      let cur = sheetId();
      if (cur !== "__party" && !list.sheets.some(f => f.id === cur)) cur = list.sheets[0]?.id || "__party";
      setSheetId(cur);
      $("sh").innerHTML = `<select id="pick"><option value="__party" ${cur === "__party" ? "selected" : ""}>★ Party overview</option>${list.sheets.map(f => `<option value="${f.id}" ${f.id === cur ? "selected" : ""}>${esc2(f.name)}</option>`).join("")}</select><div id="shbody"></div>`;
      $("pick").onchange = () => { setSheetId($("pick").value); $("pick").value === "__party" ? showParty() : loadSheet(); };
      return cur === "__party" ? showParty() : loadSheet();
    }
    // players: switch between their own sheet and the party overview
    $("sh").innerHTML = `<div class="g2" style="margin:0 0 4px"><button id="vMine" class="sbtn on">MY CHARACTER</button><button id="vParty" class="sbtn">PARTY</button></div><div id="shbody"></div>`;

    $("vParty").onclick = () => { $("vParty").classList.add("on"); $("vMine").classList.remove("on"); showParty(); };
    await loadSheet();
  } catch (e) { $("sh").innerHTML = `<div class="err">Couldn't reach the sheet bridge: ${esc2(e.message || e)}</div>`; }
}

async function loadSheet(quiet) {
  if (!quiet) mgrOn = false;
  partyOn = false;
  const id = sheetId(), saved = cache.get("sheet." + id);
  if (!quiet) {
    if (saved) { sheetVals = saved; drawSheet(); quiet = true; } // show the saved copy right away
    else $("shbody").innerHTML = `<div class="empty">Loading character…</div>`;
  }
  sync(1);
  const gen = writeGen;
  const r = await bridgeGet({ id }).catch(e => ({ ok: false, error: e.message }));
  sync(-1);
  if (id !== sheetId() || partyOn) return; // switched away while loading
  if (gen !== writeGen || busy) return; // a save happened while this was loading, so this copy is old
  if (!r.ok && quiet) return; // background refresh failed: keep what's on screen
  if (!r.ok) {
    if (/code/i.test(r.error || "")) store.set("ns.code", "");
    if (!isGM) setSheetId("");
    return connectForm(r.error);
  }
  cache.set("sheet." + id, r.values);
  const ptWas = ptT(id), ptKnown = ptBridge; notePt(id, r);
  if (JSON.stringify(r.values) === JSON.stringify(sheetVals) && $("shbody")?.querySelector(".fld") && ptWas === ptT(id) && ptKnown === ptBridge) return; // nothing changed
  sheetVals = r.values; drawSheet(); defReq(); initReq();
}

function list(cells) { return cells.map(V).filter(Boolean); }
function coSlots() {
  // 10 boxes in column G under the "Combat Options" heading (they run past the Untrained Skills heading row), never into Inventory/Notes
  const L = layout(), stop = L.untrained[1];
  for (let r = 1; r < L.untrained[0]; r++) if (V("G" + r).toLowerCase() === "combat options") { const out = []; for (let i = r + 1; i <= Math.min(r + 10, stop); i++) out.push("G" + i); return out; }
  return ["G32", "G33", "G34", "G35", "G36", "G37", "G38", "G39", "G40", "G41"];
}

// Find each section by its heading in column B, so sheets with extra rows (like a longer inventory) still work
function layout() {
  const at = (label, from = 1) => { for (let i = from; i <= (curVals()?.length || 0); i++) if (V("B" + i).toLowerCase() === label) return i; return 0; };
  const tr = at("trained skills") || 19, ut = at("untrained skills", tr + 1) || 36, inv = at("inventory", ut + 1) || 45;
  const end = Math.max(inv + 30, curVals()?.length || 0);
  // current layout: Inventory | Equipped | Notes side by side from the Inventory row down, as long as they need
  if (V("G" + inv).toLowerCase() === "notes") return { trained: [tr + 1, ut - 1], untrained: [ut + 1, inv - 1], inv: [inv + 1, end], notes: [inv + 1, end], nc: "G" };
  const cr = at("combat rules", inv + 1) || inv + 14, notes = at("notes", cr + 1) || 71; // older sheets
  return { trained: [tr + 1, ut - 1], untrained: [ut + 1, inv - 1], inv: [inv + 1, cr - 1], notes: [notes + 1, Math.max(notes + 12, sheetVals?.length || 0)], nc: "B" };
}

// ---------------- CHARACTER GENERATOR ----------------
// Walks a player through type, attributes, skills and gear, then the bridge copies the Master into a new character sheet.
const ATTRS = ["Adroitness", "Raw Strength", "Intellect", "Charm"];
const ATTR_COST = { "-3": 0, "-2": 1, "-1": 3, "0": 7, "1": 14, "2": 25, "3": 41 }; // from the Starting Attribute Calculator
const ATTR_SETS = [[1, 1, 0, 0], [2, -1, 0, 0], [3, -2, -3, -3], [1, 1, 1, -3], [2, 1, -1, -3]]; // its preset arrays (42 each)
const LEVEL_SLOTS = [["+1", 1, 1], ["0", 0, 3], ["-2", -2, 2], ["-3", -3, 2]]; // label, level, how many
const GSTEPS = ["Type", "Attributes", "Skills", "Equipment", "Finish"];
let cg = (() => { try { return JSON.parse(localStorage.getItem("ns.cgDraft") || "null"); } catch { return null; } })();
const cgNew = () => ({ step: 0, type: "", god: "", major: "", minor: "", attrs: { Adroitness: -3, "Raw Strength": -3, Intellect: -3, Charm: -3 },
  skills: [], equip: { armor: "", melee: "", ranged: "" }, gear: "", name: "", email: store.get("ns.email"), xpOn: false, xp: 0, preset: null, custom: false });
if (!cg) cg = cgNew();
if (cg.custom === undefined) cg.custom = cg.preset == null && ATTRS.some(a => cg.attrs[a] !== -3); // drafts saved before sets came first
const cgSave = () => { try { localStorage.setItem("ns.cgDraft", JSON.stringify(cg)); } catch {} };
const attrCost = () => ATTRS.reduce((s, a) => s + ATTR_COST[String(cg.attrs[a])], 0);
const rows = (v) => (v || []).map(r => [String(r[1] ?? "").trim(), String(r[2] ?? "").trim(), String(r[3] ?? "").trim()]);

async function skillList() { // [{name, attrs:[...], desc}] from the Master's Skill List tab
  const out = [];
  for (const [num, name, desc] of rows(await getTab("Skill List"))) {
    if (!/^\d+$/.test(num) || !name) continue;
    const main = (desc.match(/^(Adroitness|Raw Strength|Intellect|Charm)/) || [])[1] || "Intellect";
    const alt = (desc.match(/Can use (Adroitness|Raw Strength|Intellect|Charm) or (Adroitness|Raw Strength|Intellect|Charm)/) || []).slice(1).filter(a => ATTRS.includes(a));
    out.push({ name, attrs: alt.length ? alt : [main], desc: desc.replace(/^[A-Za-z ]+:\s*/, "") });
  }

}
// A power's heading on a type tab: "Extraordinary Power: combat (once per day)", "Extraordinary Power: utility (...)",
// or "Meltdown option (...)" (Bullet Stop, which spends the combat use instead of Meltdown)
const PW_HEAD = /^extraordinary power|^meltdown option/i;
async function typeInfo(type) { // rundown rows, first Extraordinary Power, gods (Priest) and schools (Mage)
  const tab = TYPES.find(x => x.trim() === type) || type; // match tab names loosely in case a stray space sneaks into a tab name
  const v = rows(await getTab(tab)), info = { rows: [], power: "", powers: [], gods: [], schools: [] };
  let mode = "", pw = null;
  for (const [a, b, c] of v) {
    // each Extraordinary Power with its rules underneath (stops at the example or the next section)
    if (PW_HEAD.test(a) && b) { pw = { name: b, rules: [] }; info.powers.push(pw); if (!info.power) info.power = b; continue; }
    // "Part of Ghost in the Machine (no extra use)": Sleeper Code's rules go under that power, not as a power of its own
    const part = /^part of (.+?)\s*\(/i.exec(a);
    if (part && b) { pw = info.powers.find(p => p.name.toLowerCase() === part[1].toLowerCase()) || pw; if (pw) pw.rules.push([b.toUpperCase() + " (part of it, no extra use)", ""]); continue; }
    if (pw) {
      if (/^example/i.test(a) || (a && a === a.toUpperCase() && /[A-Z]/.test(a))) pw = null;
      else { if (a || b) pw.rules.push([a, b]); continue; }
    }
    if (/^the gods$/i.test(a)) { mode = "gods"; continue; }
    if (/^schools of magic$/i.test(a)) { mode = "schools"; continue; }
    if (mode === "gods" && a) { info.gods.push([a, b]); continue; }
    if (mode === "schools") { if (!a || (a === a.toUpperCase() && /[A-Z]/.test(a))) mode = "end"; else { info.schools.push([a, b, c]); continue; } } // one school per row, stops at the next blank row
    if (/^(who they are|suggested skills|always on|daily use)/i.test(a) && b) info.rows.push([a, b]);
  }
  return info;
}

  if (!on.length && !monDeadName(who)) on = cards.filter(card => !!cur && card.dataset.g === cur && !card.classList.contains("dead"));

      card.querySelector(".mnext").onclick = (e) => { e.stopPropagation(); initStep(1); }; }

async function initStep(d) {
  const m = await OBR.room.getMetadata(); if (!m[INIT]?.open) return;
  // monster groups: one member at a time, skipping dead ones
  let x = m, nx = null; for (let k = 0; k < 60; k++) { nx = initMove(x, d); if (!nx) break; x = { ...x, [INIT]: nx }; if (!(isGM && monDeadName(turnNames(x).cur))) break; }

async function callInitiative() {
  // A second tap within a minute, before turns start, keeps the same initiative instead of wiping everyone's rolls
  // (a double tap or "tap again" used to start a new one, and rolls already made for the first one were lost)
  const old = (await OBR.room.getMetadata())[INIT];
  if (old?.open && !old.cur && Date.now() - (old.at || 0) < 60e3) return;
  const sid = crypto.randomUUID().slice(0, 8);

}

}

// Each monster group rolls once into the fight that's on (CALL FOR INITIATIVE & ROLL MONSTERS starts it first)
async function rollMonsterInit() {
  const v = monVals || [], c = (row, i) => String(v[row]?.[i] ?? "").trim();
  if (!v.length) { gmNote("Fight started, but no monsters are loaded. Open an encounter on the GM tab, then add them by hand or call again.", "WARNING"); return; }
  const sid = (await OBR.room.getMetadata())[INIT].sid;
  const have = new Set(((await OBR.room.getMetadata())[INIT + "/m"] || []).filter(e => e.sid === sid).map(e => e.id));
  const hdr = Math.max(0, v.findIndex(r => String(r?.[0] || "").trim().toLowerCase() === "name"));
  const groups = new Map();
  for (let row = hdr + 1; row < v.length; row++) {
    const name = c(row, 0); if (!name || /^(true|x|yes|dead)$/i.test(c(row, 19))) continue;
    const g = c(row, 1) || name;
    if (!groups.has(g)) groups.set(g, { adr: parseInt(c(row, 4)) || 0, n: 0, mem: [] });
    groups.get(g).n++; groups.get(g).mem.push(name);
  }
  const add = [];
  for (const [g, info] of groups) {
    const id = "m:" + g; if (have.has(id)) continue;
    const dice = [rollDie(), rollDie(), rollDie(), rollDie()], total = dice.reduce((a, b) => a + b, 0) + info.adr;
    const label = info.n > 1 ? `${g} ×${info.n}` : g;
    add.push({ id, sid, name: label, total, adr: info.adr, pc: false, r: Math.random(), mem: info.mem.slice(0, 20) });
    const roll = { id: crypto.randomUUID().slice(0, 8), pid: me || "local", who: label, label: "Adroitness · Initiative", dice, mod: info.adr, total, ts: Date.now() };
    try { localStorage.setItem("ns.toastReq", JSON.stringify(roll)); } catch {}
    await saveRoll(roll);
  }
  const cur = (await OBR.room.getMetadata())[INIT + "/m"] || [];

}

// Optional picture per character. The add-on resizes it, the Sheet Bridge saves the full picture in the GM's
// Character Portraits folder and a small copy for the table. The bridge says each sheet's portrait time
// ("portrait" on every sheet read; 0 = none), so the small copy is only fetched again when it changes.
const ptStamp = new Map();          // sheet id -> upload time (0 = none)
let ptBridge = null;                // true: the bridge knows portraits; false: it needs redeploying; null: not known yet
let ptBusy = false;
const ptMem = new Map(), ptLoading = new Map();
const PT_TYPES = ["image/jpeg", "image/png", "image/webp", "image/gif"];
const ptHidden = () => store.get("ns.ptHide") === "1";
const ptT = (id) => ptStamp.has(id) ? ptStamp.get(id) : (cache.get("ptt." + id) || 0);
function notePt(id, r) {
  if (!r || !r.ok) return;
  if ("portrait" in r) { ptBridge = true; ptStamp.set(id, r.portrait || 0); cache.set("ptt." + id, r.portrait || 0); }
  else if (ptBridge === null) ptBridge = false;
}
function ptGet(id) { // {url, f} of the current portrait's small copy and its framing (null if none)
  const t = ptT(id); if (!t) return Promise.resolve(null);
  const m = ptMem.get(id); if (m && m.t === t) return Promise.resolve(m);
  const c = cache.get("pt." + id); if (c && c.t === t) { ptMem.set(id, c); return Promise.resolve(c); }
  if (ptLoading.has(id)) return ptLoading.get(id);
  const p = bridgeGet({ portrait: id }).then(r => {
    if (!r.ok || r.none) { if (r.ok) { ptStamp.set(id, 0); cache.set("ptt." + id, 0); } return null; }
    const v = { t: r.t, url: `data:${r.mime};base64,${r.data}`, f: r.frame || null };
    ptStamp.set(id, r.t); ptMem.set(id, v); cache.set("pt." + id, v); return v;
  }).catch(() => null).finally(() => ptLoading.delete(id));
  ptLoading.set(id, p); return p;
}
const ptSmall = (id) => ptGet(id).then(v => v ? v.url : "");
// place a picture inside its circle: zoom z (1 = just fills the circle), x/y 0-100 = which part shows
function ptPlace(im, f) {
  const go = () => {
    const a = im.naturalWidth / im.naturalHeight || 1, z = f?.z || 1, x = f?.x ?? 50, y = f?.y ?? 50;
    const W = (a >= 1 ? a : 1) * 100 * z, H = (a >= 1 ? 1 : 1 / a) * 100 * z;
    Object.assign(im.style, { position: "absolute", maxWidth: "none", objectFit: "fill", width: W + "%", height: H + "%", left: (100 - W) * x / 100 + "%", top: (100 - H) * y / 100 + "%" });
  };

}

const blobB64 = (blob) => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.onerror = () => rej(new Error("couldn't read the picture")); fr.readAsDataURL(blob); });
async function ptEncode(bmp, max, mime, q) { // shrink to fit max×max and encode
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height)), w = Math.max(1, Math.round(bmp.width * k)), h = Math.max(1, Math.round(bmp.height * k));

async function ptUpload(file) {

    if (!r.ok) throw new Error(/wrong table code/i.test(r.error || "") ? ptBridgeMsg(r.error) : /nothing to change/i.test(r.error || "") ? "the Sheet Bridge needs updating first (ask your GM)." : /failed to fetch/i.test(r.error || "") ? "the Sheet Bridge didn't answer. Try again." : r.error);
    const v = { t: r.t, url: `data:${small.mime};base64,${small.data}` };
    ptStamp.set(id, r.t); cache.set("ptt." + id, r.t); ptMem.set(id, v); cache.set("pt." + id, v); ptBridge = true;
    if (ptP.id === id) { ptP.pics = null; ptP.sel = ""; ptP.edit = false; ptP.msg = ["ok", "Picture added. It's your portrait now. Tap ✎ ADJUST CIRCLE to frame it."]; }

    return true;
  } catch (e) {
    ptBusy = false; if (!partyOn && sheetId() === id) drawSheet();
    ptErr("Couldn't save the picture: " + (e.message || e));

}
// the current portrait changed: new time stamp, drop the old small copy so the new one is fetched
function ptChanged(id, t) {

// A pog = the picture in a circle (same framing as the portrait) + the table's ring. Every pog uses POG_STYLE.
const POG_STYLE = "neon";
const POG_STYLES = {
  neon:   { name: "Neon (cyan / magenta)", a: "#19e6ff", b: "#ff2bd6", c: "#7a5cff", glow: "#19e6ff" },
  acid:   { name: "Acid (green / cyan)",   a: "#7dff3a", b: "#00e5c7", c: "#d6ff3a", glow: "#7dff3a" },
  amber:  { name: "Amber (gold / orange)", a: "#ffd23a", b: "#ff7a1a", c: "#ffb000", glow: "#ffb000" },
  enemy:  { name: "Enemy (red / orange)",  a: "#ff2b3d", b: "#ff8a1a", c: "#d4002f", glow: "#ff2b3d" },
  violet: { name: "Violet (purple / pink)", a: "#b388ff", b: "#ff4fa3", c: "#6a5cff", glow: "#b388ff" },

function drawPog(img, f, style, S = 512) {

  const band = g.createLinearGradient(0, 0, S, S); band.addColorStop(0, "#353b52"); band.addColorStop(.45, "#0c0f19"); band.addColorStop(1, "#2c3145");
  g.fillStyle = band; g.fill();

  g.restore();

  g.save(); g.fillStyle = neon(); g.shadowColor = st.glow; g.shadowBlur = 10 * k;
  for (let i = 0; i < 4; i++) { const ang = i * Math.PI / 2 + Math.PI / 4; g.save(); g.translate(c, c); g.rotate(ang); g.fillRect(R - 16 * k, -4 * k, 14 * k, 8 * k); g.restore(); }

  g.save(); g.strokeStyle = neon(); g.lineWidth = 5 * k; g.shadowColor = st.glow; g.shadowBlur = 10 * k; g.beginPath(); g.arc(c, c, r0 + 2.5 * k, 0, Math.PI * 2); g.stroke(); g.restore();

  g.save(); g.strokeStyle = "rgba(220,235,255,.5)"; g.lineWidth = 2 * k;

    g.beginPath(); g.moveTo(c + Math.cos(ang) * r1, c + Math.sin(ang) * r1); g.lineTo(c + Math.cos(ang) * r2, c + Math.sin(ang) * r2); g.stroke(); }
  g.restore();
  // glossy highlight on the top-left of the band
  g.save(); g.beginPath(); g.arc(c, c, R - 1.5 * k, Math.PI * 1.05, Math.PI * 1.45); g.strokeStyle = "rgba(255,255,255,.45)"; g.lineWidth = 2.5 * k; g.stroke(); g.restore();

}

const sleep = (ms) => new Promise(r => setTimeout(r, ms));
async function pogDrop(pogId, itemName) {
  if (!OBR.isReady) throw new Error("this only works inside Owlbear Rodeo");
  if (!pogId) throw new Error("there's no pog yet. Tap MAKE POG first.");
  if (!(await OBR.scene.isReady())) throw new Error("no map is open yet. Wait for the GM to open a scene.");
  const vw = await OBR.viewport.getWidth(), vh = await OBR.viewport.getHeight();
  let pos = await OBR.viewport.inverseTransformPoint({ x: vw / 2, y: vh / 2 });
  try { pos = await OBR.scene.grid.snapPosition(pos); } catch {}
  const item = buildImage({ url: pogSrc(pogId), mime: "image/png", width: 512, height: 512 }, { dpi: 512, offset: { x: 256, y: 256 } })
    .name(itemName).plainText(itemName).textType("PLAIN").position(pos).layer("CHARACTER").build();
  const landed = async () => { try { return (await OBR.scene.items.getItems([item.id])).length > 0; } catch { return false; } };
  const gm = (await OBR.player.getRole()) === "GM";
  const may = gm || await OBR.player.hasPermission("CHARACTER_CREATE").catch(() => true);
  if (may) { try { await OBR.scene.items.addItems([item]); } catch {} for (let i = 0; i < 4; i++) { await sleep(250); if (await landed()) return; } }
  if (gm) throw new Error("Owlbear didn't take it. Try again.");
  await OBR.broadcast.sendMessage("com.newscolos.pogreq", { item }, { destination: "REMOTE" });
  for (let i = 0; i < 24; i++) { await sleep(250); if (await landed()) return; }
  throw new Error("this room doesn't let players add tokens, and the GM's Owlbear didn't place it either. The GM needs to be in the room (or turn on players adding Characters in the room settings).");
}

function gmStrip(v, cell) {
  const n = (a1) => num(cell(v, a1)), sg = (x) => x > 0 ? "+" + x : String(x);
  const name = cell(v, "C3"), type = cell(v, "C4");
  // an armor power that's on (Bullet Stop +2, Avatar +1) counts toward their Armor Bonus
  const pw = partyAct.find(p => p.name === name), extra = (pw && ACTIVE[pw.n]?.armor) || 0;
  const adr = n("C7"), arm = n("H25"), cop = n("H29"), copMax = n("H28"), pts = n("F13"), ptsMax = num(/^\d+$/.test(cell(v, "H13")) ? cell(v, "H13") : cell(v, "G13"));
  const cred = n("F7"), lvl = n("F5"), xp = n("F3"), pen = n("C12");
  const chip = (k, val, cls = "", tip = "") => `<span class="gmc ${cls}" ${tip ? `title="${esc2(tip)}"` : ""}><small>${k}</small><b>${val}</b></span>`;
  const out = [];

  if (arm != null) out.push(chip("ARMOR", sg(arm + extra) + (extra ? `<i>+${extra}</i>` : ""), "def" + (extra ? " pwr" : ""), extra ? `Armor Bonus ${sg(arm)}, plus ${extra} from ${ACTIVE[pw.n]?.t || "a power"}` : "Armor Bonus"));
  // H29 is points SPENT (since Nov 25), so left = max - spent
  if (copMax) { const cl = Math.max(0, copMax - (cop ?? 0)); out.push(chip("COP", `${cl}/${copMax}`, cl <= 0 ? "empty" : "", "Combat Option Points left")); }
  const pt = /mage/i.test(type) ? "SP" : /priest/i.test(type) ? "INV" : "";
  if (pt && (pts != null || ptsMax != null)) out.push(chip(pt, `${pts ?? 0}${ptsMax != null ? "/" + ptsMax : ""}`, (pts ?? 0) <= 0 ? "empty" : "", pt === "SP" ? "Spell Points left" : "Invocations left"));
  out.push(chip("¤", (cred ?? 0).toLocaleString("en-US"), "cred", "Credits"));
  if (lvl != null) out.push(chip("LVL", String(lvl), "", "Level"));
  if (xp) out.push(chip("XP", String(xp), "xp", "Unspent XP"));

}

    const v = monVals, hdr = Math.max(0, v.findIndex(r => String(r?.[0] || "").trim().toLowerCase() === "name"));
    for (let row = hdr + 1; row < v.length; row++) {
      const r = v[row] || [], c = (i) => String(r[i] ?? "").trim();
      if (!c(0) || !/\b(mook|minion)s?\b/i.test(c(0) + " " + c(2))) continue;
      if ([12, 13, 14, 15, 16, 17, 18].some(i => c(i)) || /^(true|x|yes|dead)$/i.test(c(19))) continue; // already started
      for (const col of [16, 17, 18]) await monSet(row + 1, col, true);
    }

}
// The engine: new Success Delta results (this screen's list, written by the background page) -> wounds
let adBusy = false, adAgain = false;
async function autoDamage() {
  if (standalone || !isGM || UPLINK) return; // the main panel or the Party pop-out, whichever is open (the done-list stops doubles)
  if (adBusy) { adAgain = true; return; } adBusy = true;
  try {
    const md0 = await OBR.room.getMetadata(); lastMd = md0;
    const since = adSince(md0); if (!since) return;
    const KEY = "ns.adDone:" + OBR.room.id;
    let list = []; try { list = JSON.parse(localStorage.getItem("ns.sd:" + OBR.room.id) || "{}").list || []; } catch {}
    let done = []; try { done = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch {}
    for (const e of list) {
      try { done = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch {}
      if (done.includes(e.id)) continue;
      done = [...done, e.id].slice(-60); store.set(KEY, JSON.stringify(done)); // never twice, even if something fails below
      if (!e.ts || e.ts < since || Date.now() - e.ts > 10 * 60e3) continue;
      const R = sdResult(e); if (!R.hit || !R.w) continue; // miss, armor held, or spell damage unknown
      const t = await applyWound(e.def, R.w).catch(x => "Auto damage failed: " + (x?.message || x));
      if (t) { const md = await OBR.room.getMetadata(), ap = Array.isArray(md[APPLIED]) ? md[APPLIED] : [];
        await OBR.room.setMetadata({ [APPLIED]: [{ id: e.id, t }, ...ap].slice(0, 8) }).catch(() => {}); }
    }
  } finally { adBusy = false; if (adAgain) { adAgain = false; autoDamage(); } }
}
async function applyWound(name, w) {
  const start = BOX_START[w];
  const pick = (marks) => { for (let i = start; i < 7; i++) if (!marks[i]) return i; return -1; };
  const said = (i) => i < 0 ? `${name} is already dead` : `${BOX_NAME[i]} marked on ${name}${i > start ? " (boxes full, moved right)" : ""}`;
  // a monster on the GM tab's encounter?
  if (!monVals && monId()) { const r = await bridgeGet({ id: monId(), tab: "Extension Tracker" }).catch(() => null); if (r?.ok) monVals = r.values; }
  const v = monVals || [], row = v.findIndex((r, i) => i > 0 && nm(r?.[0]) === nm(name));
  if (row > 0) {
    const r = v[row], on = (i) => !!String(r[i] ?? "").trim() && !/^false$/i.test(String(r[i]));
    const i = pick([12, 13, 14, 15, 16, 17, 18].map(on));
    if (i >= 0) { await monSet(row + 1, 13 + i, true); if (i === 6 && !on(19)) await monSet(row + 1, 20, true); }
    monCond(row + 1); return said(i);
  }
  // a character in this room's campaign?
  let chars = cache.get(ck("chars")) || [], c = chars.find(x => nm(x.name) === nm(name));
  if (!c) { chars = await characterSheets().catch(() => chars); c = chars.find(x => nm(x.name) === nm(name)); }
  if (!c) return `Auto damage: couldn't find "${name}" on the GM tab or in the campaign's characters. Mark it by hand.`;
  const r = await bridgeGet({ id: c.id }); if (!r?.ok) throw new Error(r?.error || "couldn't read the sheet");
  const marks = "BCDEFGH".split("").map((_, k) => !!String(r.values?.[15]?.[k + 1] ?? "").trim());
  const i = pick(marks);
  if (i >= 0) {
    const res = await fetch(BRIDGE, { method: "POST", body: JSON.stringify({ code: store.get("ns.code"), id: c.id, wound: i, on: true }) }).then(x => x.json());
    if (!res.ok) throw new Error(res.error + (/permission|access|denied/i.test(res.error || "") ? " (the sheet must be shared with Jake as Editor)" : ""));
    marks[i] = true;
    await OBR.room.setMetadata({ [SHEETPING]: { id: c.id, ts: Date.now(), hurt: 1 } }).catch(() => {});
    if (sheetId() === c.id && !mgrOn) loadSheet(true);
  }
  applyCond(name, marks[5], marks[6]);
  if (marks[6]) initDrop(name);
  return said(i);
}
