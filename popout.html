<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
  html { margin:0; background:transparent; }
  body { margin:0; color:#f1f3f9; font-family:system-ui, sans-serif; min-height:100vh; box-sizing:border-box;
    background:rgba(24,27,42,.72); border:1px solid rgba(255,255,255,.12); border-radius:12px; overflow:hidden auto; }
  body { zoom:0.85; }
  header { display:flex; align-items:center; gap:6px; background:rgba(0,0,0,.55); border-radius:12px 12px 0 0; padding:7px 10px; position:sticky; top:0; }
  header h1 { flex:1; margin:0; font-family:'Bangers', Impact, sans-serif; font-weight:400; font-size:20px; letter-spacing:1px; color:#bb99ff; }
  select { background:rgba(15,17,28,.7); color:#f1f3f9; border:2px solid #444a66; border-radius:6px; padding:3px; max-width:130px; }
  body.solid { background:#222639; }
  body.solid header { background:#000; }
  .hb, #x { background:transparent; border:2px solid #444a66; color:#f1f3f9; border-radius:6px; width:26px; height:26px; cursor:pointer; font-weight:800; padding:0; }
  body.solid .hb { background:#bb99ff; color:#000; }
  #x { background:transparent; border:2px solid #444a66; color:#f1f3f9; border-radius:6px; width:26px; height:26px; cursor:pointer; font-weight:800; }
  main { padding:6px 10px 12px; }
  .rr { padding:4px 4px 6px; font-size:13px; border-top:1px solid #333a55; }
  .rr b { display:block; }
  .oddsw { padding:4px 0 8px; }
  .odds { border-collapse:collapse; font-size:9px; width:100%; table-layout:fixed; }
  .odds th { color:#9aa0b8; font-weight:800; padding:2px 0; text-align:center; white-space:nowrap; overflow:hidden; }
  .odds td { text-align:center; padding:3px 0; border:1px solid rgba(0,0,0,.35); color:#000; font-weight:700; white-space:nowrap; overflow:hidden; letter-spacing:-.2px; }
  .odds .o5 { background:#57bb8a; } .odds .o4 { background:#a8d08d; } .odds .o3 { background:#ffd666; }
  .odds .o2 { background:#f6a35c; } .odds .o1 { background:#e67c73; } .odds .o0 { background:#8a8f9f; }

  .rr.act { background:rgba(61,52,96,.5); border-left:3px solid #6b5aa0; margin-top:6px; padding-top:5px; }
  .rr.act b { color:#e2d8ff; font-size:14px; margin-bottom:1px; }
  .rr.act .cost { display:inline-block; margin-left:4px; padding:0 6px; border:1px solid #5a4b8a; border-radius:5px; background:#2e2a48; color:#c9b8f5; font-size:11px; font-weight:700; vertical-align:1px; }
  .rr.school { background:rgba(61,52,96,.35); border-left:3px solid #6b5aa0; margin-top:6px; padding:5px 8px 6px; }
  .rr.school .sn { color:#bb99ff; font-size:15px; letter-spacing:.3px; }
  .rr.school .sw { font-style:italic; color:#c9cde0; margin-bottom:3px; }
  .rr.school .sv { font-size:12px; color:#c9cde0; margin-bottom:3px; } .rr.school .sv span { color:#9aa0b8; font-weight:700; }
  .rr.school .sz { font-size:12.5px; padding:2px 0; } .rr.school .sz b { display:inline; color:#e2d8ff; }
  .rr.school .cost, .rr.act .cost { display:inline-block; margin-left:4px; padding:0 6px; border:1px solid #5a4b8a; border-radius:5px; background:#2e2a48; color:#c9b8f5; font-size:11px; font-weight:700; vertical-align:1px; }
  .rr.ep { background:rgba(255,176,32,.22); border-left:4px solid #ffb020; }
  .rr.ep b { color:#ffc94d; }
  .rh { padding:8px 4px 2px; font-weight:800; color:#9aa0b8; text-transform:uppercase; font-size:11px; }
  .err { color:#ff6b6b; font-weight:700; }
  .ow { padding:2px 10px 8px; }
  .oh { font-size:11px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; color:var(--accent); margin:9px 0 3px; }
  .oh:first-child { margin-top:4px; }
  .ol { position:relative; padding:2px 0 2px 12px; font-size:13px; line-height:1.4; color:var(--ink); }
  .ol::before { content:""; position:absolute; left:2px; top:9px; width:4px; height:4px; border-radius:50%; background:var(--dim); }
  :root { --paper:rgba(15,17,28,.55); --ink:#f1f3f9; --dim:#9aa0b8; --accent:#bb99ff; --plus:#5fd38d; --minus:#ff6b6b; }
  .dice { display:flex; gap:6px; align-items:center; }
  .die { width:30px; height:30px; border:2px solid var(--ink); border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:900; background:rgba(10,12,20,.6); box-sizing:border-box; }
  .die.p { color:var(--plus); border-color:var(--plus); }
  .die.m { color:var(--minus); border-color:var(--minus); }
  .empty { padding:14px 2px; color:var(--dim); }
</style></head>
<body>
<header><h1 id="t">REFERENCE</h1><select id="pick"></select><button id="op" class="hb" title="See-through / solid">◐</button><button id="x" title="Close">✕</button></header>
<main id="m"><div class="rr">Loading…</div></main>
<script type="module">
import OBR from "https://esm.sh/@owlbear-rodeo/sdk@3.1.0";
import { SECTIONS, REF_GROUPS, sectionHtml, esc2 } from "./rules.js";
import { allRolls, rollLine, ROLL_CSS, rollLog, LOG_MAX } from "./shared.js";
document.head.insertAdjacentHTML("beforeend", `<style>${ROLL_CSS}</style>`);
// Roll History is one of the choices here too (live: new rolls show up as they happen)
const ALL = [["Roll History", "__rolls"], ...SECTIONS];
let rolls = [], cur = "";
const detail = () => { try { return localStorage.getItem("ns.histDetail") === "on"; } catch { return false; } };
function drawRolls() {
  if (cur !== "__rolls") return;
  const d = detail(), m = document.getElementById("m");
  m.innerHTML = `<button id="det" class="histdet">${d ? "DETAILED ▲ (tap for simple)" : "SIMPLE ▼ (tap for detailed)"}</button>` +
    (rolls.length ? rolls.slice(0, LOG_MAX).map(r => rollLine(r, d)).join("") : `<div class="empty">No rolls yet.</div>`);
  document.getElementById("det").onclick = () => { try { localStorage.setItem("ns.histDetail", d ? "off" : "on"); } catch {} drawRolls(); };
}
window.addEventListener("storage", (e) => { if (e.key === "ns.histDetail") drawRolls(); });
if (OBR.isAvailable) OBR.onReady(async () => {
  rolls = rollLog(OBR.room.id, allRolls(await OBR.room.getMetadata())); drawRolls();
  OBR.room.onMetadataChange((md) => { rolls = rollLog(OBR.room.id, allRolls(md)); drawRolls(); });
});
const q = new URLSearchParams(location.search);
const pick = document.getElementById("pick");
pick.innerHTML = REF_GROUPS.map(([g, keys]) => `<optgroup label="${esc2(g)}">${keys.map(k => ALL.find(x => x[1] === k)).filter(Boolean).map(([t, k]) => `<option value="${esc2(k)}">${esc2(t)}</option>`).join("")}</optgroup>`).join("");
async function show(k) {
  pick.value = k; cur = k;
  document.getElementById("t").textContent = (ALL.find(s => s[1] === k)?.[0] || "Reference").toUpperCase();
  if (k === "__rolls") return drawRolls();
  const m = document.getElementById("m");
  m.innerHTML = `<div class="rr">Loading…</div>`;
  try { m.innerHTML = await sectionHtml(k) || `<div class="rr">Nothing here yet.</div>`; }
  catch (e) { m.innerHTML = `<div class="rr err">Couldn't load: ${esc2(e.message || e)}</div>`; }
}
pick.onchange = () => show(pick.value);
// See-through by default; ◐ switches to a solid gray background (remembered)
const solid = (on) => { document.body.classList.toggle("solid", on); try { localStorage.setItem("ns.popSolid", on ? "1" : ""); } catch {} };
try { solid(localStorage.getItem("ns.popSolid") === "1"); } catch {}
document.getElementById("op").onclick = () => solid(!document.body.classList.contains("solid"));
document.getElementById("x").onclick = () => OBR.isAvailable ? OBR.popover.close("com.newscolos.rules") : window.close();
show(q.get("k") || SECTIONS[0][1]);
</script></body></html>
