<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; background:transparent; color:#f1f3f9; font-family:system-ui, sans-serif; overflow:hidden; }
  .t { display:flex; flex-wrap:wrap; align-items:center; gap:3px 6px; padding:5px 10px 6px; }
  .who { flex-basis:100%; font-weight:700; font-size:11px; line-height:1.2; color:#c9cde0; }
  .die { width:22px; height:22px; border:2px solid #f1f3f9; border-radius:5px; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:15px; background:rgba(10,12,20,.6); }
  .p { color:#5fd38d; border-color:#5fd38d; } .m { color:#ff6b6b; border-color:#ff6b6b; }
  .mod { color:#9aa0b8; font-weight:700; font-size:12px; }
  .tot { margin-left:auto; font-family:'Bangers', Impact, sans-serif; font-size:28px; min-width:34px; text-align:right; }
</style></head>
<body><div class="t" id="t"></div>
<script type="module">
  import OBR from "https://esm.sh/@owlbear-rodeo/sdk@3.1.0";
  // Shows one roll passed in the address: ?who=Zak&dice=1,0,-1,1&mod=3&total=4 (&spin=1 for a slot-machine reveal)
  const q = new URLSearchParams(location.search);
  const fmt = (n) => (n > 0 ? "+" : "") + n;
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const dice = (q.get("dice") || "").split(",").map(Number);
  const mod = Number(q.get("mod") || 0);
  document.getElementById("t").innerHTML =
    `<span class="who">${esc(q.get("who") || "")}</span>` +
    dice.map(d => `<span class="die ${d > 0 ? "p" : d < 0 ? "m" : ""}">${d > 0 ? "+" : d < 0 ? "−" : ""}</span>`).join("") +
    (mod ? `<span class="mod">${fmt(mod)}</span>` : "") +
    `<span class="tot" id="tot">${fmt(Number(q.get("total") || 0))}</span>`;
  const faces = [...document.querySelectorAll(".die")];
  let showFor = 5000;
  if (q.get("spin")) {
    showFor = 7000;
    const set = (el, d) => { el.className = "die " + (d > 0 ? "p" : d < 0 ? "m" : ""); el.textContent = d > 0 ? "+" : d < 0 ? "−" : ""; };
    const tot = document.getElementById("tot"); tot.style.visibility = "hidden";
    let locked = 0;
    const tick = setInterval(() => { for (let i = locked; i < faces.length; i++) set(faces[i], Math.floor(Math.random() * 3) - 1); }, 70);
    const lock = () => { set(faces[locked], dice[locked]); locked++; if (locked < faces.length) return setTimeout(lock, 300); clearInterval(tick); tot.style.visibility = "visible"; };
    setTimeout(lock, 700);
  }
  // close this card on its own (works even if the panel that opened it is closed)
  if (OBR.isAvailable) OBR.onReady(() => setTimeout(() => OBR.popover.close("com.newscolos.dice/toast").catch(() => {}), showFor));
</script></body></html>
