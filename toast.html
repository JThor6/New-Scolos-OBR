<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Creepster&family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  html { margin:0; background:transparent; }
  body { margin:0; color:#f1f3f9; font-family:system-ui, sans-serif; overflow:hidden; height:100vh; box-sizing:border-box;
    background:rgba(24,27,42,.45); border:1px solid rgba(255,255,255,.16); border-radius:14px; text-shadow:0 1px 2px rgba(0,0,0,.7); }
  .t { display:flex; flex-wrap:wrap; align-items:center; align-content:center; gap:3px 5px; padding:4px 10px; min-height:100%; box-sizing:border-box; }
  .pn { margin-left:5px; font-size:10px; font-weight:600; color:#9aa0b8; }
  .wnd { flex:none; margin-left:6px; font-size:11px; font-weight:900; color:#ff8f8f; }
  .who { flex-basis:100%; display:flex; align-items:baseline; font-weight:800; font-size:12px; line-height:1.2; color:#c9cde0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .die { width:21px; height:21px; font-size:14px !important; border:2px solid #f1f3f9; border-radius:5px; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:15px; background:rgba(10,12,20,.6); }
  .p { color:#5fd38d; border-color:#5fd38d; } .m { color:#ff6b6b; border-color:#ff6b6b; }
  .mod { color:#9aa0b8; font-weight:700; font-size:12px; }
  .lbl { flex-basis:100%; font-size:12px; line-height:1.3; font-weight:800; color:#bb99ff; overflow-wrap:anywhere; }
  body.pw { background:rgba(70,48,8,.72); border:2px solid #ffc94d; box-shadow:0 0 14px rgba(255,201,77,.55); }
  body.pw .lbl { color:#ffc94d; font-family:'Bangers', Impact, sans-serif; letter-spacing:1px; }
  body.pw .tot { color:#ffc94d; }
  body.ks { background:rgba(120,15,15,.72); border:2px solid #ff4d3d; box-shadow:0 0 14px rgba(255,60,40,.6); }
  body.ks .lbl { color:#ff6b5e; font-family:'Bangers', Impact, sans-serif; letter-spacing:1px; }
  body.ks .tot { color:#ff6b5e; }
  body.cp { background:rgba(10,55,80,.75); border:2px solid #4fc3f7; box-shadow:0 0 14px rgba(79,195,247,.55); }
  body.cp .lbl { flex-basis:auto; color:#7fd4ff; font-family:'Bangers', Impact, sans-serif; letter-spacing:1px; font-size:18px; white-space:nowrap; }
  body.cp .left { flex-basis:100%; font-size:12px; font-weight:800; color:#c9e9ff; }
  body.cp .lbl.con { flex-basis:100%; white-space:normal; line-height:1.05; } body.cp .left.cpl { color:#9fd8f5; font-weight:700; }
  body.ap { background:rgba(45,30,105,.78); border:2px solid #9d86ff; box-shadow:0 0 14px rgba(157,134,255,.6); }
  body.ap .lbl { flex-basis:100%; color:#c7b6ff; font-family:'Bangers', Impact, sans-serif; letter-spacing:1px; font-size:18px; line-height:1.1; }
  body.ap .left { flex-basis:100%; font-size:12px; font-weight:800; color:#e4dcff; }
  body.ap.ksa { background:rgba(120,15,15,.78); border-color:#ff4d3d; box-shadow:0 0 14px rgba(255,60,40,.6); } body.ap.ksa .lbl { color:#ff6b5e; } body.ap.ksa .left { color:#ffc2bb; }
  body.ap.hv { background:linear-gradient(135deg, rgba(70,20,90,.85), rgba(20,40,100,.85)); border-color:#ff7ad9; box-shadow:0 0 16px rgba(255,122,217,.55); } body.ap.hv .lbl { color:#ffb3ec; text-shadow:0 0 8px #ff7ad9; } body.ap.hv .left { color:#ffe6f7; }
  body.ap.dm { background:rgba(35,3,8,.88); border-color:#b3122e; box-shadow:0 0 14px rgba(179,18,46,.6), inset 0 0 14px rgba(179,18,46,.35); } body.ap.dm .lbl { color:#ff4d6a; letter-spacing:3px; } body.ap.dm .left { color:#f3d6db; font-style:italic; }
  body.ap.dp { background:rgba(70,48,8,.78); border-color:#ffc94d; box-shadow:0 0 14px rgba(255,201,77,.5); } body.ap.dp .lbl { color:#ffc94d; } body.ap.dp .left { color:#ffe6a8; }
  body.ap.av { background:linear-gradient(135deg, rgba(25,60,120,.85), rgba(110,30,120,.85)); border-color:#e8b5ff; box-shadow:0 0 16px rgba(199,125,255,.65); } body.ap.av .lbl { color:#ffd9ff; text-shadow:0 0 8px #c77dff; }
  body.ap.ff { background:rgba(5,45,60,.82); border-color:#3ee6ff; box-shadow:0 0 14px rgba(62,230,255,.55); } body.ap.ff .lbl { color:#bff7ff; text-shadow:-4px 0 rgba(62,230,255,.55), -8px 0 rgba(62,230,255,.25); }
  body.ap.wr { background:rgba(10,10,14,.55); border:1px dashed rgba(210,210,225,.5); box-shadow:none; } body.ap.wr .lbl { color:rgba(235,235,245,.55); letter-spacing:6px; text-shadow:0 0 8px rgba(255,255,255,.4); } body.ap.wr .left { color:rgba(220,220,230,.6); font-style:italic; }
  body.ap.mm { background:rgba(8,50,52,.82); border-color:#5ff0c8; box-shadow:0 0 14px rgba(95,240,200,.5); } body.ap.mm .lbl { color:#a8ffe6; text-shadow:0 5px 0 rgba(0,0,0,.45); }
  body.ap.rv { background:radial-gradient(circle at 25% 30%, rgba(75,15,100,.92), rgba(12,0,22,.95)); border-color:#8a3fd1; box-shadow:0 0 18px rgba(140,60,220,.75), inset 0 0 14px rgba(150,255,190,.15); }
  body.ap.rv .lbl { font-family:'Creepster', 'Bangers', Impact, sans-serif; font-size:21px; color:#c6ffd8; text-shadow:0 0 6px #7dffa8, 0 0 16px #8a3fd1; } body.ap.rv .left { color:#d9c8f0; font-style:italic; }
  /* Success Delta: neutral slate card, left of the roll cards. Reads top to bottom:
     who vs who → the delta → the damage sum → where it lands on the Vitality Track */
  body.sd { background:linear-gradient(180deg, rgba(52,57,72,.93), rgba(34,37,48,.93)); border:1px solid rgba(200,206,222,.38); box-shadow:0 4px 16px rgba(0,0,0,.5); text-shadow:none; }
  body.sd .t { display:block; padding:8px 11px 9px; }
  .sdtop { display:flex; align-items:center; gap:8px; }
  .sdk { font-size:9.5px; font-weight:900; letter-spacing:1.6px; color:#9aa2b8; text-transform:uppercase; }
  .sdvs { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:6px; margin-top:4px; }
  .sdp { min-width:0; } .sdp.r { text-align:right; }
  .sdp b { display:block; font-size:12.5px; font-weight:800; color:#eef0f7; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sdp span { font-size:10px; font-weight:700; color:#9aa2b8; letter-spacing:.4px; }
  .sdp span i { font-style:normal; color:#dfe3ef; font-weight:900; }
  .sdbadge { display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:42px; height:38px; padding:0 6px; border-radius:9px;
    background:#1e2130; border:1px solid rgba(255,255,255,.16); }
  .sdbadge b { font-family:system-ui, sans-serif; font-size:21px; font-weight:700; line-height:1; color:#fff; font-variant-numeric:tabular-nums; letter-spacing:-.5px; }
  .sdbadge small { font-size:8px; font-weight:900; letter-spacing:1px; color:#9aa2b8; }
  .sdeqn { display:flex; align-items:stretch; justify-content:center; gap:3px; margin-top:7px; }
  .chip { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:3px 2px 2px; border-radius:7px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08); }
  .chip b { font-size:16px; font-weight:900; color:#f1f3f9; line-height:1.1; font-variant-numeric:tabular-nums; }
  .chip small { font-size:8.5px; font-weight:800; letter-spacing:.3px; color:#9aa2b8; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .chip.wide { flex:1.7; } .chip.res { flex:1.2; } .chip.d0 { flex:.85; }
  .chip small { white-space:normal; text-align:center; line-height:1.05; }
  .chip.res { background:rgba(255,255,255,.14); border-color:var(--wc, rgba(255,255,255,.3)); } .chip.res b { color:var(--wc, #fff); }
  .op { align-self:center; font-size:14px; font-weight:900; color:#7d859c; }
  .sdhead { display:flex; align-items:baseline; justify-content:space-between; gap:6px; margin-top:6px; }
  .sdh1 { white-space:nowrap; font-family:'Bangers', Impact, sans-serif; font-size:20px; letter-spacing:1px; line-height:1; color:var(--wc, #eef0f7); }
  .sdh1.glow { text-shadow:0 0 10px var(--wc); }
  .sdh2 { font-size:10px; font-weight:700; color:#aab1c5; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track { display:grid; grid-template-columns:repeat(5, 1fr); gap:3px; margin-top:5px; }
  .seg { height:17px; border-radius:4px; background:rgba(255,255,255,.07); display:flex; align-items:center; justify-content:center; font-size:8.5px; font-weight:900; color:#727a90; letter-spacing:.3px; }
  .seg.on { color:#16131a; box-shadow:0 0 9px var(--sc); transform:scaleY(1.12); }
  .seg.past { opacity:.55; }
  .sdmiss { margin-top:8px; display:flex; align-items:center; gap:8px; }
  
  /* resting the mouse on a card keeps it up */
  body.hold { border-color:rgba(255,255,255,.55) !important; }
  .tot { margin-left:auto; font-family:'Luckiest Guy', 'Bangers', Impact, sans-serif; font-size:23px; min-width:30px; text-align:right; padding-top:2px; }
</style></head>
<body><div class="t" id="t"></div>
<script type="module">
  import OBR from "https://esm.sh/@owlbear-rodeo/sdk@3.1.0";
  import { POWER_CARDS, powerCard, sdResult, WOUND_STEPS, BONUS_NAME } from "./shared.js";
  // Shows one roll passed in the address: ?who=Zak&dice=1,0,-1,1&mod=3&total=4 (&spin=1 for a slot-machine reveal)
  const q = new URLSearchParams(location.search);
  // A stale background page (GitHub still serving an old copy for a few minutes) once sent a Success Delta "waiting" card here,
  // which showed as an empty card with 0. The Success Delta card has its own page now (sdcard.html), so close anything like that.
  if (q.get("sdw") || (!q.get("dice") && !q.get("sd") && !q.get("cop") && !q.get("ap") && !q.get("bs"))) {
    document.body.style.display = "none"; if (OBR.isAvailable) OBR.onReady(() => OBR.popover.close(q.get("id") || "com.newscolos.dice/toast").catch(() => {}));
  }
  const fmt = (n) => (n > 0 ? "+" : "") + n;
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const dice = (q.get("dice") || "").split(",").map(Number);
  const mod = Number(q.get("mod") || 0);
  // "(wounded -1)" goes up on the name line so a long skill name can never push it out of sight
  let label = q.get("label") || "", wnd = q.get("wnd") ? "wounded " + q.get("wnd") : "";
  const wm = label.match(/\s*\((wounded [^)]*)\)\s*$/i); if (wm) { wnd = wnd || wm[1]; label = label.slice(0, wm.index); }
  const lsize = label.length > 44 ? 10 : label.length > 30 ? 11 : 12; // long skill names get a smaller font
  document.getElementById("t").innerHTML =
    `<span class="who"><span style="overflow:hidden;text-overflow:ellipsis">${esc(q.get("char") || q.get("who") || "")}${q.get("char") ? `<span class="pn">${esc(q.get("who") || "")}</span>` : ""}</span>${wnd ? `<span class="wnd">${esc(wnd)}</span>` : ""}</span>` +
    dice.map(d => `<span class="die ${d > 0 ? "p" : d < 0 ? "m" : ""}">${d > 0 ? "+" : d < 0 ? "−" : ""}</span>`).join("") +
    (mod ? `<span class="mod">${fmt(mod)}</span>` : "") +
    `<span class="tot" id="tot">${fmt(Number(q.get("total") || 0))}</span>` +
    (label ? `<span class="lbl" style="font-size:${q.get("ks") || q.get("pw") ? 15 : lsize}px">${esc(label)}</span>` : "");
  // Always fit: if the label doesn't fit in the card, shrink it (half a point at a time) until everything shows.
  const fit = () => { const b = document.body, l = document.querySelector(".lbl"); if (!l) return;
    const over = () => b.scrollHeight > b.clientHeight + 1;
    let s = parseFloat(l.style.fontSize) || parseFloat(getComputedStyle(l).fontSize) || 12;
    // big titles (Combat Option names) come down to 13 first, then the small lines under them shrink, then the title again
    while (over() && s > 13) { s -= 0.5; l.style.fontSize = s + "px"; }
    const sm = [...document.querySelectorAll(".left")]; let t = 12;
    while (sm.length && over() && t > 8) { t -= 0.5; sm.forEach(x => x.style.fontSize = t + "px"); }
    while (over() && s > 6) { s -= 0.5; l.style.fontSize = s + "px"; } };
  fit(); if (document.fonts) document.fonts.ready.then(fit);
  if (q.get("cop")) { // Combat Option Point used: who, and how many they have left
    const max = q.get("max");
    document.getElementById("t").innerHTML = `<span class="who"><span style="overflow:hidden;text-overflow:ellipsis">${esc(q.get("char") || q.get("who") || "")}${q.get("char") ? `<span class="pn">${esc(q.get("who") || "")}</span>` : ""}</span></span>` +
      (q.get("con") ? `<span class="lbl cop con">⚔ ${esc(q.get("con").toUpperCase())}</span>` + (q.get("cos") ? `<span class="left">${esc(q.get("cos"))}</span>` : "") : `<span class="lbl cop">⚔ COMBAT OPTION!</span>`) +
      (max && !q.get("nocp") ? `<span class="left cpl">${esc(q.get("total") || "0")} of ${esc(max)} COP left</span>` : "");
    document.body.classList.add("cp"); fit();
  }
  if (q.get("ap")) { // a power that stays on was switched on: who, and what it does
    const pc = powerCard(q.get("ap"), q.get("label"));
    document.getElementById("t").innerHTML = `<span class="who"><span style="overflow:hidden;text-overflow:ellipsis">${esc(q.get("char") || q.get("who") || "")}${q.get("char") ? `<span class="pn">${esc(q.get("who") || "")}</span>` : ""}</span></span>` +
      `<span class="lbl">${esc(pc.t)}</span>` + (pc.s ? `<span class="left">${esc(pc.s)}</span>` : "");
    document.body.classList.add("ap"); if (pc.c) document.body.classList.add(pc.c); fit();
  }
  if (q.get("sd")) { // Success Delta: who vs who, the delta, the damage sum, and where it lands on the Vitality Track
    let e = {}; try { e = JSON.parse(q.get("sd")); } catch {}
    const R = sdResult(e), w = R.w ? WOUND_STEPS[R.w - 1] : null, sg = (n) => n > 0 ? "+" + n : String(n);
    const wc = !R.hit ? "#a9b0c3" : w ? w.c : "#c9cede";
    document.body.style.setProperty("--wc", wc);
    const bk = (BONUS_NAME[e.dbk] || "") + " Damage Bonus";
    const chip = (v, k, cls = "") => `<div class="chip ${cls}"><b>${esc(v)}</b><small>${esc(k)}</small></div>`, op = (o) => `<span class="op">${o}</span>`;
    const versus = `<div class="sdvs"><div class="sdp"><b>${esc(e.att || "")}</b><span>ATTACK <i>${sg(e.at)}</i></span></div>` +
      `<div class="sdbadge"><b>${esc(String(e.delta))}</b><small>DELTA</small></div>` +
      `<div class="sdp r"><b>${esc(e.def || "")}</b><span>DEFENSE <i>${sg(e.dt)}</i></span></div></div>`;
    let body;
    if (!R.hit) body = `<div class="sdeqn">${chip(sg(e.at), "Attack")}${op("−")}${chip(sg(e.dt), "Defense")}${op("=")}${chip(String(e.delta), "Delta", "res")}</div>` +
      `<div class="sdhead"><span class="sdh1">MISS</span><span class="sdh2">${esc(R.sub)}</span></div>`;
    else {
      body = `<div class="sdeqn">${chip(String(e.delta), "Delta", "d0")}${op("+")}${chip(e.db != null ? String(e.db) : "?", bk, "wide")}${op("−")}${chip(e.ab != null ? String(e.ab) : "?", "Armor Bonus")}${op("=")}${chip(R.dmg != null ? String(R.dmg) : "?", "Damage", "res")}</div>` +
        `<div class="sdhead"><span class="sdh1 ${R.w >= 4 ? "glow" : ""}">${esc(R.headline.toUpperCase())}</span><span class="sdh2">${esc(R.tie ? "Tie: attacker wins" : R.dmg == null ? "Add the spell's Damage Bonus" : w ? w.r + " damage" : "No wound")}</span></div>` +
        `<div class="track">${WOUND_STEPS.map(s => `<div class="seg ${s.i === R.w ? "on" : ""}" style="--sc:${s.c};${s.i === R.w ? `background:${s.c}` : ""}">${esc(s.s.toUpperCase())}</div>`).join("")}</div>`;
    }
    document.getElementById("t").innerHTML = `<div class="sdtop"><span class="sdk">Success Delta</span></div>` + versus + body;
    document.body.classList.add("sd");
  }
  if (q.get("ks")) document.body.classList.add("ks"); else if (q.get("pw")) document.body.classList.add("pw");
  const faces = [...document.querySelectorAll(".die")];
  let showFor = 5000;
  if (q.get("spin")) {
    showFor = 7000;
    const set = (el, d) => { el.className = "die " + (d > 0 ? "p" : d < 0 ? "m" : ""); el.textContent = d > 0 ? "+" : d < 0 ? "−" : ""; };
    const tot = document.getElementById("tot"); tot.style.visibility = "hidden";
    let locked = 0;
    const tick = setInterval(() => { for (let i = locked; i < faces.length; i++) set(faces[i], Math.floor(Math.random() * 3) - 1); }, 70);
    const lock = () => { set(faces[locked], dice[locked]); locked++; if (locked < faces.length) return setTimeout(lock, 300); clearInterval(tick); tot.style.visibility = "visible"; };
    setTimeout(lock, 700);
  }
  // fade out, then close this card on its own (works even if the panel that opened it is closed).
  // Resting the mouse on the card keeps it up; after the mouse leaves it stays 3 more seconds, then fades.
  const myId = q.get("id") || "com.newscolos.dice/toast";
  const ms = Number(q.get("ms")) || showFor, AFTER = 3000, FADE = 700;
  const holdKey = "ns.hold:" + myId, hold = (until) => { try { until ? localStorage.setItem(holdKey, String(until)) : localStorage.removeItem(holdKey); } catch {} };
  document.body.style.transition = "opacity .6s";
  let fadeT = 0, closeT = 0, over = false, keep = 0;
  const close = () => { hold(0); if (OBR.isAvailable) OBR.popover.close(myId).catch(() => {}); };
  const schedule = (wait) => { clearTimeout(fadeT); clearTimeout(closeT);
    fadeT = setTimeout(() => { document.body.style.opacity = "0"; }, Math.max(0, wait - FADE));
    closeT = setTimeout(close, wait); };
  document.body.addEventListener("mouseenter", () => { over = true; clearTimeout(fadeT); clearTimeout(closeT);
    document.body.style.opacity = "1"; document.body.classList.add("hold");
    hold(Date.now() + 2000); clearInterval(keep); keep = setInterval(() => over && hold(Date.now() + 2000), 1000); });
  document.body.addEventListener("mouseleave", () => { over = false; clearInterval(keep); document.body.classList.remove("hold");
    hold(Date.now() + AFTER); schedule(AFTER); });
  if (OBR.isAvailable) OBR.onReady(() => schedule(ms)); else schedule(ms);
</script></body></html>
