<style>

  .ibtn:hover { border-color:var(--accent); color:var(--accent); }
  .gcb { display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:4px; }
  .gcb .fld > div { font-size:15px; font-weight:800; }
  .gcb .ctl { justify-content:center; gap:4px; } .gcb .ctl button { padding:0 6px; }
  .dimn { color:var(--ink); }
  .copts { font-size:12px; line-height:1.35; color:var(--ink); background:var(--paper); border:1px solid #444a66; border-radius:7px; padding:4px 7px; margin-top:4px; }
  .skg { display:grid; grid-template-columns:repeat(auto-fill, minmax(135px, 1fr)); gap:3px; }
  .skc { display:flex; align-items:center; gap:4px; background:var(--paper); border:1px solid #444a66; border-radius:6px; padding:3px 3px 3px 6px; font-size:12px; min-width:0; }
  .skc span { flex:1; min-width:0; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; line-height:1.2; }
  .skc b { font-size:14px; min-width:22px; text-align:right; }
  .skc .rd { margin:0; flex:none; }
  .drs { margin-top:8px; }
  details.dr { border:2px solid #000; outline:1px solid #444a66; border-radius:7px; background:var(--paper); margin-top:5px; }
  details.dr summary { cursor:pointer; font-weight:800; font-size:12px; letter-spacing:.5px; padding:5px 8px; }
  details.dr summary small { color:var(--dim); font-weight:700; margin-left:4px; }
  details.dr .drb { padding:0 5px 5px; }
  details.dr .lbox { border-radius:6px; }
  #sh .stab { margin-top:7px; }
  #sh .box { min-height:0; padding:3px 1px; }
  #sh .g2, #sh .g2b, #sh .g3, #sh .g4, #sh .g5 { margin-top:4px; }
  .gsteps { display:grid; grid-template-columns:repeat(5,1fr); gap:3px; margin-bottom:6px; }
  .gstep { padding:3px 1px; border-radius:6px; color:var(--dim); border:1px solid #444a66; background:transparent; font:800 9.5px system-ui; letter-spacing:-.2px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .gstep.on { background:var(--accent); color:#000; border-color:var(--accent); } .gstep.done { color:var(--ink); border-color:#6b5aa0; }
  .gstep:disabled { opacity:.4; cursor:default; } .gstep:not(:disabled):not(.on):hover { border-color:var(--accent); }
  .gsets .on small { color:#000; opacity:.75; }
  .gname { margin:0 0 6px; padding:6px 8px; font-size:15px; font-weight:800; }
  .gscl { font-size:11px; font-weight:800; color:var(--dim); text-transform:uppercase; margin:6px 0 3px; }
  .gsch { display:grid; grid-template-columns:repeat(4,1fr); gap:3px; } .gsch button { font-size:11px; padding:4px 1px; } .gsch button:disabled { opacity:.3; }
  .gpn small { font-size:9px; color:var(--dim); margin-left:4px; }
  .gcust { width:100%; margin-top:6px; font-size:12px; font-weight:700; color:var(--dim); }
  .ginfo { color:var(--dim) !important; }
  .gsum { margin-top:8px; padding:5px 8px; border:1px dashed #444a66; border-radius:7px; font-size:12px; font-weight:700; }
  .gsum small { display:block; color:var(--dim); font-weight:500; font-size:10px; margin-top:2px; }
  .glinks { text-align:right; margin-top:6px; }
  .glink { background:none; border:none; color:var(--dim); font:600 11px system-ui; text-decoration:underline; cursor:pointer; padding:2px; }
  .glink:hover { color:var(--minus); }
  .gslots { display:flex; flex-direction:column; gap:3px; margin:4px 0 6px; }
  .gslg { display:flex; gap:4px; align-items:stretch; }
  .gsll { flex:none; width:28px; display:flex; align-items:center; justify-content:center; font-family:'Bangers', Impact, sans-serif; font-size:18px; background:#000; border-radius:6px; }
  .gslr { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .gslot { display:flex; align-items:center; gap:4px; border-radius:6px; min-height:30px; }
  .gslot.f { background:var(--paper); border:2px solid #444a66; padding:2px 3px; }
  .gslot.f.mv { border-color:var(--accent); background:#3d3460; }
  .gslot.e { width:100%; border:2px dashed #444a66; background:transparent; color:var(--dim); font:700 11px system-ui; cursor:pointer; justify-content:center; }
  .gslot.e:hover, .gslot.e.tg { border-color:var(--accent); color:var(--accent); }
  .gslot.e.dest { border-color:var(--plus); color:var(--plus); }
  .gsi { flex:1; min-width:0; } .gsi small { display:block; color:var(--dim); font-size:10px; margin-top:1px; }
  .gsi select { background:#1b1e2e; color:var(--ink); border:1px solid #444a66; border-radius:5px; font-size:10px; padding:0 2px; width:auto; }
  .gmv { background:transparent; border:none; color:var(--dim); cursor:pointer; font-size:14px; padding:0 2px; }
  .gmv:hover, .gslot.mv .gmv { color:var(--accent); }
  .gdesc { background:var(--paper); border:2px solid #000; border-left:4px solid var(--accent); border-radius:7px; padding:5px 8px; font-size:12px; line-height:1.35; min-height:30px; }
  .gdesc small { color:var(--dim); } .gdesc div { margin-top:2px; }
  .gq { margin-top:6px; padding:5px 8px; font-size:13px; }
  .gsk.seen { outline:1px solid var(--accent); }
  .gsk[hidden] { display:none; }
  #sh .g5 { grid-template-columns:repeat(5,1fr); gap:3px; }
  #sh .att { padding:4px 1px 5px; } #sh .att small { font-size:7.5px; letter-spacing:-.2px; white-space:nowrap; overflow:hidden; } #sh .att b { font-size:19px; display:block; padding-right:9px; }
  #sh .rd.ra { width:15px; height:15px; bottom:1px; right:1px; }
  .err { color:var(--minus); margin-top:8px; font-weight:700; }
  .empty { color:var(--dim); margin-top:8px; }
</style>
</head>
<body>
<header><h1>NEW SCOLOS</h1><span class="hctl"><span id="syncdot" class="syncdot" hidden title="Syncing with Google Sheets">⟳</span><button id="solid" class="tab" title="See-through / solid">◐</button><button id="size" class="tab" title="Change panel size">S</button></span><nav><button class="tab on" data-t="dice">DICE</button><button class="tab" data-t="sheet">SHEET</button><button class="tab" data-t="rules">REFERENCE</button><button class="tab" data-t="gen">CHARACTER GENERATOR</button><button class="tab" data-t="mon" id="monTab" hidden>MONSTERS</button></nav></header>
<div id="initban" class="initban" hidden><span>⚔ Initiative! Your next Adroitness roll counts.</span><button id="initgo">ROLL</button><button id="initx" title="Hide">✕</button></div>
<section id="sheet" hidden><div id="sh"></div></section>
<section id="rules" hidden><div id="ru"></div></section>
<section id="gen" hidden><div id="cg"></div></section>
<section id="mon" hidden><div id="mo"></div></section>
<main id="dice">
  <label>Modifier</label>
  <div style="display:flex;gap:8px;align-items:stretch"><input id="modin" inputmode="numeric" placeholder="0" style="font-size:22px;font-weight:800;text-align:center;width:110px"><button id="modneg" class="negbtn" title="Flip to minus / plus">±</button></div>
  <button id="roll">ROLL</button>
  <div id="err" class="err" hidden></div>
  <div id="last"></div>
  <button id="histbtn" class="histbtn">SHOW ROLL HISTORY</button>
  <div id="history" hidden><div class="empty">No rolls yet.</div></div>
</main>
<script type="module">
import OBR from "https://esm.sh/@owlbear-rodeo/sdk@3.1.0";
import { NS, KEEP, rollKey, allRolls, fmt, INIT, initEntries } from "./shared.js";
import { TYPES, SECTIONS, getTab, sectionHtml } from "./rules.js";

const $ = (id) => document.getElementById(id);
let mod = 0, me = null, standalone = !OBR.isAvailable, localRolls = [];

// Type the modifier: "+3", "-1", "3" or blank (0). Enter rolls.
// Phone number pads have no minus key, so ± flips the sign of whatever is typed
function flipSign(el) {
  const v = el.value.trim().replace("−", "-");
  el.value = v.startsWith("-") ? v.slice(1) : "-" + v.replace(/^\+/, "");
}
$("modneg").onclick = () => flipSign($("modin"));
function readMod() {
  const t = $("modin").value.trim().replace(/^\+/, "").replace("−", "-");
  if (t === "") return 0;
  const n = Number(t);
  return Number.isInteger(n) && Math.abs(n) <= 30 ? n : null;
}
$("modin").onkeydown = (e) => { if (e.key === "Enter") $("roll").click(); };

function rollDie() { const a = new Uint32Array(1); crypto.getRandomValues(a); return (a[0] % 3) - 1; }

function card(r, big) {
  const dice = r.dice.map(d => `<div class="die ${d > 0 ? "p" : d < 0 ? "m" : ""}">${d > 0 ? "+" : d < 0 ? "−" : ""}</div>`).join("");
  const time = new Date(r.ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  return `<div class="card ${big ? "big" : ""}">
    <div class="who">${esc(r.who)}${r.label ? ` <small>${esc(r.label)}</small>` : ""}<small>${time}</small></div>
    <div class="dice">${dice}${r.mod ? `<span class="modtag">${fmt(r.mod)}</span>` : ""}<span class="total">${fmt(r.total)}</span></div>
  </div>`;
}

// Slot-machine reel: faces flicker, then each die locks in left to right, then the total.
const face = (d) => d > 0 ? "+" : d < 0 ? "−" : "";
const cls = (d) => `die ${d > 0 ? "p" : d < 0 ? "m" : ""}`;
function spin(r) {
  return new Promise((done) => {
    $("last").innerHTML = `<div class="card big"><div class="who">Rolling…</div><div class="dice">${
      r.dice.map((_, i) => `<div class="die" id="d${i}"></div>`).join("")}${r.mod ? `<span class="modtag">${fmt(r.mod)}</span>` : ""}<span class="total" id="tot">?</span></div></div>`;
    let locked = 0;
    const tick = setInterval(() => {
      for (let i = locked; i < 4; i++) { const d = rollDie(), el = $("d" + i); el.className = cls(d); el.textContent = face(d); }
    }, 70);
    const lockNext = () => {
      const el = $("d" + locked); el.className = cls(r.dice[locked]); el.textContent = face(r.dice[locked]);
      locked++;
      if (locked < 4) return setTimeout(lockNext, 350);
      clearInterval(tick);
      setTimeout(() => { $("last").innerHTML = card(r, true); done(); }, 300);
    };
    setTimeout(lockNext, 900);
  });
}

// Compact history: one line per roll, newest first.
function line(r) {
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const time = new Date(r.ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  return `<div class="line"><span class="n">${esc(r.who)} <span class="t">${time}</span></span><span class="dice" style="margin:0">${
    r.dice.map(d => `<div class="${cls(d)}">${face(d)}</div>`).join("")}</span><span class="modtag">${r.mod ? fmt(r.mod) : ""}</span>${r.label ? `<span class="lbl">${esc(r.label)}</span>` : ""}<span class="tot">${fmt(r.total)}</span></div>`;
}
function render(rolls) {
  $("history").innerHTML = rolls.length ? rolls.slice(0, 30).map(line).join("") : `<div class="empty">No rolls yet.</div>`;
}
$("histbtn").onclick = () => {
  const h = $("history"); h.hidden = !h.hidden;
  $("histbtn").textContent = h.hidden ? "SHOW ROLL HISTORY" : "HIDE ROLL HISTORY";
};

function showErr(msg) { $("err").textContent = msg; $("err").hidden = !msg; }

$("roll").onclick = async () => {
  showErr("");
  mod = readMod();
  if (mod === null) { showErr("Modifier must be a whole number, like +3 or -1."); return; }
  const dice = [rollDie(), rollDie(), rollDie(), rollDie()];
  const who = standalone ? "Test" : await OBR.player.getName();
  const r = { id: crypto.randomUUID().slice(0, 8), pid: me || "local", who, dice, mod, total: dice.reduce((a, b) => a + b, 0) + mod, ts: Date.now() };
  $("roll").disabled = true;
  await spin(r);
  const err = await saveRoll(r);
  if (err) showErr(err);
  $("roll").disabled = false;
};

// Puts a roll in the shared history. Returns an error message, or "" when it worked.
async function saveRoll(r) {
  if (standalone) { localRolls = [r, ...localRolls]; render(localRolls); return ""; }
  try {
    const key = rollKey(me);
    const md = await OBR.room.getMetadata();
    const mine = Array.isArray(md[key]) ? md[key] : [];
    // Room storage is small (~16 kB): drop roll lists from players who haven't rolled in 2 days (old devices, guests)
    const stale = {}, cutoff = Date.now() - 2 * 864e5;
    for (const [k, v] of Object.entries(md)) {
      if (k !== key && k.startsWith(NS + "/rolls/") && !(Array.isArray(v) && v.some(x => x.ts > cutoff))) stale[k] = undefined;
    }
    await OBR.room.setMetadata({ ...stale, [key]: [r, ...mine].slice(0, KEEP) });
    return "";
    return "";
  } catch (e) { return "Roll didn't reach the table: " + (e?.message || e); }
}

// Quick roll from the sheet: rolls with that number as the modifier and shows it spinning in the bottom-right.
const ROLL_ICON = `<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M8 12h8M12 8v8" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>`;
// One roll at a time: extra clicks while a roll is going (or within 1.5s) are ignored, so mashing can't flood Owlbear
let rollBusy = false;
function setRollBusy(on) { rollBusy = on; document.body.classList.toggle("rollbusy", on); }
async function quickRoll(modText, label, whoName) {
  if (rollBusy) return;
  setRollBusy(true);
  const t0 = Date.now();
  try { await doQuickRoll(modText, label, whoName); }
  finally { setTimeout(() => setRollBusy(false), Math.max(0, 1500 - (Date.now() - t0))); }
}
async function doQuickRoll(modText, label, whoName) {
  const m = parseInt(String(modText).replace("−", "-"), 10) || 0;
  // If the GM called for initiative, a player's next Adroitness roll is their initiative
  let initSid = "";
  if (!standalone && !whoName && label === "Adroitness") {
    const st = (await OBR.room.getMetadata())[INIT];
    if (st?.open && store.get("ns.initDone") !== st.sid) { initSid = st.sid; label = "Adroitness · Initiative"; }
  }
  const dice = [rollDie(), rollDie(), rollDie(), rollDie()];
  const who = whoName || (standalone ? "Test" : await OBR.player.getName());
  const r = { id: crypto.randomUUID().slice(0, 8), pid: me || "local", who, label: String(label || "").slice(0, 40), dice, mod: m, total: dice.reduce((a, b) => a + b, 0) + m, ts: Date.now() };
  // the always-running background page shows it in the bottom-right roll cards
  try { localStorage.setItem("ns.toastReq", JSON.stringify(r)); } catch {}
  const err = await saveRoll(r);
  if (err && $("sherr")) { $("sherr").hidden = false; $("sherr").textContent = err; }
  if (initSid) {
    const name = String(sheetVals?.[2]?.[2] || "").trim() || who;
    await OBR.room.setMetadata({ [`${INIT}/p/${me}`]: { id: me, sid: initSid, name, total: r.total, adr: m, pc: true, r: Math.random() } }).catch(() => {});
    store.set("ns.initDone", initSid);
    updateInitBanner();
  }
}

// ---------------- SHEET TAB ----------------
const BRIDGE = "https://script.google.com/macros/s/AKfycbx5cjtXVGyFeoQx0EzJ-47gk4uXT6mXdgs90zaBmUB-zctUFm6OxD8fyWZWWuUQT0ua/exec";
const store = { get: (k) => { try { return localStorage.getItem(k) || ""; } catch { return ""; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
let isGM = false, sheetVals = null, busy = false;
const esc2 = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const V = (a1) => { const m = a1.match(/^([A-L])(\d+)$/); const row = sheetVals?.[+m[2] - 1] || []; return String(row[m[1].charCodeAt(0) - 65] ?? "").trim(); };

document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === b));
  for (const t of ["dice", "sheet", "rules", "mon", "gen"]) $(t).hidden = b.dataset.t !== t;
  if (b.dataset.t === "gen") showGen();
  if (b.dataset.t === "mon") showMonsters();
  if (b.dataset.t === "sheet") showSheetTab();
  if (b.dataset.t === "rules") showRules();
});

function idFromLink(t) { const m = String(t).match(/\/d\/([a-zA-Z0-9_-]{20,})/); return m ? m[1] : (/^[a-zA-Z0-9_-]{20,}$/.test(t.trim()) ? t.trim() : ""); }

// Step 1: table code (everyone). Step 2 (players only): pick your character from the list. No links to paste.
function connectForm(msg) {
  if (store.get("ns.code") && !isGM && !store.get("ns.sheetId")) return pickCharacter(msg);
  $("sh").innerHTML = `<div class="sec">JOIN THE TABLE</div>
    <label>Table code</label><input id="scode" type="password" placeholder="Your GM gives you this">
    <div class="help">This one code unlocks everything: your character sheet, the party overview and the REFERENCE tab.</div>
    <button id="sgo" class="histbtn">CONTINUE</button>
    <div class="err" ${msg ? "" : "hidden"}>${esc2(msg)}</div>`;
  const go = () => { const code = $("scode").value.trim(); if (!code) return connectForm("Type the table code."); store.set("ns.code", code); store.set("ns.sheetId", isGM ? store.get("ns.sheetId") : ""); showSheetTab(); };
  $("sgo").onclick = go; $("scode").onkeydown = (e) => { if (e.key === "Enter") go(); };
}
async function pickCharacter(msg) {
  $("sh").innerHTML = `<div class="sec">WHICH CHARACTER IS YOURS?</div><div class="empty">Finding characters…</div>`;
  let list;
  try { list = await characterSheets(); }
  catch (e) { if (/code/i.test(e.message)) store.set("ns.code", ""); return connectForm(e.message); }
  $("sh").innerHTML = `<div class="sec">WHICH CHARACTER IS YOURS?</div>
    <div class="help">Tap your character.</div>
    ${list.map(c => `<button class="histbtn pickc" data-id="${c.id}">${esc2(c.name)}</button>`).join("") || `<div class="empty">No characters found. Ask your GM.</div>`}
    <div class="err" ${msg ? "" : "hidden"}>${esc2(msg || "")}</div>
    <button id="chcode" class="sbtn" style="margin-top:10px">Use a different table code</button>`;
  document.querySelectorAll(".pickc").forEach(b => b.onclick = () => { store.set("ns.sheetId", b.dataset.id); showSheetTab(); });
  $("chcode").onclick = () => { store.set("ns.code", ""); connectForm(); };
}

async function bridgeGet(params) {
  const u = new URL(BRIDGE); Object.entries({ code: store.get("ns.code"), ...params }).forEach(([k, v]) => u.searchParams.set(k, v));
  const res = await fetch(u); return res.json();
}
async function bridgePost(body) {
  const res = await fetch(BRIDGE, { method: "POST", body: JSON.stringify({ code: store.get("ns.code"), id: store.get("ns.sheetId"), ...body }) });
  return res.json();
}

// Saved copies so the last thing you saw shows instantly, while a fresh copy loads in the background
const cache = {
  get: (k) => { try { return JSON.parse(localStorage.getItem("ns.cache." + k) || "null"); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem("ns.cache." + k, JSON.stringify(v)); } catch {} },
};
let syncing = 0;
function sync(d) { syncing = Math.max(0, syncing + d); const el = $("syncdot"); if (el) el.hidden = !syncing; }

async function showSheetTab() {
  if (!store.get("ns.code") || (!isGM && !store.get("ns.sheetId"))) return connectForm();
  $("sh").innerHTML = `<div class="empty">Loading…</div>`;
  try {
    if (isGM) {
      let list;
      const saved = cache.get("chars");
      if (saved?.length) { list = { sheets: saved }; refreshCharList(); }
      else {
        $("sh").innerHTML = `<div class="empty">Finding characters…</div>`;
        try { list = { sheets: await characterSheets() }; }
        catch (e) { if (/code/i.test(e.message)) store.set("ns.code", ""); return connectForm(e.message); }
      }
      let cur = store.get("ns.sheetId");
      if (cur !== "__party" && !list.sheets.some(f => f.id === cur)) cur = list.sheets[0]?.id || "__party";
      store.set("ns.sheetId", cur);
      $("sh").innerHTML = `<select id="pick"><option value="__party" ${cur === "__party" ? "selected" : ""}>★ Party overview</option>${list.sheets.map(f => `<option value="${f.id}" ${f.id === cur ? "selected" : ""}>${esc2(f.name)}</option>`).join("")}</select><div id="shbody"></div>`;
      $("pick").onchange = () => { store.set("ns.sheetId", $("pick").value); $("pick").value === "__party" ? showParty() : loadSheet(); };
      return cur === "__party" ? showParty() : loadSheet();
    }
    // players: switch between their own sheet and the party overview
    $("sh").innerHTML = `<div class="g2" style="margin:0 0 4px"><button id="vMine" class="sbtn on">MY SHEET</button><button id="vParty" class="sbtn">PARTY</button></div><div id="shbody"></div>`;
    $("vMine").onclick = () => { $("vMine").classList.add("on"); $("vParty").classList.remove("on"); loadSheet(); };
    $("vParty").onclick = () => { $("vParty").classList.add("on"); $("vMine").classList.remove("on"); showParty(); };
    await loadSheet();
  } catch (e) { $("sh").innerHTML = `<div class="err">Couldn't reach the sheet bridge: ${esc2(e.message || e)}</div>`; }
}

async function loadSheet(quiet) {
  if (!quiet) mgrOn = false;
  partyOn = false;
  const id = store.get("ns.sheetId"), saved = cache.get("sheet." + id);
  if (!quiet) {
    if (saved) { sheetVals = saved; drawSheet(); quiet = true; } // show the saved copy right away
    else $("shbody").innerHTML = `<div class="empty">Loading sheet…</div>`;
  }
  sync(1);
  const r = await bridgeGet({ id }).catch(e => ({ ok: false, error: e.message }));
  sync(-1);
  if (id !== store.get("ns.sheetId") || partyOn) return; // switched away while loading

// Always-on power and the daily Extraordinary Power options, read from the character's type tab in the Master file
async function fillPowers() {
  const type = V("C4").trim().toLowerCase();
  const tab = TYPES.find(t => t.trim().toLowerCase() === type);
  if (!tab || !$("pwlist")) return;
  try {
    const v = await getTab(tab);
    const always = [], daily = [];
    for (const row of v) {
      const b = String(row[1] || "").trim(), c = String(row[2] || "").trim();
      if (/^always on/i.test(b)) { const name = b.replace(/^always on/i, "").replace(/\([^)]*\)/g, "").replace(/^[\s:]+/, "").trim(); always.push(name || c); }
      else if (/^extraordinary power/i.test(b) && c) daily.push(c.replace(/\s*\((once|one) per day\)\s*/ig, " ").trim());
    }
    if ($("pwlist")) $("pwlist").innerHTML =
      (always.length ? `<div><span>ALWAYS ON:</span> ${always.map(esc2).join(", ")}</div>` : "") +
      (daily.length ? `<div><span>DAILY:</span> ${daily.map(esc2).join(" · ")}</div>` : "");
    // the DAILY line already names the power, so drop the separate name line (kept only if the type has no list)
    if ($("pwname") && (always.length || daily.length)) $("pwname").hidden = true;
  } catch { /* the sheet still works without it */ }
}

async function save(body, apply) {
  if (busy) return; busy = true;
  const before = JSON.stringify(sheetVals);
  apply(); drawSheet(); // show it right away
  const r = await bridgePost(body).catch(e => ({ ok: false, error: e.message }));

async function monSet(row, col, on) {
  const before = JSON.stringify(monVals);
  monVals[row - 1] = monVals[row - 1] || []; monVals[row - 1][col - 1] = on ? (col === 20 ? "TRUE" : "X") : "";

  sync(-1);
  if (!r.ok) { monVals = JSON.parse(before); drawMonsters(); $("mo").insertAdjacentHTML("afterbegin", `<div class="err">Didn't save: ${esc2(r.error)}</div>`); }
  else cache.set("mon." + monId(), monVals);
  if (col === 20) syncDeadGroups();
}
// When every monster in a group is dead, take that group off the initiative bar (and back on if one is revived)
async function syncDeadGroups() {
  const v = monVals || [], c = (row, i) => String(v[row]?.[i] ?? "").trim();
  const hdr = Math.max(0, v.findIndex(r => String(r?.[0] || "").trim().toLowerCase() === "name"));
  const alive = new Map();
  for (let row = hdr + 1; row < v.length; row++) {
    const name = c(row, 0); if (!name) continue;
    const g = c(row, 1) || name, dead = /^(true|x|yes|dead)$/i.test(c(row, 19));
    alive.set(g, (alive.get(g) || 0) + (dead ? 0 : 1));
  }
  const md = await OBR.room.getMetadata(), st = md[INIT]; if (!st?.open) return;
  const removed = new Set(st.removed || []);
  for (const [g, n] of alive) { const id = "m:" + g; if (n === 0) removed.add(id); else removed.delete(id); }
  // keep the "×3" count on the bar in step with how many are still alive
  const mlist = (md[INIT + "/m"] || []).map(e => {
    if (e.sid !== st.sid || !e.id.startsWith("m:")) return e;
    const g = e.id.slice(2), n = alive.get(g);
    return n ? { ...e, name: n > 1 ? `${g} ×${n}` : g } : e;
  });
  await OBR.room.setMetadata({ [INIT]: { ...st, removed: [...removed] }, [INIT + "/m"]: mlist });
}

async function callInitiative() {
  const sid = crypto.randomUUID().slice(0, 8);
  await OBR.room.setMetadata({ [INIT]: { sid, open: true, cur: "", round: 1, removed: [], at: Date.now() }, [INIT + "/m"]: [] });
}
async function endInitiative() {

// Each monster group rolls once (4 dice + the first living member's Adroitness) and stays together in the order
async function rollMonsterInit() {
  const md = await OBR.room.getMetadata(), st = md[INIT];
  if (!st?.open) await callInitiative();
  const sid = (await OBR.room.getMetadata())[INIT].sid;
  const have = new Set(((await OBR.room.getMetadata())[INIT + "/m"] || []).filter(e => e.sid === sid).map(e => e.id));
  const v = monVals || [], c = (row, i) => String(v[row]?.[i] ?? "").trim();
  const hdr = Math.max(0, v.findIndex(r => String(r?.[0] || "").trim().toLowerCase() === "name"));
  const groups = new Map();
  for (let row = hdr + 1; row < v.length; row++) {
    const name = c(row, 0); if (!name || /^(true|x|yes|dead)$/i.test(c(row, 19))) continue;
    const g = c(row, 1) || name;
    if (!groups.has(g)) groups.set(g, { adr: parseInt(c(row, 4)) || 0, n: 0 });
    groups.get(g).n++;
  }
  const add = [];
  for (const [g, info] of groups) {
    const id = "m:" + g; if (have.has(id)) continue;
    const dice = [rollDie(), rollDie(), rollDie(), rollDie()], total = dice.reduce((a, b) => a + b, 0) + info.adr;
    const label = info.n > 1 ? `${g} ×${info.n}` : g;
    add.push({ id, sid, name: label, total, adr: info.adr, pc: false, r: Math.random() });
    const roll = { id: crypto.randomUUID().slice(0, 8), pid: me || "local", who: label, label: "Adroitness · Initiative", dice, mod: info.adr, total, ts: Date.now() };
    try { localStorage.setItem("ns.toastReq", JSON.stringify(roll)); } catch {}
    await saveRoll(roll);
  }
  const cur = (await OBR.room.getMetadata())[INIT + "/m"] || [];
  await OBR.room.setMetadata({ [INIT + "/m"]: [...cur.filter(e => e.sid === sid), ...add] });
}
// Add a late arrival by hand (monster or anyone), with their initiative number
async function addInitEntry() {
  const name = $("iName").value.trim(), num = parseInt($("iNum").value.replace("−", "-").replace("+", ""), 10);
  if (!name || isNaN(num)) return;
  const md = await OBR.room.getMetadata(); if (!md[INIT]?.open) await callInitiative();
  const sid = (await OBR.room.getMetadata())[INIT].sid, cur = (await OBR.room.getMetadata())[INIT + "/m"] || [];
  await OBR.room.setMetadata({ [INIT + "/m"]: [...cur.filter(e => e.sid === sid), { id: "x:" + crypto.randomUUID().slice(0, 6), sid, name, total: num, adr: 0, pc: false, r: Math.random() }] });
  $("iName").value = ""; $("iNum").value = "";
}

  if (standalone) return window.open("popout.html?k=" + encodeURIComponent(k));
  const u = new URL("go.html", location.href); u.searchParams.set("p", "popout");
  const ref = new URLSearchParams(location.search).get("obrref"); if (ref) u.searchParams.set("obrref", ref);
  u.searchParams.set("k", k);
  const vw = await OBR.viewport.getWidth(), vh = await OBR.viewport.getHeight();
  OBR.popover.open({ id: "com.newscolos.rules", url: u.href, width: 340, height: Math.max(360, Math.round(vh * 0.75)),
    anchorReference: "POSITION", anchorPosition: { left: vw - 70, top: 70 },
    anchorOrigin: { horizontal: "RIGHT", vertical: "TOP" }, transformOrigin: { horizontal: "RIGHT", vertical: "TOP" },
    disableClickAway: true, hidePaper: true }).catch(() => {});
}
function showRules() {
  if (!store.get("ns.code")) { $("ru").innerHTML = `<div class="empty">Open the SHEET tab and enter the table code first.</div>`; return; }
  if ($("ru").dataset.ready) return;
  $("ru").dataset.ready = "1";
  $("ru").innerHTML = SECTIONS.map(([t, k]) => `<details class="rs" data-k="${k}"><summary>${esc2(t.toUpperCase())}<button class="pop" data-k="${k}" title="Pop out">${POP_ICON}</button></summary><div class="rb"></div></details>`).join("");
  document.querySelectorAll(".pop").forEach(b => b.onclick = (e) => { e.preventDefault(); e.stopPropagation(); popOut(b.dataset.k); });
  document.querySelectorAll("details.rs").forEach(d => d.addEventListener("toggle", async () => {
    const body = d.querySelector(".rb");
    if (!d.open || body.dataset.done) return;
    body.innerHTML = `<div class="rr">Loading…</div>`;
    try { body.innerHTML = await sectionHtml(d.dataset.k) || "<div class='rr'>Nothing here yet.</div>"; body.dataset.done = "1"; }
    catch (e) { body.innerHTML = `<div class="rr err">Couldn't load: ${esc2(e.message || e)}</div>`; }
  }));
}

// Player banner while their initiative roll is still owed (shows even if they missed the pop-up or joined late)
let lastMd = null;
async function updateInitBanner(md) {
  if (standalone || isGM) { $("initban").hidden = true; return; }
  lastMd = md || lastMd || await OBR.room.getMetadata();
  const st = lastMd[INIT];
  const owed = st?.open && !st.cur                                   // turns haven't started yet
    && Date.now() - (st.at || 0) < 3 * 60e3                          // called in the last 3 minutes
    && store.get("ns.initDone") !== st.sid && lastMd[`${INIT}/p/${me}`]?.sid !== st.sid // not rolled yet
    && store.get("ns.initHide") !== st.sid;                         // not closed with ✕
  $("initban").hidden = !owed;
  clearTimeout(updateInitBanner.t); if (owed) updateInitBanner.t = setTimeout(() => updateInitBanner(), 30e3);
}
$("initx").onclick = () => { const s = lastMd?.[INIT]; if (s) store.set("ns.initHide", s.sid); $("initban").hidden = true; };
$("initgo").onclick = () => {
  const adr = sheetVals?.[6]?.[2];
  if (adr != null && String(adr).trim() !== "") return quickRoll(adr, "Adroitness");
  document.querySelector('.tab[data-t="sheet"]').click(); // sheet not loaded yet: open it so they can roll from there
};
if (standalone) {
  document.querySelector("nav").insertAdjacentHTML("beforeend", `<span style="color:var(--dim);font-size:10px">TEST</span>`);
} else {
  OBR.onReady(async () => {
    me = await OBR.player.getId();
    isGM = (await OBR.player.getRole()) === "GM";
    $("monTab").hidden = !isGM;
    if (isGM) { initMd = await OBR.room.getMetadata(); OBR.room.onMetadataChange((m) => { initMd = m; drawInitList(); markTurn(); }); }
    applySize();
    render(allRolls(await OBR.room.getMetadata()));
    OBR.room.onMetadataChange((md) => { render(allRolls(md)); updateInitBanner(md); });
    updateInitBanner();
  });
}
</script>
