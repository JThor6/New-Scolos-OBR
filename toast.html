<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Creepster&family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  html { margin:0; background:transparent; }
  body { margin:0; color:#f1f3f9; font-family:system-ui, sans-serif; overflow:hidden; height:100vh; box-sizing:border-box;
    background:rgba(24,27,42,.45); border:1px solid rgba(255,255,255,.16); border-radius:14px; text-shadow:0 1px 2px rgba(0,0,0,.7); }
  .t { display:flex; flex-wrap:wrap; align-items:center; align-content:center; gap:3px 5px; padding:4px 10px; min-height:100%; box-sizing:border-box; }
  .pn { margin-left:5px; font-size:10px; font-weight:600; color:#9aa0b8; }
  .wnd { flex:none; margin-left:6px; font-size:11px; font-weight:900; color:#ff8f8f; }
  .who { flex-basis:100%; display:flex; align-items:baseline; font-weight:800; font-size:12px; line-height:1.2; color:#c9cde0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .die { width:21px; height:21px; font-size:14px !important; border:2px solid #f1f3f9; border-radius:5px; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:15px; background:rgba(10,12,20,.6); }
  .p { color:#5fd38d; border-color:#5fd38d; } .m { color:#ff6b6b; border-color:#ff6b6b; }
  .mod { color:#9aa0b8; font-weight:700; font-size:12px; }
  .lbl { flex-basis:100%; font-size:12px; line-height:1.3; font-weight:800; color:#bb99ff; overflow-wrap:anywhere; }
  body.pw { background:rgba(70,48,8,.72); border:2px solid #ffc94d; box-shadow:0 0 14px rgba(255,201,77,.55); }
  body.pw .lbl { color:#ffc94d; font-family:'Bangers', Impact, sans-serif; letter-spacing:1px; }
  body.pw .tot { color:#ffc94d; }
  body.ks { background:rgba(120,15,15,.72); border:2px solid #ff4d3d; box-shadow:0 0 14px rgba(255,60,40,.6); }
  body.ks .lbl { color:#ff6b5e; font-family:'Bangers', Impact, sans-serif; letter-spacing:1px; }
  body.ks .tot { color:#ff6b5e; }
  body.cp { background:rgba(10,55,80,.75); border:2px solid #4fc3f7; box-shadow:0 0 14px rgba(79,195,247,.55); }
  body.cp .lbl { flex-basis:auto; color:#7fd4ff; font-family:'Bangers', Impact, sans-serif; letter-spacing:1px; font-size:18px; white-space:nowrap; }
  body.cp .left { flex-basis:100%; font-size:12px; font-weight:800; color:#c9e9ff; }
  body.ap { background:rgba(45,30,105,.78); border:2px solid #9d86ff; box-shadow:0 0 14px rgba(157,134,255,.6); }
  body.ap .lbl { flex-basis:100%; color:#c7b6ff; font-family:'Bangers', Impact, sans-serif; letter-spacing:1px; font-size:18px; line-height:1.1; }
  body.ap .left { flex-basis:100%; font-size:12px; font-weight:800; color:#e4dcff; }
  body.ap.av { background:linear-gradient(135deg, rgba(25,60,120,.85), rgba(110,30,120,.85)); border-color:#e8b5ff; box-shadow:0 0 16px rgba(199,125,255,.65); } body.ap.av .lbl { color:#ffd9ff; text-shadow:0 0 8px #c77dff; }
  body.ap.ff { background:rgba(5,45,60,.82); border-color:#3ee6ff; box-shadow:0 0 14px rgba(62,230,255,.55); } body.ap.ff .lbl { color:#bff7ff; text-shadow:-4px 0 rgba(62,230,255,.55), -8px 0 rgba(62,230,255,.25); }
  body.ap.wr { background:rgba(10,10,14,.55); border:1px dashed rgba(210,210,225,.5); box-shadow:none; } body.ap.wr .lbl { color:rgba(235,235,245,.55); letter-spacing:6px; text-shadow:0 0 8px rgba(255,255,255,.4); } body.ap.wr .left { color:rgba(220,220,230,.6); font-style:italic; }
  body.ap.mm { background:rgba(8,50,52,.82); border-color:#5ff0c8; box-shadow:0 0 14px rgba(95,240,200,.5); } body.ap.mm .lbl { color:#a8ffe6; text-shadow:0 5px 0 rgba(0,0,0,.45); }
  body.ap.rv { background:radial-gradient(circle at 25% 30%, rgba(75,15,100,.92), rgba(12,0,22,.95)); border-color:#8a3fd1; box-shadow:0 0 18px rgba(140,60,220,.75), inset 0 0 14px rgba(150,255,190,.15); }
  body.ap.rv .lbl { font-family:'Creepster', 'Bangers', Impact, sans-serif; font-size:21px; color:#c6ffd8; text-shadow:0 0 6px #7dffa8, 0 0 16px #8a3fd1; } body.ap.rv .left { color:#d9c8f0; font-style:italic; }
  .tot { margin-left:auto; font-family:'Luckiest Guy', 'Bangers', Impact, sans-serif; font-size:23px; min-width:30px; text-align:right; padding-top:2px; }
</style></head>
<body><div class="t" id="t"></div>
<script type="module">
  import OBR from "https://esm.sh/@owlbear-rodeo/sdk@3.1.0";
  import { POWER_CARDS } from "./shared.js";
  // Shows one roll passed in the address: ?who=Zak&dice=1,0,-1,1&mod=3&total=4 (&spin=1 for a slot-machine reveal)
  const q = new URLSearchParams(location.search);
  const fmt = (n) => (n > 0 ? "+" : "") + n;
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const dice = (q.get("dice") || "").split(",").map(Number);
  const mod = Number(q.get("mod") || 0);
  // "(wounded -1)" goes up on the name line so a long skill name can never push it out of sight
  let label = q.get("label") || "", wnd = q.get("wnd") ? "wounded " + q.get("wnd") : "";
  const wm = label.match(/\s*\((wounded [^)]*)\)\s*$/i); if (wm) { wnd = wnd || wm[1]; label = label.slice(0, wm.index); }
  const lsize = label.length > 44 ? 10 : label.length > 30 ? 11 : 12; // long skill names get a smaller font
  document.getElementById("t").innerHTML =
    `<span class="who"><span style="overflow:hidden;text-overflow:ellipsis">${esc(q.get("char") || q.get("who") || "")}${q.get("char") ? `<span class="pn">${esc(q.get("who") || "")}</span>` : ""}</span>${wnd ? `<span class="wnd">${esc(wnd)}</span>` : ""}</span>` +
    dice.map(d => `<span class="die ${d > 0 ? "p" : d < 0 ? "m" : ""}">${d > 0 ? "+" : d < 0 ? "−" : ""}</span>`).join("") +
    (mod ? `<span class="mod">${fmt(mod)}</span>` : "") +
    `<span class="tot" id="tot">${fmt(Number(q.get("total") || 0))}</span>` +
    (label ? `<span class="lbl" style="font-size:${q.get("ks") || q.get("pw") ? 15 : lsize}px">${esc(label)}</span>` : "");
  // Always fit: if the label doesn't fit in the card, shrink it (half a point at a time) until everything shows.
  const fit = () => { const b = document.body, l = document.querySelector(".lbl"); if (!l) return;
    let s = parseFloat(l.style.fontSize) || 12;
    while (b.scrollHeight > b.clientHeight + 1 && s > 6) { s -= 0.5; l.style.fontSize = s + "px"; } };
  fit(); if (document.fonts) document.fonts.ready.then(fit);
  if (q.get("cop")) { // Combat Option Point used: who, and how many they have left
    const max = q.get("max");
    document.getElementById("t").innerHTML = `<span class="who"><span style="overflow:hidden;text-overflow:ellipsis">${esc(q.get("char") || q.get("who") || "")}${q.get("char") ? `<span class="pn">${esc(q.get("who") || "")}</span>` : ""}</span></span>` +
      `<span class="lbl cop">⚔ COMBAT OPTION!</span>` + (max ? `<span class="left">${esc(q.get("total") || "0")} of ${esc(max)} COP left</span>` : "");
    document.body.classList.add("cp");
  }
  if (q.get("ap")) { // a power that stays on was switched on: who, and what it does
    const pc = POWER_CARDS[q.get("ap")] || { c: "", t: q.get("label") || "POWER", s: "" };
    document.getElementById("t").innerHTML = `<span class="who"><span style="overflow:hidden;text-overflow:ellipsis">${esc(q.get("char") || q.get("who") || "")}${q.get("char") ? `<span class="pn">${esc(q.get("who") || "")}</span>` : ""}</span></span>` +
      `<span class="lbl">${esc(pc.t)}</span>` + (pc.s ? `<span class="left">${esc(pc.s)}</span>` : "");
    document.body.classList.add("ap"); if (pc.c) document.body.classList.add(pc.c); fit();
  }
  if (q.get("ks")) document.body.classList.add("ks"); else if (q.get("pw")) document.body.classList.add("pw");
  const faces = [...document.querySelectorAll(".die")];
  let showFor = 5000;
  if (q.get("spin")) {
    showFor = 7000;
    const set = (el, d) => { el.className = "die " + (d > 0 ? "p" : d < 0 ? "m" : ""); el.textContent = d > 0 ? "+" : d < 0 ? "−" : ""; };
    const tot = document.getElementById("tot"); tot.style.visibility = "hidden";
    let locked = 0;
    const tick = setInterval(() => { for (let i = locked; i < faces.length; i++) set(faces[i], Math.floor(Math.random() * 3) - 1); }, 70);
    const lock = () => { set(faces[locked], dice[locked]); locked++; if (locked < faces.length) return setTimeout(lock, 300); clearInterval(tick); tot.style.visibility = "visible"; };
    setTimeout(lock, 700);
  }
  // fade out, then close this card on its own (works even if the panel that opened it is closed)
  const myId = q.get("id") || "com.newscolos.dice/toast";
  const ms = Number(q.get("ms")) || showFor;
  document.body.style.transition = "opacity .6s";
  setTimeout(() => { document.body.style.opacity = "0"; }, Math.max(0, ms - 700));
  if (OBR.isAvailable) OBR.onReady(() => setTimeout(() => OBR.popover.close(myId).catch(() => {}), ms));
</script></body></html>
