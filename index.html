<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Scolos Dice</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Creepster&family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  :root { --bg:transparent; --paper:rgba(15,17,28,.55); --ink:#f1f3f9; --dim:#9aa0b8; --accent:#bb99ff; --plus:#5fd38d; --minus:#ff6b6b; }
  html, body { background:transparent !important; }
  * { box-sizing: border-box; }
  body { margin:0; zoom:0.85; font-family: system-ui, sans-serif; background:var(--bg); color:var(--ink); font-size:14px; }
  header { background:rgba(0,0,0,.6); padding:8px 12px; display:flex; flex-wrap:wrap; row-gap:4px; justify-content:space-between; align-items:center; }

  body.upl .uplhead b { flex:1; font-family:'Bangers', Impact, sans-serif; font-weight:400; font-size:20px; letter-spacing:1px; color:#bb99ff; }

  .skc { padding:0 0 0 7px; align-items:stretch; min-height:38px; gap:6px; overflow:hidden; }
  .skc span, .skc b { align-self:center; padding:4px 0; }
  .skc .rd { align-self:stretch; height:auto; width:44px; margin:0; border-radius:0; border-left:1px solid #444a66; background:rgba(187,153,255,.18); }
  .skc .rd svg { width:22px; height:22px; } .skc .rd:hover { background:rgba(187,153,255,.38); }
  #sh .rd.ra { height:30px; margin-top:4px; width:calc(100% - 4px); border-radius:6px; background:rgba(187,153,255,.18); } #sh .rd.ra svg { width:20px; height:20px; }
  /* attributes: value on the left, a big roll button beside it (the old look, bigger button) */
  #sh .g5 { grid-template-columns:repeat(4, 1fr) .75fr; }
  #sh .att:not(.dp) { display:grid; grid-template-columns:1fr auto; align-items:center; padding:4px 4px 5px 4px; column-gap:2px; }
  #sh .att:not(.dp) small { grid-column:1 / -1; }
  #sh .att:not(.dp) b { padding:0; text-align:center; }
  #sh .rd.ra { position:static; width:30px; height:30px; margin:2px 0 0; border-radius:7px; background:rgba(187,153,255,.2); }
  #sh .rd.ra svg { width:20px; height:20px; }
  /* bigger attribute dice: as big as the box allows */
  #sh .rd.ra { width:34px; height:34px; } #sh .rd.ra svg { width:22px; height:22px; }
  @media (min-width: 420px) { #sh .rd.ra { width:48px; height:40px; border-radius:8px; } #sh .rd.ra svg { width:26px; height:26px; } #sh .att:not(.dp) { padding-right:5px; } }
  /* right column lines up: Dmg Pen, the Dead box and Used Today are all as wide as one vitality box, centered on the same line */
  #sh .g5 { grid-template-columns:repeat(4, 1fr) calc((100% - 4px) / 7 + 4px); }
  #sh .g2b { grid-template-columns:1fr calc((100% - 4px) / 7 + 4px); }
  #sh .g2b.g2p { grid-template-columns:1fr calc((100% - 4px) / 7 + 4px) auto; } /* Priest/Mage: power | Used today | points */
  #sh .g2b > .fld.c { display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:3px 0 6px; }
  #sh .g2b > .fld.c .chk { margin:auto 0; } /* centered in the space under the label */
  #sh .att.dp { display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:4px 0 5px; border-width:3px; }
  #sh .att.dp b.egg { display:flex; justify-content:center; line-height:1; color:#f1f3f9; }
  #sh .att.dp b.egg .skull { width:30px; height:30px; filter:drop-shadow(0 0 5px rgba(255,70,60,.75)) drop-shadow(0 1px 1px #000); }
  #sh .att.dp b.egg.pop .skull { animation:eggpop .45s ease-out both; }
  .mdead .skull { width:13px; height:13px; vertical-align:-2px; margin-right:3px; }
  /* one bounce: pops in a little big, settles once */
  @keyframes eggpop { 0% { transform:scale(.3); opacity:0; } 60% { transform:scale(1.18); opacity:1; } 100% { transform:scale(1); } }
  #sh .att.dp b { margin:auto 0; } /* label at the same height as CHARM etc., number centered under it like theirs */
  /* every checkbox on the vitality track sits on the same line, however many lines its label has */
  #sh .vit .box { position:relative; padding-bottom:28px; }
  #sh .vit .box .chk { position:absolute; bottom:5px; left:50%; transform:translateX(-50%); margin:0; }
  /* Monsters tab: same look as the character sheet (big dice, roomy boxes) */
  #mo .matt { grid-template-columns:repeat(4, 1fr); gap:4px; margin-top:4px; }
  #mo .att { display:grid; grid-template-columns:1fr auto; align-items:center; padding:4px 4px 5px; column-gap:2px; border-width:2px; }
  #mo .att small { grid-column:1 / -1; } #mo .att b { padding:0; text-align:center; font-size:19px; }
  #mo .rd.ra { position:static; width:34px; height:34px; margin:2px 0 0; border-radius:7px; background:rgba(187,153,255,.2); } #mo .rd.ra svg { width:22px; height:22px; }
  #mo .mrow2 { display:grid; grid-template-columns:1fr 1fr 1fr 104px; gap:4px; margin-top:4px; } #mo .matk { grid-column:1 / 4; grid-row:1; }
  #mo .mart { grid-column:4; grid-row:1 / 3; position:relative; border:2px dashed #444a66; border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; cursor:pointer; color:var(--dim); font-size:20px; font-weight:800; line-height:1; min-height:78px; padding:2px; }
  #mo .mart small { font-size:8px; letter-spacing:.5px; } #mo .mart:hover, #mo .mart.drag { border-color:#ff2b3d; color:#ff6b6b; }
  #mo .mart.has { border:none; cursor:default; } #mo .mart.busy { opacity:.55; animation:ptpulse .8s infinite alternate; }
  #mo .mpog { width:72px; height:72px; display:block; cursor:pointer; } #mo .mpog:hover { filter:brightness(1.15); }
  #mo .martb { display:flex; gap:3px; width:100%; } #mo .martb button { flex:1; background:var(--paper); border:1.5px solid #444a66; border-radius:6px; color:var(--ink); font-size:14px; font-weight:800; padding:2px 0; cursor:pointer; line-height:18px; }
  #mo .martb.big button { font-size:11px; letter-spacing:.3px; padding:4px 0; } #mo .martb.big button.go { background:#a3132a; border-color:#ff2b3d; color:#fff; } #mo .martb.big button.go:hover { background:#c21733; }
  #mo .martb button:hover { color:var(--ink); border-color:var(--ink); } #mo .martb button.arm { color:#fff; background:#a3132a; border-color:#ff2b3d; font-size:10px; }
  #mo .mthumb { width:20px; height:20px; border-radius:50%; object-fit:cover; border:1.5px solid #ff2b3d; flex:none; }
  #mo .matk { min-height:44px; } #mo .matk span { display:flex; align-items:center; } #mo .matk span small { font-size:11px; font-weight:800; color:var(--dim); letter-spacing:.5px; } #mo .matk b { font-size:18px; }
  #mo .mrow2 .fld > div { font-size:15px; font-weight:800; }
  #mo .pvit.mv { gap:6px; margin-top:8px; flex-wrap:wrap; } #mo .pvit i small { font-size:10px; }
  #mo .mwnd { color:#ff8f8f; font-size:12px; font-weight:900; white-space:nowrap; }
  #mo .mw { width:30px; height:30px; border-radius:5px; }
  #mo .pvit.mv { justify-content:space-between; gap:2px; } #mo .pvit.mv i { flex:1; min-width:0; gap:2px; }
  #mo .pvit.mv .wd { font-size:13px; font-weight:900; color:var(--ink); line-height:1; } #mo .pvit.mv small { font-size:10px; }
  /* each monster starts with a full-width yellow banner, so cards are easy to find while scrolling */
  #mo .mtop { gap:8px; margin:-8px -9px 8px; padding:7px 9px; background:rgba(214,160,30,.30); border-bottom:2px solid #d6a01e; border-radius:6px 6px 0 0; }
  #mo .mtop b { font-size:18px; color:#ffd666; letter-spacing:.2px; }
  .mkind { padding:1px 7px; border:1px solid #d6a01e; border-radius:5px; background:rgba(0,0,0,.35); color:#ffe39a; font-size:12.5px; font-weight:700; white-space:nowrap; }
  #mo .mcard.dead .mtop { background:rgba(120,30,30,.5); border-bottom-color:#a33; } #mo .mcard.dead .mtop b { color:#e8b4b4; } #mo .mdead { padding:5px 10px; }
  #mo .mcard { padding:8px 9px 10px; margin-top:10px; }
  #mo .mtext i { font-style:normal; font-weight:800; color:var(--dim); }
  @media (min-width: 420px) { #mo .rd.ra { width:48px; height:40px; border-radius:8px; } #mo .rd.ra svg { width:26px; height:26px; } }
  .err { color:var(--minus); margin-top:8px; font-weight:700; }
  .empty { color:var(--dim); margin-top:8px; }

  .oh:first-child { margin-top:4px; }
  .ol { position:relative; padding:2px 0 2px 12px; font-size:13px; line-height:1.4; color:var(--ink); }
  .ol::before { content:""; position:absolute; left:2px; top:9px; width:4px; height:4px; border-radius:50%; background:var(--dim); }
</style>

<body>
<header><h1>NEW SCOLOS</h1><span class="hctl"><span id="syncdot" class="syncdot" hidden title="Syncing with Google Sheets">⟳</span><button id="solid" class="tab" title="See-through / solid">◐</button><button id="size" class="tab" title="Make the panel narrower"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M2 12h8M7 8l3 4-3 4M22 12h-8M17 8l-3 4 3 4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></span><nav><button class="tab on" data-t="sheet">CHARACTER SHEET</button><button class="tab" data-t="rules">REFERENCE</button><button class="tab" data-t="dice">DICE</button><button class="tab" data-t="gen">CHARACTER CREATOR</button><button class="tab" data-t="mon" id="monTab" hidden>GM</button></nav></header>
<div id="initban" class="initban" hidden><span>⚔ Initiative! Your next Adroitness roll counts.</span><button id="initgo">ROLL</button><button id="initx" title="Hide">✕</button></div>
<section id="sheet"><div id="sh"><div class="empty">Loading…</div></div></section>
<section id="rules" hidden><div id="ru"></div></section>
<section id="gen" hidden><div id="cg"></div></section>
<section id="mon" hidden><div id="mo"></div></section>
<main id="dice" hidden>
  <label>Modifier</label>
  <div style="display:flex;gap:8px;align-items:stretch"><input id="modin" inputmode="numeric" placeholder="0" style="font-size:22px;font-weight:800;text-align:center;width:110px"><button id="modneg" class="negbtn" title="Flip to minus / plus">±</button></div>
  <button id="roll">ROLL</button>
  <div id="err" class="err" hidden></div>
  <div id="last"></div>
  <div style="display:flex;gap:6px;align-items:stretch"><button id="histbtn" class="histbtn" style="flex:1">SHOW ROLL HISTORY</button><button id="dicepop" class="histbtn" style="flex:none;width:44px;color:var(--dim);display:flex;align-items:center;justify-content:center" title="Pop out roll history"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
  <div id="history" hidden><div class="empty">No rolls yet.</div></div>
  <div id="handrow" style="display:flex;gap:6px;align-items:stretch"><button id="handbtn" class="histbtn" style="flex:1">ANALOG DICE UPLINK</button><button id="handpop" class="histbtn" style="flex:none;width:44px;color:var(--dim);display:flex;align-items:center;justify-content:center" title="Pop the uplink out beside the map"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
  <div id="uplhead" class="uplhead"><b>ANALOG DICE UPLINK</b><button id="uplx" title="Close">✕</button></div>
  <div id="hand" class="hand" hidden></div>
</main>
<script type="module">
import OBR, { buildImage, buildImageUpload } from "https://esm.sh/@owlbear-rodeo/sdk@3.1.0";
import { NS, KEEP, rollKey, allRolls, fmt, INIT, initEntries, rollLine, ROLL_CSS, rollLog, LOG_MAX, POWER_CARDS } from "./shared.js";
document.head.insertAdjacentHTML("beforeend", `<style>${ROLL_CSS}</style>`);
import { TYPES, SECTIONS, REF_GROUPS, getTab, sectionHtml } from "./rules.js";

const $ = (id) => document.getElementById(id);
let mod = 0, me = null, standalone = !OBR.isAvailable, localRolls = [];

// Type the modifier: "+3", "-1", "3" or blank (0). Enter rolls.
// Phone number pads have no minus key, so ± flips the sign of whatever is typed
function flipSign(el) {
  const v = el.value.trim().replace("−", "-");
  el.value = v.startsWith("-") ? v.slice(1) : "-" + v.replace(/^\+/, "");
}
$("modneg").onclick = () => flipSign($("modin"));
function readMod() {
  const t = $("modin").value.trim().replace(/^\+/, "").replace("−", "-");
  if (t === "") return 0;
  const n = Number(t);
  return Number.isInteger(n) && Math.abs(n) <= 30 ? n : null;
}
$("modin").onkeydown = (e) => { if (e.key === "Enter") $("roll").click(); };

function rollDie() { const a = new Uint32Array(1); crypto.getRandomValues(a); return (a[0] % 3) - 1; }

function card(r, large) {
  const dice = r.dice.map(d => `<div class="die ${d > 0 ? "p" : d < 0 ? "m" : ""}">${d > 0 ? "+" : d < 0 ? "−" : ""}</div>`).join("");
  const time = new Date(r.ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const pen = parseInt(r.wnd, 10);
  return `<div class="card ${large ? "big" : ""}">
    <div class="who">${esc(r.char || r.who)}${r.char ? `<small>${esc(r.who)}</small>` : ""}${r.label ? ` <small>${esc(r.label)}</small>` : ""}<small>${time}</small>${pen ? `<small style="color:#ff8f8f;font-weight:900">wounded ${fmt(pen)}</small>` : ""}</div>
    <div class="dice">${dice}${r.mod ? `<span class="modtag">${fmt(r.mod)}</span>` : ""}<span class="total">${fmt(r.total)}</span></div>
  </div>`;
}

// Roll totals use Luckiest Guy (Bangers draws 1 and 7 almost the same)
const big = (n) => fmt(n);
// Slot-machine reel: faces flicker, then each die locks in left to right, then the total.
const face = (d) => d > 0 ? "+" : d < 0 ? "−" : "";
const cls = (d) => `die ${d > 0 ? "p" : d < 0 ? "m" : ""}`;
function spin(r) {
  return new Promise((done) => {
    $("last").innerHTML = `<div class="card big"><div class="who">Rolling…</div><div class="dice">${
      r.dice.map((_, i) => `<div class="die" id="d${i}"></div>`).join("")}${r.mod ? `<span class="modtag">${fmt(r.mod)}</span>` : ""}<span class="total" id="tot">?</span></div></div>`;
    let locked = 0;
    const tick = setInterval(() => {
      for (let i = locked; i < 4; i++) { const d = rollDie(), el = $("d" + i); el.className = cls(d); el.textContent = face(d); }
    }, 70);
    const lockNext = () => {
      const el = $("d" + locked); el.className = cls(r.dice[locked]); el.textContent = face(r.dice[locked]);
      locked++;
      if (locked < 4) return setTimeout(lockNext, 350);
      clearInterval(tick);
      setTimeout(() => { $("last").innerHTML = card(r, true); done(); }, 300);
    };
    setTimeout(lockNext, 900);
  });
}

// Roll history, newest first.
// DETAIL OFF (simple): name · time · wounded -1, then dice, skill name and the result on one line.
// DETAIL ON: same top line, the full skill name, then a little table of how the result was built:
// Dice +2 / Adroitness (attribute) +1 / Skill rank +1 / Wounded -1 / Result +3
let histDetail = (() => { try { return localStorage.getItem("ns.histDetail") === "on"; } catch { return false; } })();
const line = (r) => rollLine(r, histDetail);
// Pop-out: roll history opens as the "Roll History" choice of the Reference pop-out window
$("dicepop").onclick = () => popOut("__rolls");
// the pop-out's SIMPLE/DETAILED switch and this one stay in step
window.addEventListener("storage", (e) => { if (e.key === "ns.histDetail") { histDetail = e.newValue === "on"; render(lastRolls); } });
let lastRolls = [];
function render(rolls) {
  lastRolls = rolls;
  const html = `<button class="histdet">${histDetail ? "DETAILED ▲ (tap for simple)" : "SIMPLE ▼ (tap for detailed)"}</button>` +
    (rolls.length ? rolls.slice(0, LOG_MAX).map(line).join("") : `<div class="empty">No rolls yet.</div>`);
  // same list on the DICE tab and in REFERENCE → ROLL HISTORY
  for (const el of [$("history"), $("refRolls")]) if (el) el.innerHTML = html;
  document.querySelectorAll(".histdet").forEach(btn => btn.onclick = (e) => { e.preventDefault(); histDetail = !histDetail; try { localStorage.setItem("ns.histDetail", histDetail ? "on" : "off"); } catch {} render(lastRolls); });
}
$("histbtn").onclick = () => {
  const h = $("history"); h.hidden = !h.hidden;
  $("histbtn").textContent = h.hidden ? "SHOW ROLL HISTORY" : "HIDE ROLL HISTORY";
};

function showErr(msg) { $("err").textContent = msg; $("err").hidden = !msg; }

$("roll").onclick = async () => {
  showErr("");
  mod = readMod();
  if (mod === null) { showErr("Modifier must be a whole number, like +3 or -1."); return; }
  const dice = [rollDie(), rollDie(), rollDie(), rollDie()];
  const who = standalone ? "Test" : await OBR.player.getName();
  const r = { id: crypto.randomUUID().slice(0, 8), pid: me || "local", who, dice, mod, total: dice.reduce((a, b) => a + b, 0) + mod, ts: Date.now() };
  if (!isGM && myChar()) r.char = myChar(); // players' rolls show their character's name
  $("roll").disabled = true;
  await spin(r);
  const err = await saveRoll(r);
  if (err) showErr(err);
  $("roll").disabled = false;
};

// Puts a roll in the shared history. Returns an error message, or "" when it worked.
async function saveRoll(r) {
  if (standalone) { localRolls = [r, ...localRolls]; render(localRolls); return ""; }
  try {
    const key = rollKey(me);
    const md = await OBR.room.getMetadata();
    const mine = Array.isArray(md[key]) ? md[key] : [];
    // Room storage is small (~16 kB): drop roll lists from players who haven't rolled in 2 days (old devices, guests)
    const stale = {}, cutoff = Date.now() - 2 * 864e5;
    for (const [k, v] of Object.entries(md)) {
      if (k !== key && k.startsWith(NS + "/rolls/") && !(Array.isArray(v) && v.some(x => x.ts > cutoff))) stale[k] = undefined;
    }
    await OBR.room.setMetadata({ ...stale, [key]: [r, ...mine].slice(0, KEEP) });
    return "";
    return "";
  } catch (e) { return "Roll didn't reach the table: " + (e?.message || e); }
}

// Quick roll from the sheet: rolls with that number as the modifier and shows it spinning in the bottom-right.
const ROLL_ICON = `<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M8 12h8M12 8v8" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>`;
// One roll at a time: extra clicks while a roll is going (or within 1.5s) are ignored, so mashing can't flood Owlbear
let rollBusy = false;
function setRollBusy(on) { rollBusy = on; document.body.classList.toggle("rollbusy", on); }
// The character's Damage Penalty (C12: -1 once Critical Wound or Down & KO'ed is checked) applies to every roll made from their sheet
// The skull only pops in the moment Dead gets marked; the sheet redraws a few times after a save, and it shouldn't bounce again each time
const deadSeen = new Map();
const skullPop = () => { const id = sheetId(), was = deadSeen.get(id); deadSeen.set(id, true); return was === false ? "pop" : ""; };
const SKULL = `<svg class="skull" viewBox="0 0 64 64" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M32 4C17 4 7 14.5 7 28.5c0 8 3.8 13.6 9 16.8V52c0 3 2 5 5 5h22c3 0 5-2 5-5v-6.7c5.2-3.2 9-8.8 9-16.8C57 14.5 47 4 32 4Z M14.5 30.5c0-4.6 3.6-7.5 8-7.5s7.5 3.3 7 7.5c-.4 3.9-3.6 6.5-7.5 6.5s-7.5-2.4-7.5-6.5Z M34.5 30.5c-.5-4.2 2.6-7.5 7-7.5s8 2.9 8 7.5c0 4.1-3.6 6.5-7.5 6.5s-7.1-2.6-7.5-6.5Z M32 38.5l-4 7h8Z M24.5 50h2.6v7h-2.6Z M30.7 50h2.6v7h-2.6Z M36.9 50h2.6v7h-2.6Z"/></svg>`;
// The open sheet's character name (shown on rolls)
const myChar = () => String(sheetVals?.[2]?.[2] || "").trim().slice(0, 30);
const sheetPen = () => num(sheetVals?.[11]?.[2]) || 0;
async function quickRoll(modText, label, whoName, br = "", monPen = 0) {
  if (rollBusy) return;
  setRollBusy(true);
  const t0 = Date.now();
  try { await doQuickRoll(modText, label, whoName, whoName ? monPen : sheetPen(), br); }
  finally { setTimeout(() => setRollBusy(false), Math.max(0, 1500 - (Date.now() - t0))); }
}
async function doQuickRoll(modText, label, whoName, pen = 0, br = "", real = null) {
  let m = (parseInt(String(modText).replace("−", "-"), 10) || 0) + pen;
  // If the GM called for initiative, a player's next Adroitness roll is their initiative
  let initSid = "";
  if (!standalone && !whoName && label === "Adroitness") {
    const st = (await OBR.room.getMetadata())[INIT];
    if (st?.open && store.get("ns.initDone") !== st.sid) { initSid = st.sid; label = "Adroitness · Initiative"; }
  }
  const ks = !whoName && ksArmed() && KS_ATTACK.test(String(label || ""));
  if (ks) { label = "KILL SHOT · " + label; setKS(false); fillPowers(); setTimeout(() => markPowerUsed(), 0); }
  // A power that's on can change the roll: Avatar's +1 Spellcasting, the Wraith's unseen first strike (+1, then they reappear)
  const ad = !whoName ? actDef() : null;
  if (ad?.skill && ad.skill[0].test(label)) { m += ad.skill[1]; label = `${label} · ${ad.t} +${ad.skill[1]}`; }
  if (ad?.strike && KS_ATTACK.test(label)) { m += ad.strike; label = `FROM THE SHADOWS · ${label} +${ad.strike} unseen`; setTimeout(() => endActive("You strike and reappear."), 0); }
  const dice = ks ? [1, 1, 1, 1] : real || [rollDie(), rollDie(), rollDie(), rollDie()];
  if (real) label = (String(label || "Roll").slice(0, 46) + " · analog").trim(); // rolled with physical dice, typed in
  const who = whoName || (standalone ? "Test" : await OBR.player.getName());

// Spend XP on skills and attribute points on attributes using the sheet's own cost chart (G4:H12),
// add skills, credits, equipment and notes. Every change writes straight to the Google Sheet.
const num = (s) => { const n = parseInt(String(s ?? "").replace(/[,\s+]/g, "").replace("−", "-"), 10); return isNaN(n) ? null : n; };
const sgn = (n) => (n > 0 ? "+" : "") + n;
function stepCost(rank) { // cost to go from rank to rank+1, read from the chart on the sheet ("-4 to -3" → 1)
  for (let row = 4; row <= 12; row++) { const from = num(String(V("G" + row)).split(/\s+to\s+/i)[0]); if (from === rank) return num(V("H" + row)); }
  return null;
}
const xpNow = () => num(V("F3")) || 0, xpSpent = () => num(V("F4")) || 0;
const levelOf = (spent) => Math.floor(spent / 10);
const attrLeft = () => levelOf(xpSpent()) - (num(V("F10")) || 0);
const skillLvl = (row) => { const n = num(V("E" + row)); return n == null ? -4 : n; };
function mgrSave(cells, done) {
  save({ cells }, () => { for (const [k, v] of Object.entries(cells)) setCell(k, String(v)); // show it right away
    setCell("F5", String(levelOf(xpSpent()))); setCell("F12", String(attrLeft())); done && done(); });
}
// Manage Character: Combat Options. You may know half your level (rounded down); swap by removing one and adding another.
async function drawMgrCombat(err) {

  let all = [];

  if (!$("mco")) return;
  const strip = (x) => x.replace(/\s*\([^)]*\)\s*$/, "").trim().toLowerCase();
  const open = all.filter(([n]) => !have.some(h => strip(h) === n.toLowerCase()));
  const room = Math.min(max, slots.length) - have.length;
  box.innerHTML = `<div class="mnote" style="color:var(--dim)">You can know <b>${max}</b> (half your level, rounded down). You have <b>${have.length}</b>.${max > slots.length ? ` The sheet only has room for ${slots.length}.` : ""}</div>
    ${have.map((h, i) => { const d = (all.find(([n]) => n.toLowerCase() === strip(h)) || [])[1] || ""; return `<div class="mli mco1"><span><b>${esc2(h)}</b>${d ? `<small>${esc2(d)}</small>` : ""}</span><button class="mx" data-cox="${i}" title="Remove">✕</button></div>`; }).join("") || `<div class="empty" style="padding:4px">None yet.</div>`}
    ${room > 0 ? `<div class="mrow"><select id="coPick"><option value="">Add a combat option…</option>${open.map(([n]) => `<option>${esc2(n)}</option>`).join("")}</select><button id="coGo" class="sbtn">ADD</button></div><div id="coDesc" class="mnote" style="color:var(--ink)"></div>`

  const write = (list) => { const cells = {}; slots.forEach((a, i) => { if ((list[i] || "") !== V(a)) cells[a] = list[i] || ""; }); if (Object.keys(cells).length) mgrSave(cells); };

    $("coGo").onclick = () => { const v = $("coPick").value; if (!v) return; if (have.length >= max) return err(`You can only know ${max} combat options at level ${lvl}.`); write([...have, v]); };

  if (!store.get("ns.code")) { box.innerHTML = `<div class="empty">Open the CHARACTER SHEET tab and enter the table code first.</div>`; return; }
  const saved = cache.get("mon." + monId());
  refreshEncList();
  refreshCampList();
  refreshStList();
  if (!monId()) { box.innerHTML = pickers() + `<div class="empty">No encounters in the "${esc2(campaign)}" campaign yet. Put encounter sheets in the "${esc2(campaign)}" folder inside New Scolos Game Master Files.</div>` + stasisBox(); bindPicker(); return; }
  if (saved) { monVals = saved; drawMonsters(); } else { box.innerHTML = pickers() + `<div class="empty">Loading monsters…</div>` + stasisBox(); bindPicker(); }
  sync(1);
  const r = await bridgeGet({ id: monId(), tab: "Extension Tracker" }).catch(e => ({ ok: false, error: e.message }));
  sync(-1);
  if (!r.ok) { if (!saved) box.innerHTML = `${pickers()}<div class="err">Couldn't load monsters: ${esc2(r.error)}</div>` + stasisBox(); bindPicker(); return; }
  cache.set("mon." + monId(), r.values);
  if (JSON.stringify(r.values) !== JSON.stringify(monVals)) { monVals = r.values; drawMonsters(); }
}

// New Day / Refill COP for every character in this room's campaign. Tap once, then tap again to confirm.
function gmTools() {

function bindGmTools() {
  const arm = (b, label, run) => { if (!b) return; b.onclick = () => {
    if (b.dataset.armed) { delete b.dataset.armed; b.textContent = label; run(); return; }
    b.dataset.armed = "1"; b.textContent = "TAP AGAIN TO CONFIRM";
    setTimeout(() => { if (b.dataset.armed) { delete b.dataset.armed; b.textContent = label; } }, 4000);
  }; };
  arm($("gmDay"), "☀ NEW DAY", () => gmAll("New day", (v) => /^true$/i.test(String(v[5]?.[5] ?? "").trim()) ? { power: false } : null, (v) => { v[5][5] = "FALSE"; }));
  arm($("gmCop"), "⚡ REFILL COP", () => gmAll("Refill COP", (v) => {
    const now = parseInt(String(v[28]?.[7] ?? "")) || 0; // H29 is COP spent: refilling sets it back to 0
    return now === 0 ? null : { copSpent: 0 };
  }, (v, b) => { v[28] = v[28] || []; v[28][7] = String(b.copSpent); }));

async function gmAll(label, change, local) {
  const msg = $("gmMsg"); const say = (t) => { if (!msg) return; msg.hidden = false; msg.textContent = t; };
  say(`${label}: checking characters…`); sync(1);
  try {
    const chars = await characterSheets();
    const todo = chars.map(c => ({ c, b: change(c.values) })).filter(x => x.b);
    if (!todo.length) return say(`${label}: nothing to change. Everyone is already set.`);
    const res = await Promise.all(todo.map(({ c, b }) => bridgePost({ id: c.id, ...b }).then(r => ({ c, b, r })).catch(e => ({ c, b, r: { ok: false, error: e.message } }))));
    const ok = res.filter(x => x.r.ok), bad = res.filter(x => !x.r.ok);
    for (const { c, b } of ok) { local(c.values, b); cache.set("sheet." + c.id, c.values); }
    cache.set(ck("chars"), chars);
    say(`${label}: ${ok.length ? "updated " + ok.map(x => x.c.name).join(", ") : "nothing saved"}.` + (bad.length ? ` Didn't save: ${bad.map(x => x.c.name + " (" + (x.r.error || "error") + ")").join(", ")}.` : ""));
  } catch (e) { say(`${label} failed: ${e.message || e}`); }
  finally { sync(-1); }
}

// ---- drag monsters into the order the GM wants (grab the name banner) ----
// While dragging, every card folds down to its banner so the list is short, the grabbed card
// floats under your finger, a gap shows where it will land, and the others slide out of the way.
const monOrderKey = () => "ns.monOrder:" + monId();
const monOrder = () => { try { return JSON.parse(store.get(monOrderKey()) || "[]"); } catch { return []; } };
function scrollParent(el) { for (let e = el.parentElement; e; e = e.parentElement) { const o = getComputedStyle(e).overflowY; if ((o === "auto" || o === "scroll") && e.scrollHeight > e.clientHeight) return e; } return document.scrollingElement; }
// Tablets only: a faint lock above the monster list. Locked, the name banners don't drag, so a finger scrolling the list can't move a monster.
const touchDev = (() => { try { return matchMedia("(pointer: coarse)").matches || navigator.maxTouchPoints > 0; } catch { return false; } })();
const LOCK_SVG = `<svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>`;
const UNLOCK_SVG = `<svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor"/><path d="M8 11V8a4 4 0 0 1 7.6-1.7" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>`;
function bindMonDrag() {
  const list = $("mlist"); if (!list || list.classList.contains("mlocked")) return;
  list.querySelectorAll(".mtop").forEach(bar => bar.onpointerdown = (e) => {
    if (e.button || e.target.closest("button")) return;
    const card = bar.closest(".mcard"), y0 = e.clientY, sp = scrollParent(list);
    let on = false, lastY = e.clientY, raf = 0, ph = null, grabDy = 0;
    const others = () => [...list.children].filter(x => x !== card && x !== ph);
    const slide = (fn) => { // FLIP: move things in the DOM, then animate them from where they were
      const els = others(), before = new Map(els.map(x => [x, x.getBoundingClientRect().top]));
      fn();
      for (const x of els) { const d = before.get(x) - x.getBoundingClientRect().top; if (!d) continue;
        x.style.transition = "none"; x.style.transform = `translateY(${d}px)`; x.offsetHeight;
        x.style.transition = "transform .16s ease"; x.style.transform = ""; }
    };
    const place = () => {
      let target = null;
      for (const o of others()) { const r = o.getBoundingClientRect(); if (lastY < r.top + r.height / 2) { target = o; break; } }
      if (target ? ph.nextElementSibling === target : list.lastElementChild === ph) return;
      slide(() => target ? list.insertBefore(ph, target) : list.appendChild(ph));
    };
    const step = () => { // scroll the panel while holding near its top or bottom edge
      const r = sp === document.scrollingElement ? { top: 0, bottom: innerHeight } : sp.getBoundingClientRect();
      const d = lastY < r.top + 50 ? -10 : lastY > r.bottom - 50 ? 10 : 0;
      if (d) { sp.scrollTop += d; place(); }
      raf = requestAnimationFrame(step);
    };
    const start = () => {
      on = true;
      const t0 = card.getBoundingClientRect().top;
      list.classList.add("mreorder"); // fold every card to its banner
      sp.scrollTop += card.getBoundingClientRect().top - t0; // keep the grabbed card under your finger after the fold
      const lr = list.getBoundingClientRect(), cr = card.getBoundingClientRect();
      grabDy = Math.min(Math.max(lastY - cr.top, 0), cr.height);
      ph = document.createElement("div"); ph.className = "mph"; ph.style.height = cr.height + "px";
      list.insertBefore(ph, card);
      Object.assign(card.style, { position: "fixed", left: lr.left + "px", width: lr.width + "px", top: (lastY - grabDy) + "px", zIndex: 50, margin: 0 });
      card.classList.add("mdrag");
      raf = requestAnimationFrame(step);
    };
    const move = (ev) => {
      lastY = ev.clientY;
      if (!on) { if (Math.abs(ev.clientY - y0) < 5) return; start(); }
      ev.preventDefault();
      card.style.top = (lastY - grabDy) + "px";
      place();
    };
    const up = () => {
      removeEventListener("pointermove", move); removeEventListener("pointerup", up); removeEventListener("pointercancel", up);
      cancelAnimationFrame(raf);
      if (!on) return;
      const pr = ph.getBoundingClientRect(); // glide into the gap, then unfold everything
      card.style.transition = "top .14s ease"; card.style.top = pr.top + "px";
      setTimeout(() => {
        list.replaceChild(card, ph);
        card.removeAttribute("style"); card.classList.remove("mdrag");
        list.querySelectorAll(".mcard").forEach(x => x.removeAttribute("style"));
        list.classList.remove("mreorder");
        store.set(monOrderKey(), JSON.stringify([...list.querySelectorAll(".mcard")].map(x => +x.dataset.row)));
        card.scrollIntoView({ block: "nearest" });
        card.classList.add("mdrop"); setTimeout(() => card.classList.remove("mdrop"), 600);
      }, 150);
    };
    addEventListener("pointermove", move, { passive: false }); addEventListener("pointerup", up); addEventListener("pointercancel", up);
  });
}
// ---------- MONSTER ART (GM) ----------
// One picture per monster name, trailing numbers dropped ("Hive Runner 2" → "hive runner"), so mooks share it and it
// carries into every encounter. Drop or pick a picture on the card's art slot: the small copy shows by the name and the

async function monArtPog(a) { // red pog preview drawn from the small copy
  try { a.pogUrl = drawPog(await loadImg(a.url), a.f, "enemy", 160).toDataURL("image/png"); } catch {}

// fetch art for monsters on screen that this session hasn't asked about yet
async function monArtEnsure() {
  const keys = [...new Set([...document.querySelectorAll("#mo .mart")].map(e => e.dataset.mk))].filter(k => !monArtChecked.has(k));
  if (!keys.length) return;
  keys.forEach(k => monArtChecked.add(k));
  const r = await bridgeGet({ monart: keys.join("|"), have: keys.map(k => monArt.get(k)?.t || 0).join("|") }).catch(() => null);
  if (!r || !r.ok || !r.art) { keys.forEach(k => monArtChecked.delete(k)); return; }
  let changed = false;
  for (const k of keys) {
    const v = r.art[k];
    if (v === undefined) continue;
    if (v?.same) { const a = monArt.get(k); if (a && a.pogId !== v.pogId) { a.pogId = v.pogId; cache.set("ma." + k, a); } continue; }
    if (v === null) { if (monArt.has(k)) { monArt.delete(k); cache.set("ma." + k, null); changed = true; } continue; }
    const a = await monArtPog({ t: v.t, name: v.name, url: `data:${v.mime};base64,${v.data}`, pogId: v.pogId, f: v.f });
    monArt.set(k, a); cache.set("ma." + k, a); changed = true;
  }
  if (changed && $("mo") && !$("mon").hidden) drawMonsters();
}
async function monArtUpload(k, name, file) {
  let ok = false;
  if (!file || !/^image\//.test(file.type)) return monArtErr("That isn't a picture. Use a JPG or PNG.");
  if (monArtBusy.has(k)) return;
  monArtBusy.add(k); drawMonsters(); sync(1);
  try {
    let bmp; try { bmp = await createImageBitmap(file); } catch { throw new Error("Chrome can't open that picture. Save it as a JPG or PNG."); }
    let full = PT_TYPES.includes(file.type) && file.size <= 8e6 ? { mime: file.type, data: await blobB64(file) } : null;
    if (!full) { full = await ptEncode(bmp, 2400, file.type === "image/png" ? "image/png" : "image/jpeg", 0.92); if (full.size > 9e6) full = await ptEncode(bmp, 1600, "image/jpeg", 0.88); }
    const small = await ptEncode(bmp, 400, "image/webp", 0.85);
    const cv = document.createElement("canvas"); cv.width = bmp.width; cv.height = bmp.height; cv.getContext("2d").drawImage(bmp, 0, 0);
    const pogCv = drawPog(await loadImg(cv.toDataURL("image/png")), null, "enemy", 512);
    const label = monLabel(name);
    const r = await bridgePost({ monArt: { key: k, name: label, full: { mime: full.mime, data: full.data }, small: { mime: small.mime, data: small.data }, pog: { mime: "image/png", data: pogCv.toDataURL("image/png").split(",")[1] } } }).catch(e => ({ ok: false, error: e.message }));
    if (!r.ok) throw new Error(ptBridgeMsg(r.error));
    const a = await monArtPog({ t: r.t, name: r.name, url: `data:${small.mime};base64,${small.data}`, pogId: r.pogId, f: null });
    monArt.set(k, a); cache.set("ma." + k, a); monArtChecked.add(k); ok = true;
  } catch (e) { monArtErr("Couldn't save the monster art: " + (e.message || e)); }
  finally { monArtBusy.delete(k); sync(-1); if ($("mo")) drawMonsters(); }
  if (ok) monArtOffer(k, name);
}
// Other monsters on screen with a similar name and no art yet ("Hive Runner Boss" after "Hive Runner"): offer the same art.
// Names that only differ by a number ("Hive Runner 1/2/3") already share art automatically.
function monArtOffer(k, name) {
  const words = (x) => x.split(" ").filter(w => w.length >= 3);

    .filter(([ck]) => ck !== k && !monArt.has(ck) && (ck.includes(k) || k.includes(ck) || (kw[0] && words(ck)[0] === kw[0])));

  const ov = document.createElement("div"); ov.className = "ptov";
  ov.innerHTML = `<div class="ptbox" style="align-items:stretch;min-width:240px"><button class="ptx" title="Close">✕</button><b>SAME ART?</b>
    <div class="mnote" style="color:var(--dim)">Use the ${esc2(monLabel(name))} art for these too?</div>
    ${cand.map(([ck, n]) => `<label class="ptsw"><input type="checkbox" value="${esc2(ck)}" checked> ${esc2(monLabel(n))}</label>`).join("")}
    <div class="ptbtns"><button class="sbtn" data-x="no">NO THANKS</button><button class="sbtn on" data-x="yes">YES, USE IT</button></div></div>`;
  document.body.append(ov);

  };
}

async function syncDeadGroups() {

  const alive = new Map();
  for (let row = hdr + 1; row < v.length; row++) {

    const g = c(row, 1) || name, dead = /^(true|x|yes|dead)$/i.test(c(row, 19));

  // keep the "×3" count on the bar in step with how many are still alive

const ptMem = new Map(), ptLoading = new Map();

  else if (ptBridge === null) ptBridge = false;

function ptGet(id) { // {url, f} of the current portrait's small copy and its framing (null if none)
  const t = ptT(id); if (!t) return Promise.resolve(null);

  const c = cache.get("pt." + id); if (c && c.t === t) { ptMem.set(id, c); return Promise.resolve(c); }
  if (ptLoading.has(id)) return ptLoading.get(id);

const ptSmall = (id) => ptGet(id).then(v => v ? v.url : "");

const blobB64 = (blob) => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.onerror = () => rej(new Error("couldn't read the picture")); fr.readAsDataURL(blob); });
async function ptEncode(bmp, max, mime, q) { // shrink to fit max×max and encode
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height)), w = Math.max(1, Math.round(bmp.width * k)), h = Math.max(1, Math.round(bmp.height * k));

}
async function ptUpload(file) {
  const id = sheetId();
  if (!id || id === "__party" || ptBusy) return false;
  if (!file || !/^image\//.test(file.type)) { ptErr("That isn't a picture. Use a JPG or PNG."); return false; }
  if (ptBridge === false) { ptErr("Portraits need the Sheet Bridge update first (ask your GM)."); return false; }
  ptBusy = true; if (!partyOn) drawSheet(); sync(1);
  try {
    let bmp;
    try { bmp = await createImageBitmap(file); } catch { throw new Error("Chrome can't open that picture. Save it as a JPG or PNG and try again."); }
    // full picture: the original file when it's a normal type and not huge, otherwise a big resized copy
    let full = PT_TYPES.includes(file.type) && file.size <= 8e6 ? { mime: file.type, data: await blobB64(file) } : null;
    if (!full) { full = await ptEncode(bmp, 2400, file.type === "image/png" ? "image/png" : "image/jpeg", 0.92); if (full.size > 9e6) full = await ptEncode(bmp, 1600, "image/jpeg", 0.88); }

    const r = await bridgePost({ portrait: { full: { mime: full.mime, data: full.data }, small: { mime: small.mime, data: small.data } } }).catch(e => ({ ok: false, error: e.message }));
    if (!r.ok) throw new Error(/wrong table code/i.test(r.error || "") ? ptBridgeMsg(r.error) : /nothing to change/i.test(r.error || "") ? "the Sheet Bridge needs updating first (ask your GM)." : /failed to fetch/i.test(r.error || "") ? "the Sheet Bridge didn't answer. Try again." : r.error);
    const v = { t: r.t, url: `data:${small.mime};base64,${small.data}` };
    ptStamp.set(id, r.t); cache.set("ptt." + id, r.t); ptMem.set(id, v); cache.set("pt." + id, v); ptBridge = true;
    if (ptP.id === id) { ptP.pics = null; ptP.sel = ""; ptP.edit = false; ptP.msg = ["ok", "Picture added. It's your portrait now. Tap ✎ ADJUST CIRCLE to frame it."]; }
    ptBusy = false; if (!partyOn && sheetId() === id) drawSheet();
    return true;
  } catch (e) {
    ptBusy = false; if (!partyOn && sheetId() === id) drawSheet();
    ptErr("Couldn't save the picture: " + (e.message || e));
    ptSay("bad", "Couldn't save the picture: " + (e.message || e));
    return false;
  } finally { ptBusy = false; sync(-1); }
}
// the current portrait changed: new time stamp, drop the old small copy so the new one is fetched
function ptChanged(id, t) {

// ---------- POGS ----------
// A pog = the picture in a circle (same framing as the portrait) + the table's ring. Every pog uses POG_STYLE.
const POG_STYLE = "neon";
const POG_STYLES = {
  neon:   { name: "Neon (cyan / magenta)", a: "#19e6ff", b: "#ff2bd6", c: "#7a5cff", glow: "#19e6ff" },
  acid:   { name: "Acid (green / cyan)",   a: "#7dff3a", b: "#00e5c7", c: "#d6ff3a", glow: "#7dff3a" },
  amber:  { name: "Amber (gold / orange)", a: "#ffd23a", b: "#ff7a1a", c: "#ffb000", glow: "#ffb000" },
  enemy:  { name: "Enemy (red / orange)",  a: "#ff2b3d", b: "#ff8a1a", c: "#d4002f", glow: "#ff2b3d" },
  violet: { name: "Violet (purple / pink)", a: "#b388ff", b: "#ff4fa3", c: "#6a5cff", glow: "#b388ff" },
};
function drawPog(img, f, style, S = 512) {
  const st = POG_STYLES[style] || POG_STYLES.neon;
  const cv = document.createElement("canvas"); cv.width = cv.height = S;
  const g = cv.getContext("2d"), c = S / 2, k = S / 512;
  const R = 240 * k, r0 = 192 * k; // outer edge, picture radius
  // picture, framed like the portrait circle
  g.save(); g.beginPath(); g.arc(c, c, r0, 0, Math.PI * 2); g.clip();
  g.fillStyle = "#0b0d16"; g.fillRect(0, 0, S, S);
  if (img) {
    const a = img.naturalWidth / img.naturalHeight || 1, z = f?.z || 1, x = f?.x ?? 50, y = f?.y ?? 50, D = r0 * 2;
    const W = (a >= 1 ? a : 1) * D * z, H = (a >= 1 ? 1 : 1 / a) * D * z;
    g.drawImage(img, c - r0 + (D - W) * x / 100, c - r0 + (D - H) * y / 100, W, H);
  }
  // inner shade so the ring sits on top
  const sh = g.createRadialGradient(c, c, r0 * 0.78, c, c, r0); sh.addColorStop(0, "rgba(0,0,0,0)"); sh.addColorStop(1, "rgba(0,0,0,.45)");
  g.fillStyle = sh; g.fillRect(0, 0, S, S); g.restore();
  // dark metal band
  g.beginPath(); g.arc(c, c, R, 0, Math.PI * 2); g.arc(c, c, r0, 0, Math.PI * 2, true);
  const band = g.createLinearGradient(0, 0, S, S); band.addColorStop(0, "#353b52"); band.addColorStop(.45, "#0c0f19"); band.addColorStop(1, "#2c3145");
  g.fillStyle = band; g.fill();
  // neon gradient (conic) helper
  const neon = () => { const cg = g.createConicGradient(-Math.PI / 2, c, c); cg.addColorStop(0, st.a); cg.addColorStop(.33, st.b); cg.addColorStop(.66, st.c); cg.addColorStop(1, st.a); return cg; };
  // outer neon rim in 4 arcs with notches
  g.save(); g.shadowColor = st.glow; g.shadowBlur = 14 * k; g.strokeStyle = neon(); g.lineWidth = 11 * k; g.lineCap = "butt";
  const gap = 0.09;
  for (let i = 0; i < 4; i++) { const a0 = i * Math.PI / 2 + Math.PI / 4 + gap, a1 = (i + 1) * Math.PI / 2 + Math.PI / 4 - gap; g.beginPath(); g.arc(c, c, R - 7 * k, a0, a1); g.stroke(); }
  g.restore();
  // notch blocks in the gaps
  g.save(); g.fillStyle = neon(); g.shadowColor = st.glow; g.shadowBlur = 10 * k;
  for (let i = 0; i < 4; i++) { const ang = i * Math.PI / 2 + Math.PI / 4; g.save(); g.translate(c, c); g.rotate(ang); g.fillRect(R - 16 * k, -4 * k, 14 * k, 8 * k); g.restore(); }
  g.restore();
  // inner neon line
  g.save(); g.strokeStyle = neon(); g.lineWidth = 5 * k; g.shadowColor = st.glow; g.shadowBlur = 10 * k; g.beginPath(); g.arc(c, c, r0 + 2.5 * k, 0, Math.PI * 2); g.stroke(); g.restore();
  // tick marks around the band (data-ring look), longer every 6th
  g.save(); g.strokeStyle = "rgba(220,235,255,.5)"; g.lineWidth = 2 * k;
  for (let i = 0; i < 72; i++) { const ang = i / 72 * Math.PI * 2; const long = i % 6 === 0; const r1 = r0 + 11 * k, r2 = r0 + (long ? 25 : 17) * k;

  g.restore();

  g.save(); g.beginPath(); g.arc(c, c, R - 1.5 * k, Math.PI * 1.05, Math.PI * 1.45); g.strokeStyle = "rgba(255,255,255,.45)"; g.lineWidth = 2.5 * k; g.stroke(); g.restore();
  return cv;
}

// Drop a picture anywhere on your sheet (or in Manage Character) to make it the portrait
function ptDrop() {
  const z = $("shbody"); if (!z) return;
  const ok = (e) => !partyOn && sheetId() && sheetId() !== "__party" && ptBridge !== false && (mgrOn || !ptHidden()) && [...(e.dataTransfer?.types || [])].includes("Files");
  z.ondragover = (e) => { if (!ok(e)) return; e.preventDefault(); z.classList.add("ptdrag"); };
  z.ondragleave = (e) => { if (!z.contains(e.relatedTarget)) z.classList.remove("ptdrag"); };
  z.ondrop = (e) => { z.classList.remove("ptdrag"); if (!ok(e)) return; e.preventDefault(); const f = [...(e.dataTransfer.files || [])].find(f => /^image\//.test(f.type)); f ? ptUpload(f) : ptErr("That isn't a picture. Use a JPG or PNG."); };
}
// a file dropped anywhere else must not open in the panel (that would replace the whole extension)
document.addEventListener("dragover", (e) => { if ([...(e.dataTransfer?.types || [])].includes("Files")) e.preventDefault(); });
document.addEventListener("drop", (e) => { if ([...(e.dataTransfer?.types || [])].includes("Files")) e.preventDefault(); });

async function showParty() {
  partyOn = true;
  const body = $("shbody") || ($("sh").insertAdjacentHTML("beforeend", `<div id="shbody"></div>`), $("shbody"));
  const saved = cache.get(ck("chars"));
  if (saved?.length) drawParty(body, saved);
  else body.innerHTML = `<div class="empty">Loading party…</div>`;
  sync(1);
  try {
    const chars = await characterSheets();
    if (!partyOn) return;
    drawParty(body, chars);
  } catch (e) { if (!saved?.length) body.innerHTML = `<div class="err">Couldn't load the party: ${esc2(e.message || e)}</div>`; }
  finally { sync(-1); }

let lastParty = null;
function drawParty(body, chars) {
  lastParty = chars;
  {
    const cell = (v, a1) => { const m = a1.match(/^([A-L])(\d+)$/); return String(v[+m[2] - 1]?.[m[1].charCodeAt(0) - 65] ?? "").trim(); };
    body.innerHTML = chars.length ? chars.map(c => { const v = c.values;
      const marks = "BCDEFGH".split("").map(c => !!cell(v, c + "16"));
      const worst = marks.lastIndexOf(true);
      const status = worst < 0 ? "Unhurt" : cell(v, "BCDEFGH"[worst] + "15").replace(/^\S+\s+/, "");
      const used = cell(v, "F6").toUpperCase() === "TRUE";
      return `<div class="pcard">
        <div class="ptop">${ptIcon(c.id, cell(v, "C3"))}<b>${esc2(cell(v, "C3"))}</b>${isGM && ptT(c.id) ? `<button class="pogb" data-pog="${esc2(c.id)}" data-n="${esc2(cell(v, "C3"))}" title="Add this character's pog to your Owlbear characters">◎ POG</button>` : ""}<small>${esc2(cell(v, "C4"))}</small><span class="ppw ${used ? "u" : ""}">${used ? "POWER USED" : "POWER READY"}</span></div>
        ${actBadge(cell(v, "C3"))}<div class="pvit">${marks.map((m, i) => `<i><small>${["LW", "LW", "LW", "MW", "CW", "KO", "D"][i]}</small><span class="${m ? "x" : ""}"></span></i>`).join("")}<em class="${worst >= 4 ? "bad" : ""}">${esc2(status)}</em></div>
      </div>`;
    }).join("") : `<div class="empty">No characters found.</div>`;
    fillPts(body);
    body.querySelectorAll(".pti").forEach(b => b.onclick = () => ptView(b.dataset.ptv, b.dataset.n, false));
    body.querySelectorAll(".pogb").forEach(b => b.onclick = async () => {
      const note = (t, k = "INFO") => { OBR.notification.show(t, k).then(id => setTimeout(() => OBR.notification.close(id).catch(() => {}), 5000)).catch(() => {}); };
      b.disabled = true; b.textContent = "…";
      try {
        const r = await bridgeGet({ pog: b.dataset.pog });
        if (!r.ok) throw new Error(ptBridgeMsg(r.error));
        if (r.none) { note(`${b.dataset.n} has no pog yet. The player makes one in Manage Character → Portrait.`); return; }
        note("Owlbear is opening an upload window. Click UPLOAD in it.");
        await pogToOwlbear(await b64Blob(r.mime, r.data), b.dataset.n);
        note(`${b.dataset.n}'s pog is in your Owlbear images (Characters).`, "SUCCESS");
      } catch (e) { note("Couldn't add the pog: " + (e.message || e), "ERROR"); }
      finally { b.disabled = false; b.textContent = "◎ POG"; }
    });
  }
}

// ---------------- PANEL SIZE (S / M / L, remembered per player) ----------------
const SIZES = { S: [264, 680], L: [520, 1400] };
function applySize() {
  const k = SIZES[store.get("ns.size")] ? store.get("ns.size") : "L"; // starts wide
  // the button shows what it will do: arrows out = make wider, arrows in = make narrower
  const out = `<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const inn = `<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M2 12h8M7 8l3 4-3 4M22 12h-8M17 8l-3 4 3 4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  $("size").innerHTML = k === "L" ? inn : out;
  $("size").title = k === "L" ? "Make the panel narrower" : "Make the panel wider";
  if (standalone) return;
  OBR.action.setWidth(SIZES[k][0]).catch(() => {});
  if (k !== "L") return OBR.action.setHeight(SIZES[k][1]).catch(() => {});
  // wide: fill the screen top to bottom. Asked again a moment later too, in case Owlbear was still opening the panel,
  // and the button's tooltip shows what was asked for and what we got (for troubleshooting).
  const fit = async () => {
    let vh = 0; try { vh = await OBR.viewport.getHeight(); } catch {}
    const want = vh ? Math.max(500, vh - 70) : SIZES.L[1];
    await OBR.action.setHeight(want).catch(() => {});
    setTimeout(() => { if (store.get("ns.size") !== "S") $("size").title = `Make the panel narrower  (screen ${vh} · asked ${want} · got ${window.innerHeight})`; }, 400);
  };
  fit(); setTimeout(fit, 600); setTimeout(fit, 2000);
}
$("size").onclick = () => { store.set("ns.size", (SIZES[store.get("ns.size")] ? store.get("ns.size") : "L") === "L" ? "S" : "L"); applySize(); };

  clearTimeout(updateInitBanner.t); if (owed) updateInitBanner.t = setTimeout(() => updateInitBanner(), 30e3);
}
$("initx").onclick = () => { const s = lastMd?.[INIT]; if (s) store.set("ns.initHide", s.sid); $("initban").hidden = true; };
$("initgo").onclick = () => {
  const adr = sheetVals?.[6]?.[2];
  if (adr != null && String(adr).trim() !== "") return quickRoll(adr, "Adroitness");
  document.querySelector('.tab[data-t="sheet"]').click(); // sheet not loaded yet: open it so they can roll from there
};
// Uplink mode: this page opened as the pop-out beside the map, showing only the Analog Dice Uplink.
// The character sheet still loads (hidden) so modifiers, wounds and powers stay right.
const UPLINK = new URLSearchParams(location.search).get("uplink") === "1";
if (UPLINK) {
  document.body.classList.add("upl");
  $("hand").hidden = false;
  drawHand();
  try { localStorage.setItem("ns.popOpen", "__uplink"); } catch {}
  window.addEventListener("pagehide", () => { try { if (localStorage.getItem("ns.popOpen") === "__uplink") localStorage.removeItem("ns.popOpen"); } catch {} });
  $("uplx").onclick = () => { try { localStorage.removeItem("ns.popOpen"); } catch {} standalone ? window.close() : OBR.popover.close("com.newscolos.rules").catch(() => {}); };
}
$("handpop").onclick = () => popOut("__uplink");
if (standalone) {
  document.querySelector('.tab[data-t="sheet"]').click();
  document.querySelector("nav").insertAdjacentHTML("beforeend", `<span style="color:var(--dim);font-size:10px">TEST</span>`);
} else {
  OBR.onReady(async () => {
    me = await OBR.player.getId();
    isGM = (await OBR.player.getRole()) === "GM";
    campaign = String((await OBR.room.getMetadata())[CAMP] || "");
    encList = cache.get(ck("encList")) || [];
    OBR.room.onMetadataChange((md) => { // GM switched this room to another campaign: reload whatever tab is open
      const c = String(md[CAMP] || ""); if (c === campaign) return;
      campaign = c; encList = cache.get(ck("encList")) || []; monVals = null; sheetVals = null;
      document.querySelector(".tab.on")?.click();
    });
    $("monTab").hidden = !isGM;
    document.querySelector('.tab[data-t="sheet"]').click(); // Character is the first tab: open it once the GM/player role is known
    if (isGM) { initMd = await OBR.room.getMetadata(); OBR.room.onMetadataChange((m) => { initMd = m; drawInitList(); markTurn(); }); }
    if (!UPLINK) applySize();
    render(rollLog(OBR.room.id, allRolls(await OBR.room.getMetadata())));
    OBR.room.onMetadataChange((md) => { render(rollLog(OBR.room.id, allRolls(md))); updateInitBanner(md); actSync(md); });
    updateInitBanner(); actSync(await OBR.room.getMetadata());
    const readAct = (ps) => { partyAct = ps.map(p => p.metadata?.[ACT_MD]).filter(Boolean); if (partyOn && lastParty && $("shbody")) drawParty($("shbody"), lastParty); };
    readAct(await OBR.party.getPlayers()); OBR.party.onChange(readAct);
  });
}
</script>
</body>
</html>
