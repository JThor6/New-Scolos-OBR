<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  :root { --paper:#222639; --ink:#f1f3f9; --dim:#9aa0b8; --accent:#bb99ff; --plus:#5fd38d; --minus:#ff6b6b; }
  html { margin:0; background:transparent; }
  body { margin:0; zoom:0.85; color:var(--ink); font-family:system-ui, sans-serif; font-size:14px; min-height:100vh; box-sizing:border-box;
    background:#222639; border:1px solid rgba(255,255,255,.12); border-radius:12px; overflow:hidden auto; }
  header { display:flex; align-items:center; gap:6px; background:#000; padding:7px 10px; position:sticky; top:0; z-index:1; border-radius:12px 12px 0 0; }
  header h1 { flex:1; margin:0; font-family:'Bangers', Impact, sans-serif; font-weight:400; font-size:20px; letter-spacing:1px; color:var(--accent); }
  #x { background:transparent; border:2px solid #444a66; color:var(--ink); border-radius:6px; width:26px; height:26px; cursor:pointer; font-weight:800; }
  #wrap { padding:2px 10px 10px; }
  .dice { display:flex; gap:6px; align-items:center; }
  .die { width:30px; height:30px; border:2px solid var(--ink); border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:900; background:rgba(10,12,20,.6); box-sizing:border-box; }
  .die.p { color:var(--plus); border-color:var(--plus); }
  .die.m { color:var(--minus); border-color:var(--minus); }
  .empty { padding:14px 2px; color:var(--dim); }
</style></head>
<body>
<header><h1>ROLL HISTORY</h1><button id="x" title="Close">✕</button></header>
<div id="wrap"><div class="empty">Loading…</div></div>
<script type="module">
import OBR from "https://esm.sh/@owlbear-rodeo/sdk@3.1.0";
import { allRolls, rollLine, ROLL_CSS, rollLog, LOG_MAX } from "./shared.js";
document.head.insertAdjacentHTML("beforeend", `<style>${ROLL_CSS}</style>`);
const detail = () => { try { return localStorage.getItem("ns.histDetail") === "on"; } catch { return false; } };
let rolls = [];
function draw() {
  const d = detail();
  document.getElementById("wrap").innerHTML = `<button id="det" class="histdet">${d ? "DETAILED ▲ (tap for simple)" : "SIMPLE ▼ (tap for detailed)"}</button>` +
    (rolls.length ? rolls.slice(0, LOG_MAX).map(r => rollLine(r, d)).join("") : `<div class="empty">No rolls yet.</div>`);
  document.getElementById("det").onclick = () => { try { localStorage.setItem("ns.histDetail", d ? "off" : "on"); } catch {} draw(); };
}
// the panel's SIMPLE/DETAILED switch and this one stay in step
window.addEventListener("storage", (e) => { if (e.key === "ns.histDetail") draw(); });
document.getElementById("x").onclick = () => OBR.popover.close("com.newscolos.dicelist").catch(() => {});
if (!OBR.isAvailable) draw();
OBR.onReady(async () => {
  rolls = rollLog(OBR.room.id, allRolls(await OBR.room.getMetadata())); draw();
  OBR.room.onMetadataChange((md) => { rolls = rollLog(OBR.room.id, allRolls(md)); draw(); });
});
</script></body></html>
