<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="module">
import OBR, { buildShape } from "https://esm.sh/@owlbear-rodeo/sdk@3.1.0";
import { allRolls, CLEARED, INIT, initEntries, markList, rollLog, rollKey, KEEP, sameName, sdResult, turnNames } from "./shared.js";
// Runs all session, even when the dice panel is closed.
// Shows rolls as small cards at the bottom middle of the map. Up to 8 at once (two rows of 4, middle cards first),
// so when everyone rolls together (initiative) the whole table's results are visible.
const TOAST = "com.newscolos.dice/toast";
const W = 210, H = 74, GAP = 6, SLOTS = 8, PER_ROW = 4, SHOW_MS = 9000; // 9 s on screen (hover keeps a card up)
const busyUntil = new Array(SLOTS).fill(0);
// A card the mouse is resting on says so in localStorage ("held until" time), so a new roll never lands on top of it
const held = (id) => { try { return Number(localStorage.getItem("ns.hold:" + id) || 0) > Date.now(); } catch { return false; } };
// Where the bottom row of roll cards starts (the Success Delta card sits just left of it)
let rowLeft = 0;

async function showRoll(r, spin) {
  const now = Date.now();
  let slot = busyUntil.findIndex((t, i) => t < now && !held(TOAST + "/" + i));
  if (slot < 0) { // all full: replace the oldest one nobody is hovering
    const free = busyUntil.map((t, i) => [t, i]).filter(([, i]) => !held(TOAST + "/" + i)).sort((a, b) => a[0] - b[0]);
    slot = free.length ? free[0][1] : busyUntil.indexOf(Math.min(...busyUntil)); }
  const show = SHOW_MS + (spin ? 2000 : 0);
  busyUntil[slot] = now + show + 400;
  const id = TOAST + "/" + slot;
  const url = new URL("go.html", location.href); url.searchParams.set("p", "toast");
  const ref = new URLSearchParams(location.search).get("obrref"); if (ref) url.searchParams.set("obrref", ref);
  url.searchParams.set("id", id);
  url.searchParams.set("ms", show);
  url.searchParams.set("who", r.who);
  if (r.char) url.searchParams.set("char", r.char);
  url.searchParams.set("dice", r.dice.join(","));
  url.searchParams.set("mod", r.mod || 0);
  url.searchParams.set("total", r.total);
  if (r.label) url.searchParams.set("label", r.label);
  if (r.ks) url.searchParams.set("ks", "1"); else if (r.pw) url.searchParams.set("pw", "1"); // Kill Shot red card, daily power gold card
  if (r.cop) { url.searchParams.set("cop", "1"); if (r.max != null) url.searchParams.set("max", r.max); if (r.con) url.searchParams.set("con", r.con); if (r.cos) url.searchParams.set("cos", r.cos); if (r.nocp) url.searchParams.set("nocp", "1"); spin = false; } // Combat Option Point used: no dice
  if (r.ap || r.bs) { url.searchParams.set("ap", r.ap || "bullet stop"); spin = false; } // a power switched on: no dice
  if (r.wnd) url.searchParams.set("wnd", r.wnd); // the card shows it on the name line, whatever the label's length
  if (spin) url.searchParams.set("spin", "1");
  const vw = await OBR.viewport.getWidth(), vh = await OBR.viewport.getHeight();
  // Cards sit at the bottom middle of the map, just above Owlbear's bottom toolbar, out of the way of the
  // REFERENCE pop-out (upper right). If the New Scolos panel is open on the left, they center in the space beside it.
  let left = 0;
  try { if (await OBR.action.isOpen()) left = ((await OBR.action.getWidth()) || 520) + 40; } catch {}
  const { per, x0 } = rowLayout(vw, left);
  const order = [1, 2, 0, 3].filter(i => i < per).concat([...Array(per).keys()].filter(i => i > 3)); // middle cards first
  const idx = slot % per, row = Math.floor(slot / per), col = per === 1 ? 0 : (order[idx] ?? idx);
  rowLeft = x0;
  await OBR.popover.open({ // every card the same size: room for the longest skill name (3 lines)
    id, url: url.href, width: W, height: H + 32,
    anchorReference: "POSITION",
    anchorPosition: { left: Math.round(x0 + col * (W + GAP)), top: vh - 80 - row * (H + 32 + GAP) },
    anchorOrigin: { horizontal: "LEFT", vertical: "BOTTOM" },
    transformOrigin: { horizontal: "LEFT", vertical: "BOTTOM" },
    disableClickAway: true, hidePaper: true,
  });
}

// Where the roll-card row goes. Room is always kept on its left for the Success Delta card, so cards never land on it
// (Jake, Nov 25). On a small screen the Success Delta card is the compact one at the right edge, so nothing is kept.
function rowLayout(vw, left) {
  const keep = vw - left - 16 >= SD_W + 10 ? SD_W + GAP + 8 : 0, lo = left + keep;
  const space = vw - lo - 20, per = Math.max(1, Math.min(PER_ROW, Math.floor((space + GAP) / (W + GAP))));
  const rowW = per * W + (per - 1) * GAP;
  return { per, x0: Math.max(lo, lo + (vw - lo - rowW) / 2) };
}
// ---------------- Success Delta ----------------
// In or out of combat, an attack roll (Ranged Weapons, Melee Weapon Fighting, Martial Arts, Unconventional Weapons,
// Spellcasting, Meltdown, a monster's Attack) waits for Adroitness rolls by other people: the defenders.
// Most attacks have one defender. Area-capable ones (Spellcasting, Unconventional Weapons, Meltdown, monster Attacks) show
// − / + on the card to set how many: the next that many different people's Adroitness rolls each get their own result.
// Every screen works it out from the same shared rolls, so everyone sees the same thing. Nothing gets marked on a sheet.
// Success Delta = attack total - defense total (ties go to the attacker). Damage = Delta + Damage Bonus - defender's Armor Bonus.
// Wounds (Main Sheet row 15): 1-2 Light, 3-4 Medium, 5-6 Critical, 7-8 Down & KO'ed, 9+ Dead.
// The card itself is sdcard.html, just left of the roll cards. It reads this screen's results and the waiting attack from
// localStorage ("ns.sd:<room>"), so it updates in place; ‹ › pages through results; 📌 picks "stays up" or "fades after 30 s".
// The defender's roll card spins about 2 seconds before its dice land; the Success Delta card shows up then, not before
const REVEAL_MS = 2100;
const SD = "com.newscolos.dice/delta", SD_W = 280, ATTACK_WAIT = 3 * 60e3, SD_KEEP = 30;
const SDCANCEL = "com.newscolos.dice/sdcancel"; // room metadata: { id } of an attack someone dropped with ✕
const SDN = "com.newscolos.dice/sdn";           // room metadata: { id, n, ts } how many defenders an attack has
const MULTI = /spellcast|unconventional|meltdown|shockwave|^attack\b/i;
let amGM = false;
let openAttack = null, myId = "", lastCancel = "", lastSdn = 0, sd = { list: [], wait: null };
const nameOf = (r) => r.char || r.who;
const isAdr = (r) => /^(?:⚡\s*)?adroitness\b/i.test(String(r.label || "")) && !/initiative/i.test(String(r.label || ""));
// Most attacks are defended with Adroitness; a spell can name another attribute (Choking Gas: Raw Strength)
const defOk = (a, r) => { const at = String(a.dfa || "Adroitness").toLowerCase(), l = String(r.label || "").replace(/^⚡\s*/, "").toLowerCase();
  return l.startsWith(at) && !/initiative/i.test(l); };
const sdKey = () => "ns.sd:" + OBR.room.id;
const sdSave = () => { try { localStorage.setItem(sdKey(), JSON.stringify(sd)); } catch {} };
function syncWait() {
  const a = openAttack;
  sd.wait = a ? { id: a.id, att: nameOf(a), who: a.char ? a.who : "", at: a.total, l: String(a.label || "").slice(0, 46),
    sp: /spellcast|smite/i.test(a.label || "") ? 1 : 0, multi: a.multi, tg: a.tg || null, notg: a.notg ? 1 : 0, n: a.n, defs: a.defs, at0: a.at0, dfa: a.dfa || "" } : null;
  sdSave();
}
// One screen works out each result: the one whose roll is the defense (the defender's player, or the GM for monsters).
// It saves the result into the room like a roll, so every screen shows the same card and Roll History line,
// including anyone who joins later. Other screens only keep track of the attack and who has defended.
function combatCheck(r, mine) {
  if (r.cop || r.ap || r.sd || !Array.isArray(r.dice) || !r.dice.length) return;
  if (r.atk) {
    // 🎯 Targets on and tokens selected: exactly those defend (one each); otherwise the next Adroitness roll(s)
    const tg = Array.isArray(r.tg) && r.tg.length ? r.tg.slice(0, 12) : null;
    openAttack = { ...r, at0: Date.now(), n: tg ? tg.length : 1, defs: [], tg, multi: tg || MULTI.test(String(r.label || "")) ? 1 : 0 };
    syncWait(); openCard().catch(() => {}); defPop(openAttack).catch(() => {}); gmDefPop(openAttack).catch(() => {}); return;
  }
  const a = openAttack, who = nameOf(r);
  if (!a || !defOk(a, r) || who === nameOf(a) || a.defs.includes(who) || a.defs.length >= a.n || Date.now() - a.at0 > ATTACK_WAIT) return;
  if (a.tg && !a.tg.some(t => sameName(t, who) || sameName(t, r.who))) return; // not one of the targets
  sd.revealAt = Date.now() + REVEAL_MS; // the card waits for the defender's dice to land
  a.defs.push(who); syncWait();
  if (mine) makeDelta(a, r).catch(() => {});
  // Backup: if the defender's screen missed the attack (joined or reloaded after it was rolled), it can't work it out.
  // The attacker's screen always saw it, so it does it after 4 seconds if nobody else has.
  else if (a.pid === myId) { const id = "sd-" + a.id + "-" + r.id; setTimeout(() => { if (!seenIds.has(id) && !sd.list.some(x => x.id === id)) makeDelta(a, r).catch(() => {}); }, 4000); }
}
async function makeDelta(a, d) {
  const e = { id: "sd-" + a.id + "-" + d.id, aid: a.id, sd: 1, pid: myId, ts: (d.ts || Date.now()) + 1, who: nameOf(a), dice: [], total: a.total - d.total,
    att: nameOf(a), def: nameOf(d), at: a.total, dt: d.total, delta: a.total - d.total };
  if (a.db != null) { e.db = a.db; if (a.dbk) e.dbk = a.dbk; } else if (a.pwd) e.dbk = "power"; else if (a.sp) { e.sp = 1; e.dbk = "spell"; }
  if (d.ab != null) e.ab = d.ab;
  if (d.dbl) e.dbl = 1; // Optical Illusion Double: tails, the attack hit the double
  seenIds.add(e.id);
  addResult(e);
  // saved under its own key (…/rolls/<player>~sd), so it can never collide with the panel saving that player's next roll
  const key = rollKey(myId) + "~sd", md = await OBR.room.getMetadata(), list = Array.isArray(md[key]) ? md[key] : [];
  // only the last 3 per player go in the room (it holds ~16 kB for everyone); each screen keeps its own 30 for ‹ ›
  if (!list.some(x => x.id === e.id)) await OBR.room.setMetadata({ [key]: [e, ...list].slice(0, 3) });
}
let seenIds = new Set();
function addResult(e) {
  try { rollLog(OBR.room.id, [e]); } catch {}
  if (!e.aid) e.aid = String(e.id || "").split("-")[1] || ""; // results saved before Nov 25 didn't carry the attack id
  // A result always counts its defender on the waiting attack, even if this screen missed the defense roll itself
  // (otherwise "roll Adroitness" stays up under a hit that's already worked out)
  if (openAttack && e.aid === openAttack.id && e.def && !openAttack.defs.some(d => sameName(d, e.def))) { openAttack.defs.push(e.def); syncWait(); }
  const fresh = !sd.list.some(x => x.id === e.id);
  if (fresh) { sd.list.push(e); sd.list = sd.list.slice(-SD_KEEP);
    if (Date.now() - (e.ts || 0) < 4000) sd.revealAt = Math.max(Number(sd.revealAt) || 0, (e.ts || Date.now()) + REVEAL_MS); }
  sdSave(); openCard().catch(() => {});
  if (fresh && amGM) adWatch(e).catch(() => {});
}
// GM screen: AUTO DAMAGE is on and this hit lands a wound, but no New Scolos panel or Party pop-out is open to mark it:
// say so on the card (it catches up within 10 minutes once one opens)
async function adWatch(e) {
  const R = sdResult(e); if (!R.hit || !R.w) return;
  const md = await OBR.room.getMetadata(), ad = md["com.newscolos.autodmg"]; if (ad !== undefined && ad !== null && !Number(ad)) return; // on unless switched off
  await new Promise(r => setTimeout(r, 4000));
  let alive = 0; try { alive = Number(localStorage.getItem("ns.adAlive:" + OBR.room.id) || 0); } catch {}
  if (Date.now() - alive < 6000) return;
  const md2 = await OBR.room.getMetadata(), ap = Array.isArray(md2[APPLIED]) ? md2[APPLIED] : [];
  if (ap.some(a => a.id === e.id)) return;
  await OBR.room.setMetadata({ [APPLIED]: [{ id: e.id, t: "Auto damage: not marked yet. Open the New Scolos panel (GM) and it catches up." }, ...ap].slice(0, 8) });
}
// Opens (or reopens) the card: just left of the roll cards, on the bottom row; if there's no room, at the left edge beside the panel.
// It sizes itself to what it shows, growing upward.
async function openCard() {
  try { if (Date.now() - Number(localStorage.getItem("ns.sdAlive:" + OBR.room.id) || 0) < 3500) return; } catch {} // already showing
  const url = new URL("go.html", location.href); url.searchParams.set("p", "sdcard"); url.searchParams.set("room", OBR.room.id);
  const ref = new URLSearchParams(location.search).get("obrref"); if (ref) url.searchParams.set("obrref", ref);
  const vw = await OBR.viewport.getWidth(), vh = await OBR.viewport.getHeight();
  let left = 0; try { if (await OBR.action.isOpen()) left = ((await OBR.action.getWidth()) || 520) + 40; } catch {}
  const x0 = rowLayout(vw, left).x0, x = Math.max(left + 8, Math.round(x0 - SD_W - GAP)); // just left of where the roll cards go
  // Small screen: not enough map beside the panel for the full card, so a compact one sits at the right edge, just above
  // the roll cards. Tapping it opens the full card (growing leftward over the panel for a moment); tap again to shrink.
  const room = vw - left - 16, mini = room < SD_W + 10;
  if (mini) { url.searchParams.set("mini", "1"); url.searchParams.set("mw", String(Math.max(190, Math.min(250, room)))); }
  const w = mini ? Math.max(190, Math.min(250, room)) : SD_W;
  const h = mini ? 84 : sd.list.length ? (sd.wait ? 270 : 196) : 112; // first guess; the card fixes it
  await OBR.popover.close(SD).catch(() => {});
  await OBR.popover.open({ id: SD, url: url.href, width: w, height: h,
    anchorReference: "POSITION", anchorPosition: mini ? { left: vw - 8, top: vh - 80 - 112 } : { left: x, top: vh - 80 },
    anchorOrigin: { horizontal: mini ? "RIGHT" : "LEFT", vertical: "BOTTOM" }, transformOrigin: { horizontal: mini ? "RIGHT" : "LEFT", vertical: "BOTTOM" },
    disableClickAway: true, hidePaper: true });
}
// "DEFEND!" pop-up at the top of the map for a player that Target Lock picked (players only; the GM's monster cards light up)
async function defPop(a) {
  if (amGM || !a.tg?.length) return;
  let mine = ""; try { mine = localStorage.getItem("ns.myChar:" + OBR.room.id) || ""; } catch {}
  if (!mine || sameName(mine, nameOf(a)) || !a.tg.some(t => sameName(t, mine))) return;
  const url = new URL("go.html", location.href); url.searchParams.set("p", "defpop");
  const ref = new URLSearchParams(location.search).get("obrref"); if (ref) url.searchParams.set("obrref", ref);
  url.searchParams.set("att", nameOf(a)); url.searchParams.set("at", a.total); url.searchParams.set("l", String(a.label || "").slice(0, 40));
  if (/spellcast|smite/i.test(a.label || "")) url.searchParams.set("sp", "1"); if (a.dfa) url.searchParams.set("dfa", a.dfa);
  const vw = await OBR.viewport.getWidth(), w = Math.min(420, vw - 40);
  await OBR.popover.close("com.newscolos.defpop").catch(() => {});
  await OBR.popover.open({ id: "com.newscolos.defpop", url: url.href, width: w, height: 70,
    anchorReference: "POSITION", anchorPosition: { left: Math.round(vw / 2), top: 76 }, // just under the initiative bar
    anchorOrigin: { horizontal: "CENTER", vertical: "TOP" }, transformOrigin: { horizontal: "CENTER", vertical: "TOP" },
    disableClickAway: true, hidePaper: true });
}
// "ROLL FOR INITIATIVE!" pop-up at the top of the map for players, with a button that rolls it (like DEFEND!)
async function initPop(sid) {
  if (amGM || !sid) return;
  try { if (localStorage.getItem("ns.initDone") === sid) return; } catch {}
  const url = new URL("go.html", location.href); url.searchParams.set("p", "initpop"); url.searchParams.set("sid", sid);
  const ref = new URLSearchParams(location.search).get("obrref"); if (ref) url.searchParams.set("obrref", ref);
  const vw = await OBR.viewport.getWidth(), w = Math.min(440, vw - 40);
  await OBR.popover.close("com.newscolos.initpop").catch(() => {});
  await OBR.popover.open({ id: "com.newscolos.initpop", url: url.href, width: w, height: 70,
    anchorReference: "POSITION", anchorPosition: { left: Math.round(vw / 2), top: 76 }, // just under the initiative bar
    anchorOrigin: { horizontal: "CENTER", vertical: "TOP" }, transformOrigin: { horizontal: "CENTER", vertical: "TOP" },
    disableClickAway: true, hidePaper: true });
}
// GM only: a slim "defend with" bar at the top of the map when a player's attack waits on a monster (Jake, Nov 25).
// gmdef.html works out which monsters can defend and closes itself once they have.
async function gmDefPop(a) {
  if (!amGM || a.pid === myId) return; // the GM's own (monster) attacks are defended by players
  const url = new URL("go.html", location.href); url.searchParams.set("p", "gmdef"); url.searchParams.set("room", OBR.room.id);
  const ref = new URLSearchParams(location.search).get("obrref"); if (ref) url.searchParams.set("obrref", ref);
  const vw = await OBR.viewport.getWidth(), vh = await OBR.viewport.getHeight(); let left = 0;
  try { if (await OBR.action.isOpen()) left = ((await OBR.action.getWidth()) || 520) + 40; } catch {}
  const w = Math.max(340, Math.min(700, vw - left - 40));
  await OBR.popover.close("com.newscolos.gmdef").catch(() => {});
  // Jake, Nov 26: big and low, in the middle of the map just above the roll cards, where the mouse usually is
  await OBR.popover.open({ id: "com.newscolos.gmdef", url: url.href, width: w, height: 84,
    anchorReference: "POSITION", anchorPosition: { left: Math.round(left + (vw - left) / 2), top: Math.max(140, vh - 200) },
    anchorOrigin: { horizontal: "CENTER", vertical: "BOTTOM" }, transformOrigin: { horizontal: "CENTER", vertical: "BOTTOM" },
    disableClickAway: true, hidePaper: true });
}
// ✕ on a waiting attack, and − / + defenders, come in through room metadata so every screen follows
// What the GM's AUTO DAMAGE marked ("Medium Wound marked on Hive Runner 2"): shown on the matching result card
const APPLIED = "com.newscolos.dice/applied";
function sdMeta(md) {
  const ap = Array.isArray(md[APPLIED]) ? md[APPLIED] : []; let ch = false;
  for (const a of ap) { const e = sd.list.find(x => x.id === a.id); if (e && e.ap !== a.t) { e.ap = String(a.t).slice(0, 120); ch = true; } }
  if (ch) sdSave();
  const c = md[SDCANCEL]; if (c?.id && c.id !== lastCancel) { lastCancel = c.id; if (openAttack?.id === c.id) { openAttack = null; syncWait(); } }
  const n = md[SDN]; if (n?.ts && n.ts !== lastSdn) { lastSdn = n.ts;
    if (openAttack?.id === n.id && openAttack.n !== n.n) { openAttack.n = Math.max(1, Math.min(12, Number(n.n) || 1)); syncWait(); } }
}

// ---------------- Turn rings ----------------
// A glowing purple ring around the token whose turn it is, and a faint one around whoever's on deck.
// Drawn locally on each screen (not saved in the scene), so the glow can pulse without sending anything to the room.
// Tokens are found by name (character name, or "Hive Runner 2" for a monster group stepping one member at a time).
const RING = "com.newscolos.turnring";
let ringKey = "", ringMd = null, ringTimer = 0, pulseT = 0;
const rnm = (x) => String(x || "").toLowerCase().replace(/\s+/g, " ").trim();
async function drawRings(md) {
  if (md) ringMd = md;
  try {
    if (!ringMd || !(await OBR.scene.isReady())) return;
    const { cur, deck } = turnNames(ringMd);
    const toks = cur || deck ? await OBR.scene.items.getItems(i => i.type === "IMAGE" && (i.layer === "CHARACTER" || i.layer === "MOUNT") && (amGM || i.visible !== false)) : [];
    const want = [...toks.filter(t => cur && rnm(t.name) === rnm(cur)).map(t => [t, "cur"]), ...toks.filter(t => deck && rnm(t.name) === rnm(deck)).map(t => [t, "deck"])];
    const key = want.map(([t, k]) => t.id + k + Math.round(t.scale?.x * 100)).join("|");
    if (key === ringKey) return; ringKey = key;
    const old = await OBR.scene.local.getItems(i => !!i.metadata?.[RING]);
    if (old.length) await OBR.scene.local.deleteItems(old.map(i => i.id));
    clearInterval(pulseT); pulseT = 0;
    if (!want.length) return;
    const items = [];
    for (const [t, k] of want) {
      const b = await OBR.scene.items.getItemBounds([t.id]), d = Math.max(b.width, b.height);
      const mk = (dia, w, color, op, tag) => buildShape().shapeType("CIRCLE").width(dia).height(dia).position(b.center)
        .fillOpacity(0).strokeColor(color).strokeWidth(w).strokeOpacity(op).attachedTo(t.id).disableAttachmentBehavior(["ROTATION"])
        .layer("ATTACHMENT").locked(true).disableHit(true).metadata({ [RING]: { k: tag } }).build();
      if (k === "cur") items.push(mk(d * 1.2, d * 0.1, "#bb99ff", 0.45, "glow"), mk(d * 1.1, d * 0.035, "#f3ecff", 0.95, "core"));
      else items.push(mk(d * 1.1, d * 0.03, "#bb99ff", 0.35, "deck"));
    }
    await OBR.scene.local.addItems(items);
    // slow pulse on the current turn's outer glow
    if (want.some(([, k]) => k === "cur")) { let ph = 0; pulseT = setInterval(() => { ph += 0.35;
      OBR.scene.local.updateItems(i => i.metadata?.[RING]?.k === "glow", (ds) => ds.forEach(dd => { dd.style.strokeOpacity = 0.3 + 0.3 * (1 + Math.sin(ph)) / 2; })).catch(() => {}); }, 160); }
  } catch {}
}
const ringsSoon = () => { clearTimeout(ringTimer); ringTimer = setTimeout(() => drawRings(), 400); };

// Announcements show for 5 seconds, then close themselves
// One message at a time: a new one first clears the old one and its timer. Before, the 5-second close timer
// of "Roll for initiative!" could fire after a quick NEXT and take the leader's "Your turn!" down with it.
let noteId = "", noteTimer = 0;
async function note(msg, kind, ms = 5000) {
  try {
    clearTimeout(noteTimer);
    if (noteId) { const old = noteId; noteId = ""; await OBR.notification.close(old).catch(() => {}); }
    const id = await OBR.notification.show(msg, kind); noteId = id;
    noteTimer = setTimeout(() => { if (noteId === id) { noteId = ""; OBR.notification.close(id).catch(() => {}); } }, ms);
  } catch {}
}
OBR.onReady(async () => {
  // Right-click a token → "Mark" panel: Dead, Unconscious, or your own condition, shown above its head
  const markMenu = async (n) => {
    const u = new URL("go.html", location.href); u.searchParams.set("p", "marks");
    const ref = new URLSearchParams(location.search).get("obrref"); if (ref) u.searchParams.set("obrref", ref);
    OBR.contextMenu.create({ id: "com.newscolos.markmenu",
      icons: [{ icon: new URL("mark.svg", location.href).pathname, label: "Mark", filter: { every: [{ key: "type", value: "IMAGE" }] } }],
      embed: { url: u.href, height: 8 + Math.ceil(n / 2) * 42 + 42 + 36 } }).catch(() => {});
  };
  let markCount = markList(await OBR.room.getMetadata()).length;
  markMenu(markCount);
  OBR.room.onMetadataChange((md) => { const n = markList(md).length; if (n !== markCount) { markCount = n; markMenu(n); } });
  const me = await OBR.player.getId();
  const seen = new Set(allRolls(await OBR.room.getMetadata()).map(r => r.id)); seenIds = seen; myId = me;
  { const md = await OBR.room.getMetadata(); lastCancel = md[SDCANCEL]?.id || ""; lastSdn = md[SDN]?.ts || 0; }
  // this screen's Success Delta results survive a reload; a waiting attack doesn't (its rolls were before the reload)
  try { const old = JSON.parse(localStorage.getItem(sdKey()) || "{}"); sd = { list: Array.isArray(old.list) ? old.list.slice(-SD_KEEP) : [], wait: null }; } catch {}
  sdSave();
  window.addEventListener("storage", (e) => { if (e.key === "ns.sdShow" && e.newValue) openCard().catch(() => {}); }); // Δ on the DICE tab
  const isGM = (await OBR.player.getRole()) === "GM"; amGM = isGM;
  // A player's PLACE POG that their own Owlbear couldn't add (the room doesn't let players add tokens, or it failed):
  // the GM's screen adds it for them, still owned by that player so they can move it. Only their own pog picture.

  OBR.broadcast.onMessage("com.newscolos.initroll", async ({ data }) => {
    if (!amGM) return; const k = String(data?.k || ""), e = data?.entry;
    if (!k.startsWith(INIT + "/p/") || !e || typeof e.total !== "number" || !e.sid) return;
    try { const md = await OBR.room.getMetadata(); if (md[INIT]?.sid !== e.sid) return; // an old fight
      const have = md[k]; if (have?.sid === e.sid && have.total === e.total && have.gm) return; // already confirmed
      // written with a GM stamp so the value changes: every screen (the GM's bar and tab too) gets a fresh update and redraws
      await OBR.room.setMetadata({ [k]: { ...e, gm: Date.now() } }); } catch {}
  });
  // A player renamed their character: rename their tokens on this map (if their own Owlbear couldn't)
  OBR.broadcast.onMessage("com.newscolos.pogname", async ({ data }) => {
    if (!amGM) return; const from = String(data?.from || "").trim(), to = String(data?.to || "").trim().slice(0, 40);
    if (!from || !to) return; const n = (x) => String(x || "").trim().toLowerCase();
    try { if (!(await OBR.scene.isReady())) return;
      const toks = await OBR.scene.items.getItems(i => (i.layer === "CHARACTER" || i.layer === "MOUNT") && n(i.name) === n(from));
      if (toks.length) await OBR.scene.items.updateItems(toks.map(t => t.id), (ds) => ds.forEach(d => { d.name = to; if (d.text) d.text.plainText = to; })); } catch {}
  });
  OBR.broadcast.onMessage("com.newscolos.pogreq", async ({ data }) => {
    if (!amGM) return; const it = data?.item;
    if (!it || it.type !== "IMAGE" || it.layer !== "CHARACTER" || !/^https:\/\/lh3\.googleusercontent\.com\/d\/[\w-]+$/.test(it.image?.url || "")) return;
    try { if ((await OBR.scene.items.getItems([it.id])).length) return; await OBR.scene.items.addItems([it]); } catch {}
  });
  // Initiative: tell players to roll, and show the bar across the top while combat is on
  const BAR = "com.newscolos.initbar", LEFT = 545; // starts just past the New Scolos panel at L size, so it never overlaps (S or L)
  let barOpenedAt = 0, barCount = "", lastSid = (await OBR.room.getMetadata())[INIT]?.sid || "";
  let lastCur = "", turnUp = false;
  // Big END TURN at the bottom middle of the map while it's this player's turn (players only)
  async function turnPop(on) {
    if (on === turnUp) return; turnUp = on;
    if (!on) return OBR.popover.close("com.newscolos.turnpop").catch(() => {});
    const url = new URL("go.html", location.href); url.searchParams.set("p", "turnpop");
    const ref = new URLSearchParams(location.search).get("obrref"); if (ref) url.searchParams.set("obrref", ref);
    let vw = 1200, vh = 800; try { vw = await OBR.viewport.getWidth(); vh = await OBR.viewport.getHeight(); } catch {}
    OBR.popover.open({ id: "com.newscolos.turnpop", url: url.href, width: 260, height: 64, hidePaper: true,
      anchorReference: "POSITION", anchorPosition: { left: Math.round(vw / 2), top: vh - 24 },
      anchorOrigin: { horizontal: "CENTER", vertical: "BOTTOM" }, transformOrigin: { horizontal: "CENTER", vertical: "BOTTOM" },
      disableClickAway: true }).catch(() => { turnUp = false; });
  }
  // END TURN only shows once the player has made a roll during their turn (Jake, Nov 25), not the moment it starts
  const turnKey = (st) => st?.open && st.cur && st.cur === me ? `${st.sid}|${st.round || 1}|${st.cur}|${st.sub || 0}` : "";
  const rolledNow = (k) => { try { return !!k && localStorage.getItem("ns.turnRolled") === k; } catch { return false; } };
  async function markRolled(r) { if (isGM || !r || /initiative/i.test(String(r.label || ""))) return;
    const k = turnKey((await OBR.room.getMetadata())[INIT]); if (!k || rolledNow(k)) return;
    // shows up once their dice have landed (~2 s), not the instant they tap roll (Jake, Nov 25: a little drama)
    setTimeout(async () => { if (turnKey((await OBR.room.getMetadata())[INIT]) !== k) return; // the turn moved on meanwhile
      try { localStorage.setItem("ns.turnRolled", k); } catch {} turnPop(true); }, REVEAL_MS); }
  async function initUpdate(md) {
    const st = md[INIT];
    if (!isGM) { const k = turnKey(st); turnPop(rolledNow(k)); }
    if (!st?.open || !st.cur) lastCur = ""; // new combat starts fresh, so its first turn always pings
    // "Your turn" ping for the player whose turn it is

      lastCur = st.cur;

      else { // soft heads-up for whoever is on deck
        const list = initEntries(md), i = list.findIndex(e => e.id === st.cur);
        if (list.length > 1 && i >= 0 && list[(i + 1) % list.length].id === me) note("On deck: your turn is next", "DEFAULT", 3000);
      }
    }
    if (st?.open && st.sid !== lastSid) {
      lastSid = st.sid;
      if (!isGM) initPop(st.sid).catch(() => note("⚔ Roll for initiative! Your next Adroitness roll (on your CHARACTER SHEET tab) counts.", "INFO"));
    }
    const n = st?.open ? initEntries(md).length : 0;
    let small = false; try { small = localStorage.getItem("ns.barMin") === "1"; } catch {}
    const key = n + (small ? "m" : "");
    if (key === barCount) return;
    barCount = key;
    if (!n) { OBR.popover.close(BAR).catch(() => {}); OBR.popover.close("com.newscolos.initlist").catch(() => {}); try { localStorage.setItem("ns.initList", ""); } catch {} return; }
    let vw = 1200; try { vw = await OBR.viewport.getWidth(); } catch {}
    const url = new URL("go.html", location.href); url.searchParams.set("p", "initbar");
    const ref = new URLSearchParams(location.search).get("obrref"); if (ref) url.searchParams.set("obrref", ref);
    barOpenedAt = Date.now();
    OBR.popover.open({ id: BAR, url: url.href, width: small ? 54 : Math.max(300, vw - LEFT - 110), height: 54, hidePaper: true,
      // full bar starts right of Owlbear's top-left toolbar; minimized it's a small ⚔ box at the top right
      anchorReference: "POSITION", anchorPosition: { left: small ? vw - 90 : LEFT, top: 12 },
      anchorOrigin: { horizontal: small ? "RIGHT" : "LEFT", vertical: "TOP" }, transformOrigin: { horizontal: small ? "RIGHT" : "LEFT", vertical: "TOP" },
      disableClickAway: true }).catch(() => { barCount = ""; }); // didn't open: the watchdog below tries again
  }
  initUpdate(await OBR.room.getMetadata());
  drawRings(await OBR.room.getMetadata());
  OBR.scene.items.onChange(ringsSoon); // a token added, renamed or resized
  OBR.scene.onReadyChange((r) => { ringKey = ""; if (r) drawRings(); });
  // Watchdog: while combat is on, make sure the bar is really on this screen (late joiners, a reload, a failed open).
  // The bar writes a heartbeat every 1.5 s; no heartbeat for 6 s means it isn't showing, so open it again.
  setInterval(async () => {
    try {
      const md = await OBR.room.getMetadata();
      if (!md[INIT]?.open || !initEntries(md).length) return;
      const alive = Number(localStorage.getItem("ns.barAlive") || 0);
      if (Date.now() - alive > 6000 && Date.now() - barOpenedAt > 10000) { barCount = ""; initUpdate(md); } // 10 s grace while it loads
    } catch {}
  }, 3000);
  // Joined while combat is already on and haven't rolled initiative yet: ask now
  { const md = await OBR.room.getMetadata(), st = md[INIT];
    if (!isGM && st?.open && st.sid && !st.cur && md[`${INIT}/p/${me}`]?.sid !== st.sid) initPop(st.sid).catch(() => {});
    if (!isGM && st?.open && st.sid && md[`${INIT}/p/${me}`]?.sid !== st.sid) note("⚔ Combat is on! Roll for initiative: your next Adroitness roll (on your CHARACTER SHEET tab) counts.", "INFO", 8000); }
  window.addEventListener("storage", async (e) => { if (e.key === "ns.barMin") initUpdate(await OBR.room.getMetadata()); });
  // other players' rolls

  OBR.room.onMetadataChange((md) => {

  });
});
