<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  html { margin:0; background:transparent; }
  body { margin:0; color:#f1f3f9; font-family:system-ui, sans-serif; overflow:hidden; height:100vh; box-sizing:border-box;
    background:rgba(24,27,42,.45); border:1px solid rgba(255,255,255,.16); border-radius:14px; text-shadow:0 1px 2px rgba(0,0,0,.7); }
  .t { display:flex; flex-wrap:wrap; align-items:center; align-content:center; gap:3px 5px; padding:4px 10px; min-height:100vh; box-sizing:border-box; }
  .wnd { flex:none; margin-left:6px; font-size:11px; font-weight:900; color:#ff8f8f; }
  .who { flex-basis:100%; display:flex; align-items:baseline; font-weight:800; font-size:12px; line-height:1.2; color:#c9cde0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .die { width:21px; height:21px; font-size:14px !important; border:2px solid #f1f3f9; border-radius:5px; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:15px; background:rgba(10,12,20,.6); }
  .p { color:#5fd38d; border-color:#5fd38d; } .m { color:#ff6b6b; border-color:#ff6b6b; }
  .mod { color:#9aa0b8; font-weight:700; font-size:12px; }
  .lbl { flex-basis:100%; font-size:12px; line-height:1.3; font-weight:800; color:#bb99ff; overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; }
  .tot { margin-left:auto; font-family:'Luckiest Guy', 'Bangers', Impact, sans-serif; font-size:23px; min-width:30px; text-align:right; padding-top:2px; }
</style></head>
<body><div class="t" id="t"></div>
<script type="module">
  import OBR from "https://esm.sh/@owlbear-rodeo/sdk@3.1.0";
  // Shows one roll passed in the address: ?who=Zak&dice=1,0,-1,1&mod=3&total=4 (&spin=1 for a slot-machine reveal)
  const q = new URLSearchParams(location.search);
  const fmt = (n) => (n > 0 ? "+" : "") + n;
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const dice = (q.get("dice") || "").split(",").map(Number);
  const mod = Number(q.get("mod") || 0);
  // "(wounded -1)" goes up on the name line so a long skill name can never push it out of sight
  let label = q.get("label") || "", wnd = q.get("wnd") ? "wounded " + q.get("wnd") : "";
  const wm = label.match(/\s*\((wounded [^)]*)\)\s*$/i); if (wm) { wnd = wnd || wm[1]; label = label.slice(0, wm.index); }
  const lsize = label.length > 44 ? 10 : label.length > 30 ? 11 : 12; // long skill names get a smaller font
  document.getElementById("t").innerHTML =
    `<span class="who"><span style="overflow:hidden;text-overflow:ellipsis">${esc(q.get("who") || "")}</span>${wnd ? `<span class="wnd">${esc(wnd)}</span>` : ""}</span>` +
    dice.map(d => `<span class="die ${d > 0 ? "p" : d < 0 ? "m" : ""}">${d > 0 ? "+" : d < 0 ? "−" : ""}</span>`).join("") +
    (mod ? `<span class="mod">${fmt(mod)}</span>` : "") +
    `<span class="tot" id="tot">${fmt(Number(q.get("total") || 0))}</span>` +
    (label ? `<span class="lbl" style="font-size:${lsize}px">${esc(label)}</span>` : "");
  const faces = [...document.querySelectorAll(".die")];
  let showFor = 5000;
  if (q.get("spin")) {
    showFor = 7000;
    const set = (el, d) => { el.className = "die " + (d > 0 ? "p" : d < 0 ? "m" : ""); el.textContent = d > 0 ? "+" : d < 0 ? "−" : ""; };
    const tot = document.getElementById("tot"); tot.style.visibility = "hidden";
    let locked = 0;
    const tick = setInterval(() => { for (let i = locked; i < faces.length; i++) set(faces[i], Math.floor(Math.random() * 3) - 1); }, 70);
    const lock = () => { set(faces[locked], dice[locked]); locked++; if (locked < faces.length) return setTimeout(lock, 300); clearInterval(tick); tot.style.visibility = "visible"; };
    setTimeout(lock, 700);
  }
  // fade out, then close this card on its own (works even if the panel that opened it is closed)
  const myId = q.get("id") || "com.newscolos.dice/toast";
  const ms = Number(q.get("ms")) || showFor;
  document.body.style.transition = "opacity .6s";
  setTimeout(() => { document.body.style.opacity = "0"; }, Math.max(0, ms - 700));
  if (OBR.isAvailable) OBR.onReady(() => setTimeout(() => OBR.popover.close(myId).catch(() => {}), ms));
</script></body></html>
