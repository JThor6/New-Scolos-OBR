<!doctype html>
<html lang="en">
<head>

<title>New Scolos Dice</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>

  #sh .rd.ra { height:30px; margin-top:4px; width:calc(100% - 4px); border-radius:6px; background:rgba(187,153,255,.18); } #sh .rd.ra svg { width:20px; height:20px; }
  /* attributes: value on the left, a big roll button beside it (the old look, bigger button) */
  #sh .g5 { grid-template-columns:repeat(4, 1fr) .75fr; }
  #sh .att:not(.dp) { display:grid; grid-template-columns:1fr auto; align-items:center; padding:4px 4px 5px 4px; column-gap:2px; }
  #sh .att:not(.dp) small { grid-column:1 / -1; }
  #sh .att:not(.dp) b { padding:0; text-align:center; }
  #sh .rd.ra { position:static; width:30px; height:30px; margin:2px 0 0; border-radius:7px; background:rgba(187,153,255,.2); }
  #sh .rd.ra svg { width:20px; height:20px; }
  /* bigger attribute dice: as big as the box allows */
  #sh .rd.ra { width:34px; height:34px; } #sh .rd.ra svg { width:22px; height:22px; }
  @media (min-width: 420px) { #sh .rd.ra { width:48px; height:40px; border-radius:8px; } #sh .rd.ra svg { width:26px; height:26px; } #sh .att:not(.dp) { padding-right:5px; } }
  /* right column lines up: Dmg Pen, the Dead box and Used Today are all as wide as one vitality box, centered on the same line */
  #sh .g5 { grid-template-columns:repeat(4, 1fr) calc((100% - 4px) / 7 + 4px); }
  #sh .g2b { grid-template-columns:1fr calc((100% - 4px) / 7 + 4px); }
  #sh .g2b > .fld.c { display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:3px 0 6px; }
  #sh .g2b > .fld.c .chk { margin:auto 0; } /* centered in the space under the label */
  #sh .att.dp { display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:4px 0 5px; border-width:3px; }
  #sh .att.dp { cursor:pointer; user-select:none; }
  #sh .att.dp b.egg { font-size:24px; line-height:1; animation:eggpop .35s ease-out; }
  @keyframes eggpop { 0% { transform:scale(.3) rotate(-25deg); opacity:0; } 70% { transform:scale(1.25) rotate(8deg); opacity:1; } 100% { transform:scale(1) rotate(0); } }
  #sh .att.dp b { margin:auto 0; } /* label at the same height as CHARM etc., number centered under it like theirs */
  /* every checkbox on the vitality track sits on the same line, however many lines its label has */
  #sh .vit .box { position:relative; padding-bottom:28px; }
  #sh .vit .box .chk { position:absolute; bottom:5px; left:50%; transform:translateX(-50%); margin:0; }
  /* Monsters tab: same look as the character sheet (big dice, roomy boxes) */
  #mo .matt { grid-template-columns:repeat(4, 1fr); gap:4px; margin-top:4px; }
  #mo .att { display:grid; grid-template-columns:1fr auto; align-items:center; padding:4px 4px 5px; column-gap:2px; border-width:2px; }
  #mo .att small { grid-column:1 / -1; } #mo .att b { padding:0; text-align:center; font-size:19px; }
  #mo .rd.ra { position:static; width:34px; height:34px; margin:2px 0 0; border-radius:7px; background:rgba(187,153,255,.2); } #mo .rd.ra svg { width:22px; height:22px; }
  #mo .mrow2 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:4px; margin-top:4px; } #mo .matk { grid-column:1 / -1; }
  #mo .matk { min-height:44px; } #mo .matk span { display:flex; align-items:center; } #mo .matk span small { font-size:11px; font-weight:800; color:var(--dim); letter-spacing:.5px; } #mo .matk b { font-size:18px; }
  #mo .mrow2 .fld > div { font-size:15px; font-weight:800; }
  #mo .pvit.mv { gap:6px; margin-top:8px; flex-wrap:wrap; } #mo .pvit i small { font-size:10px; }
  #mo .mw { width:26px; height:26px; border-radius:5px; }
  #mo .mtop { gap:8px; } #mo .mtop b { font-size:16px; } #mo .mdead { padding:5px 10px; }
  #mo .mcard { padding:8px 9px 10px; margin-top:10px; }
  #mo .mtext i { font-style:normal; font-weight:800; color:var(--dim); }
  @media (min-width: 420px) { #mo .rd.ra { width:48px; height:40px; border-radius:8px; } #mo .rd.ra svg { width:26px; height:26px; } }
  .err { color:var(--minus); margin-top:8px; font-weight:700; }
  .empty { color:var(--dim); margin-top:8px; }
  .ow { padding:2px 10px 8px; }
  .oh { font-size:11px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; color:var(--accent); margin:9px 0 3px; }
  .oh:first-child { margin-top:4px; }
  .ol { position:relative; padding:2px 0 2px 12px; font-size:13px; line-height:1.4; color:var(--ink); }
  .ol::before { content:""; position:absolute; left:2px; top:9px; width:4px; height:4px; border-radius:50%; background:var(--dim); }
</style>
</head>
<body>
<header><h1>NEW SCOLOS</h1><span class="hctl"><span id="syncdot" class="syncdot" hidden title="Syncing with Google Sheets">⟳</span><button id="solid" class="tab" title="See-through / solid">◐</button><button id="size" class="tab" title="Change panel size">S</button></span><nav><button class="tab on" data-t="sheet">SHEET</button><button class="tab" data-t="rules">REFERENCE</button><button class="tab" data-t="dice">DICE</button><button class="tab" data-t="gen">CHARACTER GENERATOR</button><button class="tab" data-t="mon" id="monTab" hidden>GM</button></nav></header>
<div id="initban" class="initban" hidden><span>⚔ Initiative! Your next Adroitness roll counts.</span><button id="initgo">ROLL</button><button id="initx" title="Hide">✕</button></div>
<section id="sheet"><div id="sh"><div class="empty">Loading…</div></div></section>
<section id="rules" hidden><div id="ru"></div></section>
<section id="gen" hidden><div id="cg"></div></section>
<section id="mon" hidden><div id="mo"></div></section>
<main id="dice" hidden>
  <label>Modifier</label>
  <div style="display:flex;gap:8px;align-items:stretch"><input id="modin" inputmode="numeric" placeholder="0" style="font-size:22px;font-weight:800;text-align:center;width:110px"><button id="modneg" class="negbtn" title="Flip to minus / plus">±</button></div>
  <button id="roll">ROLL</button>
  <div id="err" class="err" hidden></div>
  <div id="last"></div>
  <button id="histbtn" class="histbtn">SHOW ROLL HISTORY</button>
  <div id="history" hidden><div class="empty">No rolls yet.</div></div>
</main>
<script type="module">
import OBR from "https://esm.sh/@owlbear-rodeo/sdk@3.1.0";
import { NS, KEEP, rollKey, allRolls, fmt, INIT, initEntries } from "./shared.js";
import { TYPES, SECTIONS, getTab, sectionHtml } from "./rules.js";

const $ = (id) => document.getElementById(id);
let mod = 0, me = null, standalone = !OBR.isAvailable, localRolls = [];

// Type the modifier: "+3", "-1", "3" or blank (0). Enter rolls.
// Phone number pads have no minus key, so ± flips the sign of whatever is typed
function flipSign(el) {
  const v = el.value.trim().replace("−", "-");
  el.value = v.startsWith("-") ? v.slice(1) : "-" + v.replace(/^\+/, "");
}
$("modneg").onclick = () => flipSign($("modin"));
function readMod() {
  const t = $("modin").value.trim().replace(/^\+/, "").replace("−", "-");
  if (t === "") return 0;
  const n = Number(t);
  return Number.isInteger(n) && Math.abs(n) <= 30 ? n : null;
}
$("modin").onkeydown = (e) => { if (e.key === "Enter") $("roll").click(); };

function rollDie() { const a = new Uint32Array(1); crypto.getRandomValues(a); return (a[0] % 3) - 1; }

function card(r, big) {
  const dice = r.dice.map(d => `<div class="die ${d > 0 ? "p" : d < 0 ? "m" : ""}">${d > 0 ? "+" : d < 0 ? "−" : ""}</div>`).join("");
  const time = new Date(r.ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  return `<div class="card ${big ? "big" : ""}">
    <div class="who">${esc(r.who)}${r.label ? ` <small>${esc(r.label)}</small>` : ""}<small>${time}</small></div>
    <div class="dice">${dice}${r.mod ? `<span class="modtag">${fmt(r.mod)}</span>` : ""}<span class="total">${big(r.total)}</span></div>
  </div>`;
}

// Roll totals use Luckiest Guy (Bangers draws 1 and 7 almost the same)
const big = (n) => fmt(n);
// Slot-machine reel: faces flicker, then each die locks in left to right, then the total.
const face = (d) => d > 0 ? "+" : d < 0 ? "−" : "";
const cls = (d) => `die ${d > 0 ? "p" : d < 0 ? "m" : ""}`;
function spin(r) {
  return new Promise((done) => {
    $("last").innerHTML = `<div class="card big"><div class="who">Rolling…</div><div class="dice">${
      r.dice.map((_, i) => `<div class="die" id="d${i}"></div>`).join("")}${r.mod ? `<span class="modtag">${fmt(r.mod)}</span>` : ""}<span class="total" id="tot">?</span></div></div>`;
    let locked = 0;
    const tick = setInterval(() => {
      for (let i = locked; i < 4; i++) { const d = rollDie(), el = $("d" + i); el.className = cls(d); el.textContent = face(d); }
    }, 70);
    const lockNext = () => {
      const el = $("d" + locked); el.className = cls(r.dice[locked]); el.textContent = face(r.dice[locked]);
      locked++;
      if (locked < 4) return setTimeout(lockNext, 350);
      clearInterval(tick);
      setTimeout(() => { $("last").innerHTML = card(r, true); done(); }, 300);
    };
    setTimeout(lockNext, 900);
  });
}

// Compact history: one line per roll, newest first.
// DETAIL ON: full skill name, then the dice and total, then how the total was built:
// Dice +2 · Adroitness +1 · Skill Rank +1 · Wounded -1 = +3
let histDetail = (() => { try { return localStorage.getItem("ns.histDetail") !== "off"; } catch { return true; } })();
function line(r) {
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const time = new Date(r.ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const sg = (v) => { const n = parseInt(String(v).replace("−", "-"), 10); return isNaN(n) ? String(v) : fmt(n); };
  let label = String(r.label || ""), wnd = r.wnd ? `wounded ${r.wnd}` : "";
  // older rolls kept the wound in the label, and long ones got cut off ("(wounde")
  const wm = label.match(/\s*\((w(?:o(?:u(?:n(?:d(?:e(?:d)?)?)?)?)?)?)\b([^)]*)\)?\s*$/i);
  if (wm && /^w/i.test(wm[1]) && (wm[1].length >= 4 || !wm[2])) { if (!wnd) { const n = (wm[2] || "").match(/-\d+/); wnd = n ? `wounded ${n[0]}` : "wounded"; } label = label.slice(0, wm.index); }
  const w = wnd ? `<span class="wtag">${esc(wnd)}</span>` : "";
  const dice = `<span class="dice" style="margin:0">${r.dice.map(d => `<div class="${cls(d)}">${face(d)}</div>`).join("")}</span><span class="modtag">${r.mod ? fmt(r.mod) : ""}</span>`;
  const head = `<span class="n">${esc(r.who)} <span class="t">${time}</span>${w}</span>`;
  if (!histDetail) return `<div class="line">${head}${dice}${label ? `<span class="lbl lc">${esc(label)}</span>` : ""}<span class="tot">${big(r.total)}</span></div>`;
  const ds = r.dice.reduce((a, b) => a + b, 0), parts = [`Dice ${fmt(ds)}`];
  if (r.at) { parts.push(`${esc(r.at)} ${esc(sg(r.av))}`); if (r.sr !== undefined) parts.push(`Skill Rank ${esc(sg(r.sr))}`); if (r.wnd) parts.push(`<span class="wtag" style="margin:0">Wounded ${fmt(r.wnd)}</span>`); }
  else if (r.mod) parts.push(`Modifier ${fmt(r.mod)}`); // older rolls and the DICE tab: just the total modifier
  return `<div class="line det">${head}${label ? `<span class="lbl lf">${esc(label)}</span>` : ""}${dice}<span class="tot">${big(r.total)}</span>
    <span class="brk">${parts.join(` <span class="pl">·</span> `)} <span class="pl">=</span> <b>${fmt(r.total)}</b></span></div>`;
}
let lastRolls = [];
function render(rolls) {
  lastRolls = rolls;
  $("history").innerHTML = `<button id="histDet" class="histdet">${histDetail ? "DETAIL: ON (tap for short)" : "DETAIL: OFF (tap for full)"}</button>` +
    (rolls.length ? rolls.slice(0, 30).map(line).join("") : `<div class="empty">No rolls yet.</div>`);
  $("histDet").onclick = () => { histDetail = !histDetail; try { localStorage.setItem("ns.histDetail", histDetail ? "" : "off"); } catch {} render(lastRolls); };
}
$("histbtn").onclick = () => {
  const h = $("history"); h.hidden = !h.hidden;
  $("histbtn").textContent = h.hidden ? "SHOW ROLL HISTORY" : "HIDE ROLL HISTORY";
};

function showErr(msg) { $("err").textContent = msg; $("err").hidden = !msg; }

$("roll").onclick = async () => {
  showErr("");
  mod = readMod();
  if (mod === null) { showErr("Modifier must be a whole number, like +3 or -1."); return; }
  const dice = [rollDie(), rollDie(), rollDie(), rollDie()];
  const who = standalone ? "Test" : await OBR.player.getName();
  const r = { id: crypto.randomUUID().slice(0, 8), pid: me || "local", who, dice, mod, total: dice.reduce((a, b) => a + b, 0) + mod, ts: Date.now() };
  $("roll").disabled = true;
  await spin(r);
  const err = await saveRoll(r);
  if (err) showErr(err);
  $("roll").disabled = false;
};

// Puts a roll in the shared history. Returns an error message, or "" when it worked.
async function saveRoll(r) {
  if (standalone) { localRolls = [r, ...localRolls]; render(localRolls); return ""; }
  try {
    const key = rollKey(me);
    const md = await OBR.room.getMetadata();
    const mine = Array.isArray(md[key]) ? md[key] : [];
    // Room storage is small (~16 kB): drop roll lists from players who haven't rolled in 2 days (old devices, guests)
    const stale = {}, cutoff = Date.now() - 2 * 864e5;
    for (const [k, v] of Object.entries(md)) {
      if (k !== key && k.startsWith(NS + "/rolls/") && !(Array.isArray(v) && v.some(x => x.ts > cutoff))) stale[k] = undefined;
    }
    await OBR.room.setMetadata({ ...stale, [key]: [r, ...mine].slice(0, KEEP) });
    return "";
    return "";
  } catch (e) { return "Roll didn't reach the table: " + (e?.message || e); }
}

// Quick roll from the sheet: rolls with that number as the modifier and shows it spinning in the bottom-right.
const ROLL_ICON = `<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M8 12h8M12 8v8" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>`;
// One roll at a time: extra clicks while a roll is going (or within 1.5s) are ignored, so mashing can't flood Owlbear
let rollBusy = false;
function setRollBusy(on) { rollBusy = on; document.body.classList.toggle("rollbusy", on); }
// The character's Damage Penalty (C12: -1 once Critical Wound or Down & KO'ed is checked) applies to every roll made from their sheet
const sheetPen = () => num(sheetVals?.[11]?.[2]) || 0;
async function quickRoll(modText, label, whoName, br = "") {
  if (rollBusy) return;
  setRollBusy(true);
  const t0 = Date.now();
  try { await doQuickRoll(modText, label, whoName, whoName ? 0 : sheetPen(), br); }
  finally { setTimeout(() => setRollBusy(false), Math.max(0, 1500 - (Date.now() - t0))); }
}
async function doQuickRoll(modText, label, whoName, pen = 0, br = "") {
  const m = (parseInt(String(modText).replace("−", "-"), 10) || 0) + pen;
  // If the GM called for initiative, a player's next Adroitness roll is their initiative
  let initSid = "";
  if (!standalone && !whoName && label === "Adroitness") {
    const st = (await OBR.room.getMetadata())[INIT];
    if (st?.open && store.get("ns.initDone") !== st.sid) { initSid = st.sid; label = "Adroitness · Initiative"; }
  }
  const dice = [rollDie(), rollDie(), rollDie(), rollDie()];
  const who = whoName || (standalone ? "Test" : await OBR.player.getName());
  const r = { id: crypto.randomUUID().slice(0, 8), pid: me || "local", who, label: String(label || "").slice(0, 60), dice, mod: m, total: dice.reduce((a, b) => a + b, 0) + m, ts: Date.now() };
  if (pen) r.wnd = pen;
  if (br) { const [at, av, sr] = String(br).split("|"); r.at = String(at || "").trim().slice(0, 14); r.av = String(av || "").trim(); if (sr !== undefined) r.sr = String(sr).trim(); }
  // the always-running background page shows it in the bottom-right roll cards
  try { localStorage.setItem("ns.toastReq", JSON.stringify(r)); } catch {}
  const err = await saveRoll(r);
  if (err && $("sherr")) { $("sherr").hidden = false; $("sherr").textContent = err; }
  if (initSid) {
    const name = String(sheetVals?.[2]?.[2] || "").trim() || who;
    await OBR.room.setMetadata({ [`${INIT}/p/${me}`]: { id: me, sid: initSid, name, total: r.total, adr: m, pc: true, r: Math.random() } }).catch(() => {});
    store.set("ns.initDone", initSid);
    updateInitBanner();
  }
}

// ---------------- SHEET TAB ----------------
const BRIDGE = "https://script.google.com/macros/s/AKfycbx5cjtXVGyFeoQx0EzJ-47gk4uXT6mXdgs90zaBmUB-zctUFm6OxD8fyWZWWuUQT0ua/exec";
const store = { get: (k) => { try { return localStorage.getItem(k) || ""; } catch { return ""; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
let isGM = false, sheetVals = null, busy = false;
// Campaigns: the GM sets this room's campaign (a subfolder name in Drive) on the GM tab. "" = main campaign.
// Everything per-character or per-encounter is remembered per campaign, so one player can be in two games.
const CAMP = "com.newscolos.campaign";
let campaign = "";
const ck = (k) => campaign ? `${k}@${campaign}` : k;
const sheetId = () => store.get(ck("ns.sheetId"));
const setSheetId = (v) => store.set(ck("ns.sheetId"), v);
const esc2 = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const V = (a1) => { const m = a1.match(/^([A-L])(\d+)$/); const row = sheetVals?.[+m[2] - 1] || []; return String(row[m[1].charCodeAt(0) - 65] ?? "").trim(); };

document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === b));
  for (const t of ["dice", "sheet", "rules", "mon", "gen"]) $(t).hidden = b.dataset.t !== t;
  if (b.dataset.t === "gen") showGen();
  if (b.dataset.t === "mon") showMonsters();
  if (b.dataset.t === "sheet") showSheetTab();
  if (b.dataset.t === "rules") showRules();
});

function idFromLink(t) { const m = String(t).match(/\/d\/([a-zA-Z0-9_-]{20,})/); return m ? m[1] : (/^[a-zA-Z0-9_-]{20,}$/.test(t.trim()) ? t.trim() : ""); }

// Step 1: table code (everyone). Step 2 (players only): pick your character from the list. No links to paste.
function connectForm(msg) {
  if (store.get("ns.code") && !isGM && !sheetId()) return pickCharacter(msg);
  $("sh").innerHTML = `<div class="sec">JOIN THE TABLE</div>
    <label>Table code</label><input id="scode" type="password" placeholder="Your GM gives you this">
    <div class="help">This one code unlocks everything: your character sheet, the party overview and the REFERENCE tab.</div>
    <button id="sgo" class="histbtn">CONTINUE</button>
    <div class="err" ${msg ? "" : "hidden"}>${esc2(msg)}</div>`;
  const go = () => { const code = $("scode").value.trim(); if (!code) return connectForm("Type the table code."); store.set("ns.code", code); setSheetId(isGM ? sheetId() : ""); showSheetTab(); };
  $("sgo").onclick = go; $("scode").onkeydown = (e) => { if (e.key === "Enter") go(); };
}
async function pickCharacter(msg) {
  $("sh").innerHTML = `<div class="sec">WHICH CHARACTER IS YOURS?</div><div class="empty">Finding characters…</div>`;
  let list;
  try { list = await characterSheets(); }
  catch (e) { if (/code/i.test(e.message)) store.set("ns.code", ""); return connectForm(e.message); }
  $("sh").innerHTML = `<div class="sec">WHICH CHARACTER IS YOURS?</div>
    <div class="help">Tap your character.</div>
    ${list.map(c => `<button class="histbtn pickc" data-id="${c.id}">${esc2(c.name)}</button>`).join("") || `<div class="empty">No characters found. Ask your GM.</div>`}
    <div class="err" ${msg ? "" : "hidden"}>${esc2(msg || "")}</div>
    <button id="chcode" class="sbtn" style="margin-top:10px">Use a different table code</button>`;
  document.querySelectorAll(".pickc").forEach(b => b.onclick = () => { setSheetId(b.dataset.id); showSheetTab(); });
  $("chcode").onclick = () => { store.set("ns.code", ""); connectForm(); };
}

async function bridgeGet(params) {
  const u = new URL(BRIDGE); Object.entries({ code: store.get("ns.code"), ...(campaign ? { campaign } : {}), ...params }).forEach(([k, v]) => u.searchParams.set(k, v));
  const res = await fetch(u); return res.json();
}
async function bridgePost(body) {
  const res = await fetch(BRIDGE, { method: "POST", body: JSON.stringify({ code: store.get("ns.code"), id: sheetId(), ...body }) });
  return res.json();
}

// Saved copies so the last thing you saw shows instantly, while a fresh copy loads in the background
const cache = {
  get: (k) => { try { return JSON.parse(localStorage.getItem("ns.cache." + k) || "null"); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem("ns.cache." + k, JSON.stringify(v)); } catch {} },
};
let syncing = 0;
function sync(d) { syncing = Math.max(0, syncing + d); const el = $("syncdot"); if (el) el.hidden = !syncing; }

async function showSheetTab() {
  if (!store.get("ns.code") || (!isGM && !sheetId())) return connectForm();
  $("sh").innerHTML = `<div class="empty">Loading…</div>`;
  try {
    if (isGM) {
      let list;
      const saved = cache.get(ck("chars"));
      if (saved?.length) { list = { sheets: saved }; refreshCharList(); }
      else {
        $("sh").innerHTML = `<div class="empty">Finding characters…</div>`;
        try { list = { sheets: await characterSheets() }; }

    await loadSheet();
  } catch (e) { $("sh").innerHTML = `<div class="err">Couldn't reach the sheet bridge: ${esc2(e.message || e)}</div>`; }
}

async function loadSheet(quiet) {
  if (!quiet) mgrOn = false;
  partyOn = false;
  const id = sheetId(), saved = cache.get("sheet." + id);
  if (!quiet) {
    if (saved) { sheetVals = saved; drawSheet(); quiet = true; } // show the saved copy right away
    else $("shbody").innerHTML = `<div class="empty">Loading sheet…</div>`;
  }
  sync(1);
  const gen = writeGen;
  const r = await bridgeGet({ id }).catch(e => ({ ok: false, error: e.message }));
  sync(-1);
  if (id !== sheetId() || partyOn) return; // switched away while loading
  if (gen !== writeGen || busy) return; // a save happened while this was loading, so this copy is old
  if (!r.ok && quiet) return; // background refresh failed: keep what's on screen
  if (!r.ok) {
    if (/code/i.test(r.error || "")) store.set("ns.code", "");
    if (!isGM) setSheetId("");
    return connectForm(r.error);
  }
  cache.set("sheet." + id, r.values);
  if (JSON.stringify(r.values) === JSON.stringify(sheetVals) && $("shbody")?.querySelector(".fld")) return; // nothing changed
  sheetVals = r.values; drawSheet();
}

// Spend XP on skills and attribute points on attributes using the sheet's own cost chart (G4:H12),

const num = (s) => { const n = parseInt(String(s ?? "").replace(/[,\s+]/g, "").replace("−", "-"), 10); return isNaN(n) ? null : n; };
const sgn = (n) => (n > 0 ? "+" : "") + n;
function stepCost(rank) { // cost to go from rank to rank+1, read from the chart on the sheet ("-4 to -3" → 1)
  for (let row = 4; row <= 12; row++) { const from = num(String(V("G" + row)).split(/\s+to\s+/i)[0]); if (from === rank) return num(V("H" + row)); }
  return null;
}
const xpNow = () => num(V("F3")) || 0, xpSpent = () => num(V("F4")) || 0;
const levelOf = (spent) => Math.floor(spent / 10);
const attrLeft = () => levelOf(xpSpent()) - (num(V("F10")) || 0);
const skillLvl = (row) => { const n = num(V("E" + row)); return n == null ? -4 : n; };
function mgrSave(cells, done) {
  save({ cells }, () => { for (const [k, v] of Object.entries(cells)) setCell(k, String(v)); // show it right away
    setCell("F5", String(levelOf(xpSpent()))); setCell("F12", String(attrLeft())); done && done(); });
}

async function drawMgrCombat(err) {
  const box = $("mco"); if (!box) return;

  try { for (const v of await getTab("Combat Options")) { const n = String(v[2] || "").trim(); if (n && /^\d+$/.test(String(v[1] || "").trim())) all.push([n, String(v[3] || "").replace(/^\*/, "").trim()]); } } catch {}
  if (!$("mco")) return;
  const strip = (x) => x.replace(/\s*\([^)]*\)\s*$/, "").trim().toLowerCase();
  const open = all.filter(([n]) => !have.some(h => strip(h) === n.toLowerCase()));
  const room = Math.min(max, slots.length) - have.length;
  box.innerHTML = `<div class="mnote" style="color:var(--dim)">You can know <b>${max}</b> (half your level, rounded down). You have <b>${have.length}</b>.${max > slots.length ? ` The sheet only has room for ${slots.length}.` : ""}</div>
    ${have.map((h, i) => { const d = (all.find(([n]) => n.toLowerCase() === strip(h)) || [])[1] || ""; return `<div class="mli mco1"><span><b>${esc2(h)}</b>${d ? `<small>${esc2(d)}</small>` : ""}</span><button class="mx" data-cox="${i}" title="Remove">✕</button></div>`; }).join("") || `<div class="empty" style="padding:4px">None yet.</div>`}
    ${room > 0 ? `<div class="mrow"><select id="coPick"><option value="">Add a combat option…</option>${open.map(([n]) => `<option>${esc2(n)}</option>`).join("")}</select><button id="coGo" class="sbtn">ADD</button></div><div id="coDesc" class="mnote" style="color:var(--ink)"></div>`

  }
}

// Always-on power and the daily Extraordinary Power options, read from the character's type tab in the Master file

let infOpen = "";
const normName = (x) => String(x).toLowerCase().split(/\s*[(:\/]\s*/)[0].trim().replace(/s\b/g, "");
async function infoHtml(key) {
  const row = (a, b) => `<div>${a ? `<b>${esc2(a)}:</b> ` : ""}${esc2(b)}</div>`;
  if (key.startsWith("sk:")) {
    const r = +key.slice(3), name = V("B" + r), n = normName(name);
    let desc = "", alt = "";
    try { for (const v of await getTab("Skill List")) { const nm = String(v[2] || "").trim(); if (!/^\d+$/.test(String(v[1] || "").trim()) || !nm) continue;
      const m = normName(nm); if (m === n || m.startsWith(n) || n.startsWith(m)) { const d = String(v[3] || ""); desc = d.replace(/^[A-Za-z ]+:\s*/, "").replace(/^\*/, ""); alt = (d.match(/^[A-Za-z ]+(?=:)/) || [""])[0]; break; } } } catch {}
    return `<div class="gpn">${esc2(name)}</div>${row("Total", `${V("C" + r)} ${V("D" + r)} + level ${V("E" + r)} = ${V("F" + r)}`)}${desc ? row("", desc) : row("", "Not on the Skill List (ask your GM).")}${alt && alt !== V("C" + r).trim() ? row("Skill List attribute", alt) : ""}`;
  }
  if (key.startsWith("co:")) {
    const name = key.slice(3), n = name.replace(/\([^)]*\)/g, "").trim().toLowerCase();
    try { for (const v of await getTab("Combat Options")) { const nm = String(v[2] || "").trim(); if (nm && /^\d+$/.test(String(v[1] || "").trim()) && nm.toLowerCase() === n) return `<div class="gpn">${esc2(nm)}</div>${row("", String(v[3] || "").replace(/^\*/, ""))}`; } } catch {}
    return `<div class="gpn">${esc2(name)}</div>${row("", "Not on the Combat Options list (ask your GM).")}`;
  }
  if (key === "cop") {
    let h = ""; try { const v = await getTab("Combat Options"); const i = v.findIndex(x => /how combat options work/i.test(String(x[1] || ""))); if (i >= 0) for (let j = i + 1; j < v.length && String(v[j][1] || "").trim() && !/^combat options$/i.test(String(v[j][1]).trim()); j++) h += row("", String(v[j][1]).trim()); } catch {}
    return `<div class="gpn">Combat Option Points</div>${h || row("", "Each Combat Option costs 1 point.")}`;
  }
  if (key.startsWith("cb:")) {
    const k = key.slice(3).toLowerCase(); let h = "";
    try { const K = (await getTab("Main Sheet")).map(x => String(x?.[10] ?? "").trim());
      for (const l of K) if (l.toLowerCase().startsWith(k) || (k === "armor bonus" && /^any armor|^ex:/i.test(l))) h += row("", l); } catch {}
    return `<div class="gpn">${esc2(key.slice(3))}</div>${h || row("", "Damage and armor bonuses come from your gear and Raw Strength.")}`;
  }
  if (key.startsWith("at:")) { const a = key.slice(3); return `<div class="gpn">${esc2(a)} ${esc2(V({ Adroitness: "C7", "Raw Strength": "C8", Intellect: "C9", Charm: "C10" }[a]))}</div>${row("Good for", ATTR_DOES[a] || "")}`; }
  if (key === "dp") return `<div class="gpn">Damage Penalty ${esc2(V("C12"))}</div>${row("", "Comes from your Vitality Track: wounds marked (-1) add to it as they're checked.")}${row("", "While it's active, every roll you make from this sheet gets it added automatically, and the roll shows \"(wounded -1)\".")}`;
  return "";
}
function bindInfo() {

    const el = [...document.querySelectorAll("#shbody [data-inf]")].find(e => e.dataset.inf === infOpen);

let pwOpen = ""; // which power's rules are open under the Extraordinary Power box (kept across refreshes)

      box.querySelector(".pwx").onclick = () => { pwOpen = ""; show(); };

// Max invocations / spell points: number in H13 (label in G13); older layout had the number in G13

function ptInEP() { return !!V("E13") && /^(priest|mage)$/i.test(V("C4")); }
function ptCtl() { return `<div class="ctl"><button id="ptm">−</button><b>${esc2(V("F13") || "0")}</b><button id="ptp">+</button></div>`; }

// Healing: every mark on the vitality track shifts one box left; the leftmost (Light Wound) drops off.
// The last 5 heals per character can be undone (cleared if someone taps a wound box by hand).
const healUndo = new Map();
let healWait = 0; // cooldown so double taps and lag can't stack heals
async function heal() {
  if (busy || Date.now() < healWait) return;
  const cols = "BCDEFGH".split(""), was = cols.map(c => !!V(c + "16"));
  const id = sheetId(), stack = healUndo.get(id) || [];
  if (await setTrack(was.slice(1).concat(false))) { stack.push(was); healUndo.set(id, stack.slice(-5)); drawSheet(); }
}
async function undoHeal() {
  if (busy || Date.now() < healWait) return;
  const id = sheetId(), stack = healUndo.get(id) || [];
  if (!stack.length) return;
  const prev = stack[stack.length - 1];
  if (await setTrack(prev)) { stack.pop(); drawSheet(); }
}
async function setTrack(now) { // write a whole vitality track (7 true/false), only the boxes that change
  if (busy) return false;
  const cols = "BCDEFGH".split(""), was = cols.map(c => !!V(c + "16"));
  const changes = cols.map((c, i) => [i, now[i]]).filter(([i, on]) => on !== was[i]);
  if (!changes.length) return false;
  busy = true; writeGen++; healWait = Date.now() + 1200;
  const before = JSON.stringify(sheetVals);
  // nothing moves on screen until the save is finished; the buttons say so meanwhile
  document.querySelectorAll(".healb, .vit .box").forEach(b => b.disabled = true);
  if ($("heal")) $("heal").textContent = "SAVING…";
  // newer bridge: the whole track in one write. Older bridge: one box at a time, in order.
  let res = [await bridgePost({ track: now }).catch(e => ({ ok: false, error: e.message }))];
  if (!res[0].ok && /nothing to change/i.test(res[0].error || "")) {
    res = [];
    for (const [i, on] of changes) res.push(await bridgePost({ wound: i, on }).catch(e => ({ ok: false, error: e.message })));
  }
  busy = false; writeGen++;
  const bad = res.find(r => !r.ok);
  if (!bad) { cols.forEach((c, i) => setCell(c + "16", now[i] ? "X" : "")); const dp = res[res.length - 1].dp; if (dp != null) setCell("C12", dp); cache.set("sheet." + sheetId(), sheetVals); setTimeout(() => loadSheet(true), 1500); return true; }
  sheetVals = JSON.parse(before); drawSheet(); loadSheet(true); // re-read so the sheet shows whatever did save
  $("sherr").hidden = false; $("sherr").textContent = "Vitality track didn't fully save: " + (bad.error || "unknown error");
  return false;
}
function setCell(a1, v) { const m = a1.match(/^([A-L])(\d+)$/); sheetVals[+m[2] - 1][m[1].charCodeAt(0) - 65] = v; }

let writeGen = 0; // bumped on every save so older sheet reads are ignored
async function save(body, apply) {
  if (busy) return; busy = true; writeGen++;
  const before = JSON.stringify(sheetVals);
  apply(); drawSheet(); // show it right away
  const r = await bridgePost(body).catch(e => ({ ok: false, error: e.message }));
  busy = false; writeGen++;
  if (r.ok) { if (r.dp != null) { setCell("C12", r.dp); drawSheet(); } loadSheet(true); return; } // re-read so the sheet's own formulas (like Damage Penalty) show up
  if (!r.ok) {
    sheetVals = JSON.parse(before);
    // wrong code: ask for it again right away instead of failing every save
    if (/table code/i.test(r.error || "")) { store.set("ns.code", ""); return connectForm("The table code changed. Type the new one to keep saving."); }
    drawSheet(); $("sherr").hidden = false;
    $("sherr").textContent = "Didn't save to the sheet: " + (r.error || "unknown error") +
      (/permission|access|denied|authoriz/i.test(r.error || "") ? " (The sheet must be shared with Jake as Editor.)" : "");
  }
}

// Only real characters: a Main Sheet titled "New Scolos Character Sheet" with a name filled in, and not the Master file

    const r = await bridgeGet({ id: f.id }).catch(() => null);

async function monSet(row, col, on) {

  else cache.set("mon." + monId(), monVals);
  if (col === 20) syncDeadGroups();

// When every monster in a group is dead, take that group off the initiative bar (and back on if one is revived)
async function syncDeadGroups() {
  const v = monVals || [], c = (row, i) => String(v[row]?.[i] ?? "").trim();
  const hdr = Math.max(0, v.findIndex(r => String(r?.[0] || "").trim().toLowerCase() === "name"));
  const alive = new Map();
  for (let row = hdr + 1; row < v.length; row++) {
    const name = c(row, 0); if (!name) continue;
    const g = c(row, 1) || name, dead = /^(true|x|yes|dead)$/i.test(c(row, 19));
    alive.set(g, (alive.get(g) || 0) + (dead ? 0 : 1));
  }
  const md = await OBR.room.getMetadata(), st = md[INIT]; if (!st?.open) return;
  const removed = new Set(st.removed || []);
  for (const [g, n] of alive) { const id = "m:" + g; if (n === 0) removed.add(id); else removed.delete(id); }
  // keep the "×3" count on the bar in step with how many are still alive
  const mlist = (md[INIT + "/m"] || []).map(e => {
    if (e.sid !== st.sid || !e.id.startsWith("m:")) return e;
    const g = e.id.slice(2), n = alive.get(g);
    return n ? { ...e, name: n > 1 ? `${g} ×${n}` : g } : e;
  });
  await OBR.room.setMetadata({ [INIT]: { ...st, removed: [...removed] }, [INIT + "/m"]: mlist });
}

// Each monster group rolls once (4 dice + the first living member's Adroitness) and stays together in the order
async function rollMonsterInit() {
  const md = await OBR.room.getMetadata(), st = md[INIT];
  if (!st?.open) await callInitiative();
  const sid = (await OBR.room.getMetadata())[INIT].sid;
  const have = new Set(((await OBR.room.getMetadata())[INIT + "/m"] || []).filter(e => e.sid === sid).map(e => e.id));
  const v = monVals || [], c = (row, i) => String(v[row]?.[i] ?? "").trim();
  const hdr = Math.max(0, v.findIndex(r => String(r?.[0] || "").trim().toLowerCase() === "name"));
  const groups = new Map();
  for (let row = hdr + 1; row < v.length; row++) {
    const name = c(row, 0); if (!name || /^(true|x|yes|dead)$/i.test(c(row, 19))) continue;
    const g = c(row, 1) || name;
    if (!groups.has(g)) groups.set(g, { adr: parseInt(c(row, 4)) || 0, n: 0 });
    groups.get(g).n++;
  }
  const add = [];
  for (const [g, info] of groups) {
    const id = "m:" + g; if (have.has(id)) continue;
    const dice = [rollDie(), rollDie(), rollDie(), rollDie()], total = dice.reduce((a, b) => a + b, 0) + info.adr;
    const label = info.n > 1 ? `${g} ×${info.n}` : g;
    add.push({ id, sid, name: label, total, adr: info.adr, pc: false, r: Math.random() });
    const roll = { id: crypto.randomUUID().slice(0, 8), pid: me || "local", who: label, label: "Adroitness · Initiative", dice, mod: info.adr, total, ts: Date.now() };
    try { localStorage.setItem("ns.toastReq", JSON.stringify(roll)); } catch {}
    await saveRoll(roll);
  }
  const cur = (await OBR.room.getMetadata())[INIT + "/m"] || [];
  await OBR.room.setMetadata({ [INIT + "/m"]: [...cur.filter(e => e.sid === sid), ...add] });
}

      const marks = "BCDEFGH".split("").map(c => !!cell(v, c + "16"));
      const worst = marks.lastIndexOf(true);
      const status = worst < 0 ? "Unhurt" : cell(v, "BCDEFGH"[worst] + "15").replace(/^\S+\s+/, "");
      const used = cell(v, "F6").toUpperCase() === "TRUE";
      return `<div class="pcard">
        <div class="ptop"><b>${esc2(cell(v, "C3"))}</b><small>${esc2(cell(v, "C4"))}</small><span class="ppw ${used ? "u" : ""}">${used ? "POWER USED" : "POWER READY"}</span></div>
        <div class="pvit">${marks.map((m, i) => `<i><small>${["LW", "LW", "LW", "MW", "CW", "KO", "D"][i]}</small><span class="${m ? "x" : ""}"></span></i>`).join("")}<em class="${worst >= 4 ? "bad" : ""}">${esc2(status)}</em></div>
      </div>`;
    }).join("") : `<div class="empty">No characters found.</div>`;
  }
}

// See-through by default; ◐ switches the whole panel to solid gray (remembered per player)
function applySolid() { const on = store.get("ns.solid") === "1"; document.documentElement.classList.toggle("solid", on); $("solid").classList.toggle("on", on); }
$("solid").onclick = () => { store.set("ns.solid", store.get("ns.solid") === "1" ? "" : "1"); applySolid(); };
applySolid();

// ---------------- PANEL SIZE (S / M / L, remembered per player) ----------------
const SIZES = { S: [264, 680], L: [520, 1400] };
function applySize() {
  const k = SIZES[store.get("ns.size")] ? store.get("ns.size") : "S";
  $("size").textContent = k;
  if (standalone) return;
  OBR.action.setWidth(SIZES[k][0]).catch(() => {});
  if (k === "L") OBR.viewport.getHeight().then(vh => OBR.action.setHeight(Math.max(500, vh - 70))).catch(() => OBR.action.setHeight(SIZES.L[1]).catch(() => {})); // fill the screen top to bottom
  else OBR.action.setHeight(SIZES[k][1]).catch(() => {});
}
$("size").onclick = () => { store.set("ns.size", store.get("ns.size") === "L" ? "S" : "L"); applySize(); };

// ---------------- RULES TAB ----------------
const POP_ICON = `<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
// Opens one rules section in its own see-through panel in the upper right; it stays up while you use the sheet.
async function popOut(k) {
  if (standalone) return window.open("popout.html?k=" + encodeURIComponent(k));
  const u = new URL("go.html", location.href); u.searchParams.set("p", "popout");
  const ref = new URLSearchParams(location.search).get("obrref"); if (ref) u.searchParams.set("obrref", ref);
  u.searchParams.set("k", k);
  const vw = await OBR.viewport.getWidth(), vh = await OBR.viewport.getHeight();
  OBR.popover.open({ id: "com.newscolos.rules", url: u.href, width: 340, height: Math.max(360, Math.round(vh * 0.75)),
    anchorReference: "POSITION", anchorPosition: { left: vw - 70, top: 70 },
    anchorOrigin: { horizontal: "RIGHT", vertical: "TOP" }, transformOrigin: { horizontal: "RIGHT", vertical: "TOP" },
    disableClickAway: true, hidePaper: true }).catch(() => {});
}
function showRules() {
  if (!store.get("ns.code")) { $("ru").innerHTML = `<div class="empty">Open the SHEET tab and enter the table code first.</div>`; return; }
  if ($("ru").dataset.ready) return;
  $("ru").dataset.ready = "1";
  $("ru").innerHTML = SECTIONS.map(([t, k]) => `<details class="rs" data-k="${k}"><summary>${esc2(t.toUpperCase())}<button class="pop" data-k="${k}" title="Pop out">${POP_ICON}</button></summary><div class="rb"></div></details>`).join("");
  document.querySelectorAll(".pop").forEach(b => b.onclick = (e) => { e.preventDefault(); e.stopPropagation(); popOut(b.dataset.k); });
  document.querySelectorAll("details.rs").forEach(d => d.addEventListener("toggle", async () => {
    const body = d.querySelector(".rb");
    if (!d.open || body.dataset.done) return;
    body.innerHTML = `<div class="rr">Loading…</div>`;
    try { body.innerHTML = await sectionHtml(d.dataset.k) || "<div class='rr'>Nothing here yet.</div>"; body.dataset.done = "1"; }
    catch (e) { body.innerHTML = `<div class="rr err">Couldn't load: ${esc2(e.message || e)}</div>`; }
  }));
}

// Player banner while their initiative roll is still owed (shows even if they missed the pop-up or joined late)
let lastMd = null;
async function updateInitBanner(md) {
  if (standalone || isGM) { $("initban").hidden = true; return; }
  lastMd = md || lastMd || await OBR.room.getMetadata();
  const st = lastMd[INIT];
  const owed = st?.open && !st.cur                                   // turns haven't started yet
    && Date.now() - (st.at || 0) < 3 * 60e3                          // called in the last 3 minutes
    && store.get("ns.initDone") !== st.sid && lastMd[`${INIT}/p/${me}`]?.sid !== st.sid // not rolled yet
    && store.get("ns.initHide") !== st.sid;                         // not closed with ✕
  $("initban").hidden = !owed;
  clearTimeout(updateInitBanner.t); if (owed) updateInitBanner.t = setTimeout(() => updateInitBanner(), 30e3);
}
$("initx").onclick = () => { const s = lastMd?.[INIT]; if (s) store.set("ns.initHide", s.sid); $("initban").hidden = true; };
$("initgo").onclick = () => {
  const adr = sheetVals?.[6]?.[2];
  if (adr != null && String(adr).trim() !== "") return quickRoll(adr, "Adroitness");
  document.querySelector('.tab[data-t="sheet"]').click(); // sheet not loaded yet: open it so they can roll from there
};
if (standalone) {
  document.querySelector('.tab[data-t="sheet"]').click();
  document.querySelector("nav").insertAdjacentHTML("beforeend", `<span style="color:var(--dim);font-size:10px">TEST</span>`);
} else {
  OBR.onReady(async () => {
    me = await OBR.player.getId();
    isGM = (await OBR.player.getRole()) === "GM";
    campaign = String((await OBR.room.getMetadata())[CAMP] || "");
    encList = cache.get(ck("encList")) || [];
    OBR.room.onMetadataChange((md) => { // GM switched this room to another campaign: reload whatever tab is open
      const c = String(md[CAMP] || ""); if (c === campaign) return;
      campaign = c; encList = cache.get(ck("encList")) || []; monVals = null; sheetVals = null;
      document.querySelector(".tab.on")?.click();
    });
    $("monTab").hidden = !isGM;
    document.querySelector('.tab[data-t="sheet"]').click(); // Sheet is the first tab: open it once the GM/player role is known
    if (isGM) { initMd = await OBR.room.getMetadata(); OBR.room.onMetadataChange((m) => { initMd = m; drawInitList(); markTurn(); }); }
    applySize();
    render(allRolls(await OBR.room.getMetadata()));
    OBR.room.onMetadataChange((md) => { render(allRolls(md)); updateInitBanner(md); });
    updateInitBanner();
  });
}
</script>
