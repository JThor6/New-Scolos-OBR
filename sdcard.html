<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
  /* The Success Delta spot, just left of the roll cards. One card that holds:
     - the results (‹ › to page back through them), and
     - the attack that's waiting for its defenders' Adroitness rolls (one or several).
     It reads everything from this browser's storage (background.html writes it), so it updates in place. */
  html, body { margin:0; background:transparent; overflow:hidden; }
  body { color:#f1f3f9; font-family:system-ui, sans-serif; }
  #t { box-sizing:border-box; padding:8px 11px 9px; border-radius:14px;
    background:linear-gradient(180deg, rgba(52,57,72,.93), rgba(34,37,48,.93)); border:1px solid rgba(200,206,222,.38); box-shadow:0 4px 16px rgba(0,0,0,.5); }
  body.hold #t { border-color:rgba(255,255,255,.55); }
  .top { display:flex; align-items:center; gap:4px; }
  .k { font-size:9.5px; font-weight:900; letter-spacing:1.2px; color:#9aa2b8; text-transform:uppercase; white-space:nowrap; }
  .sp { flex:1; }
  .b { height:22px; min-width:22px; padding:0 4px; border-radius:6px; border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.06);
    color:#c9cede; font-size:12px; font-weight:900; line-height:1; cursor:pointer; font-family:inherit; }
  .b:hover:not(:disabled) { background:rgba(255,255,255,.18); color:#fff; } .b:disabled { opacity:.3; cursor:default; }
  .b.on { background:rgba(255,255,255,.2); border-color:rgba(255,255,255,.45); color:#fff; }
  /* pin: STAY (solid, bright) = stays until closed; 20s (dim outline) = fades on its own */
  .b.pin { display:flex; align-items:center; gap:3px; padding:0 5px; font-size:9.5px; letter-spacing:.5px; }
  .b.pin:not(.on) { color:#8a91a6; border-style:dashed; }
  .b.pin.on { background:#dfe4f2; border-color:#dfe4f2; color:#1e2130; }
  .b.pin.on:hover { background:#fff; color:#1e2130; }
  .cnt { font-size:10px; font-weight:800; color:#aab1c5; min-width:30px; text-align:center; font-variant-numeric:tabular-nums; }
  .vs { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:6px; margin-top:4px; }
  .p { min-width:0; } .p.r { text-align:right; }
  .p b { display:block; font-size:12.5px; font-weight:800; color:#eef0f7; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .p span { font-size:10px; font-weight:700; color:#9aa2b8; letter-spacing:.4px; } .p span i { font-style:normal; color:#dfe3ef; font-weight:900; }
  .badge { display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:42px; height:38px; padding:0 6px; border-radius:9px; background:#1e2130; border:1px solid rgba(255,255,255,.16); }
  .badge b { font-size:21px; font-weight:700; line-height:1; color:#fff; font-variant-numeric:tabular-nums; }
  .badge small { font-size:8px; font-weight:900; letter-spacing:1px; color:#9aa2b8; }
  .eqn { display:flex; align-items:stretch; justify-content:center; gap:3px; margin-top:7px; }
  .chip { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:3px 2px 2px; border-radius:7px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08); }
  .chip b { font-size:16px; font-weight:900; color:#f1f3f9; line-height:1.1; font-variant-numeric:tabular-nums; }
  .chip small { font-size:8.5px; font-weight:800; letter-spacing:.3px; color:#9aa2b8; text-transform:uppercase; text-align:center; line-height:1.05; max-width:100%; }
  .chip.wide { flex:1.7; } .chip.res { flex:1.2; background:rgba(255,255,255,.14); border-color:var(--wc, rgba(255,255,255,.3)); } .chip.res b { color:var(--wc, #fff); } .chip.d0 { flex:.85; }
  .op { align-self:center; font-size:14px; font-weight:900; color:#7d859c; }
  .head { display:flex; align-items:baseline; justify-content:space-between; gap:6px; margin-top:6px; }
  .h1 { white-space:nowrap; font-family:'Bangers', Impact, sans-serif; font-size:20px; letter-spacing:1px; line-height:1; color:var(--wc, #eef0f7); }
  .h1.glow { text-shadow:0 0 10px var(--wc); }
  .h2 { font-size:10px; font-weight:700; color:#aab1c5; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track { display:grid; grid-template-columns:repeat(5, 1fr); gap:3px; margin-top:5px; }
  .seg { height:17px; border-radius:4px; background:rgba(255,255,255,.07); display:flex; align-items:center; justify-content:center; font-size:8.5px; font-weight:900; color:#727a90; letter-spacing:.3px; }
  .seg.on { color:#16131a; box-shadow:0 0 9px var(--sc); transform:scaleY(1.12); }
  /* the waiting attack */
  .wait { margin-top:6px; }
  .wait.strip { margin-top:8px; padding-top:7px; border-top:1px dashed rgba(255,255,255,.18); }
  .wa { display:flex; align-items:baseline; justify-content:space-between; gap:6px; }
  .wa b { font-size:13px; font-weight:800; color:#eef0f7; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .wa b small { margin-left:5px; font-size:10px; font-weight:600; color:#9aa0b8; }
  .wa span { flex:none; font-size:10px; font-weight:700; color:#9aa2b8; letter-spacing:.4px; } .wa span i { font-style:normal; color:#dfe3ef; font-weight:900; font-size:13px; }
  .ap { margin-top:6px; font-size:10.5px; font-weight:800; color:#cfd5e4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tg { margin-top:2px; font-size:10.5px; font-weight:700; color:#9aa2b8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .tg b { color:#dfe3ef; font-weight:800; }
  .tg.dim { font-style:italic; color:#7d859c; }
  .wl { font-size:10.5px; font-weight:700; color:#aab1c5; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ask { display:flex; align-items:center; gap:5px; margin-top:6px; padding:4px 5px 4px 7px; border-radius:7px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12);
    font-size:11.5px; font-weight:800; color:#eef0f7; animation:pulse 1.8s ease-in-out infinite; }
  .ask .t1 { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ask .n { font-size:11px; font-weight:900; color:#fff; min-width:34px; text-align:center; font-variant-numeric:tabular-nums; }
  .done { margin-top:4px; font-size:10px; font-weight:700; color:#9aa2b8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  @keyframes pulse { 50% { border-color:rgba(255,255,255,.4); background:rgba(255,255,255,.12); } }
</style></head>
<body><div id="t"></div>
<script type="module">
  import OBR from "https://esm.sh/@owlbear-rodeo/sdk@3.1.0";
  import { sdResult, WOUND_STEPS, BONUS_NAME } from "./shared.js";
  const q = new URLSearchParams(location.search), room = q.get("room") || "";
  const ID = "com.newscolos.dice/delta", SDN = "com.newscolos.dice/sdn", SDCANCEL = "com.newscolos.dice/sdcancel";
  const KEY = "ns.sd:" + room, PIN = "ns.sdPin", WAIT = 3 * 60e3, AUTO = 20000;
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const sg = (n) => n > 0 ? "+" + n : String(n);
  const get = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
  const set = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
  const state = () => { try { return JSON.parse(get(KEY) || "{}"); } catch { return {}; } };
  const pinned = () => get(PIN) !== "0"; // default: stays up until you close it
  const ready = new Promise(res => OBR.isAvailable ? OBR.onReady(res) : null);
  // a plain drawn pin in the card's own grey/white, no emoji colour
  const PIN_SVG = `<svg viewBox="0 0 24 24" width="11" height="11" aria-hidden="true"><path d="M9 3h6l-1 6 4 4v2h-5v6l-1 1-1-1v-6H6v-2l4-4z" fill="currentColor"/></svg>`;
  let idx = -1, lastSig = "", lastH = 0, timer = 0, over = false;

  const close = () => { clearTimeout(timer); set("ns.sdAlive:" + room, "0"); ready.then(() => OBR.popover.close(ID)).catch(() => {}); };
  const liveWait = (s) => { const w = s.wait; return w && Date.now() - w.at0 < WAIT && (w.defs || []).length < (w.n || 1) ? w : null; };

  function resultHtml(e) {
    const R = sdResult(e), w = R.w ? WOUND_STEPS[R.w - 1] : null;
    document.body.style.setProperty("--wc", !R.hit ? "#a9b0c3" : w ? w.c : "#c9cede");
    const chip = (v, k, cls = "") => `<div class="chip ${cls}"><b>${esc(v)}</b><small>${esc(k)}</small></div>`, op = (o) => `<span class="op">${o}</span>`;
    const bk = (BONUS_NAME[e.dbk] || "") + " Damage Bonus";
    let h = `<div class="vs"><div class="p"><b>${esc(e.att)}</b><span>ATTACK <i>${sg(e.at)}</i></span></div>` +
      `<div class="badge"><b>${esc(e.delta)}</b><small>DELTA</small></div>` +
      `<div class="p r"><b>${esc(e.def)}</b><span>DEFENSE <i>${sg(e.dt)}</i></span></div></div>`;
    if (!R.hit) return h + `<div class="eqn">${chip(sg(e.at), "Attack")}${op("−")}${chip(sg(e.dt), "Defense")}${op("=")}${chip(e.delta, "Delta", "res")}</div>` +
      `<div class="head"><span class="h1">MISS</span><span class="h2">${esc(R.sub)}</span></div>`;
    return h + `<div class="eqn">${chip(e.delta, "Delta", "d0")}${op("+")}${chip(e.db != null ? e.db : "?", bk, "wide")}${op("−")}${chip(e.ab != null ? e.ab : "?", "Armor Bonus")}${op("=")}${chip(R.dmg != null ? R.dmg : "?", "Damage", "res")}</div>` +
      `<div class="head"><span class="h1 ${R.w >= 4 ? "glow" : ""}">${esc(R.headline.toUpperCase())}</span><span class="h2">${esc(R.tie ? "Tie: attacker wins" : R.dmg == null ? "Add the Damage Bonus" : w ? w.r + " damage" : "No wound")}</span></div>` +
      `<div class="track">${WOUND_STEPS.map(s => `<div class="seg ${s.i === R.w ? "on" : ""}" style="--sc:${s.c};${s.i === R.w ? `background:${s.c}` : ""}">${esc(s.s.toUpperCase())}</div>`).join("")}</div>`;
  }
  function waitHtml(w, strip) {
    const n = w.n || 1, d = (w.defs || []).length, verb = w.sp ? "CASTS" : "ATTACKS";
    const ask = w.multi
      ? `<span class="t1">🛡 Roll Adroitness</span><button class="b" id="nm" title="One fewer defender" ${n <= 1 ? "disabled" : ""}>−</button><span class="n" title="Defended so far / how many defend">${d}/${n}</span><button class="b" id="np" title="One more defender (area attack)">+</button>`
      : `<span class="t1">🛡 ${w.sp ? "If it's aimed at someone, they" : "Defender"}: roll Adroitness</span>`;
    return `<div class="wait ${strip ? "strip" : ""}">` +
      `<div class="wa"><b>${esc(w.att)}${w.who ? `<small>${esc(w.who)}</small>` : ""}</b><span>${verb} <i>${sg(Number(w.at) || 0)}</i></span></div>` +
      (w.l ? `<div class="wl">${esc(w.l)}</div>` : "") +
      (w.tg ? `<div class="tg">${w.tg.length > 1 ? "Targets" : "Target"}: <b>${esc(w.tg.join(", "))}</b></div>`
        : w.notg ? `<div class="tg dim">No target selected · next Adroitness roll defends</div>` : "") +
      `<div class="ask">${ask}<button class="b" id="drop" title="Not an attack on anyone: drop it for everyone">✕</button></div>` +
      (d ? `<div class="done">Defended: ${esc(w.defs.join(", "))}</div>` : "") + `</div>`;
  }

  function render() {
    const s = state(), list = Array.isArray(s.list) ? s.list : [], w = liveWait(s);
    if (idx >= list.length) idx = -1;
    const mine = w ? list.filter(e => e.aid === w.id) : [];
    const waitOnly = w && idx < 0 && !mine.length;
    if (!w && !list.length) { close(); return; }
    const i = idx < 0 ? list.length - 1 : idx, e = waitOnly ? null : list[i];
    const nav = list.length ? `<button class="b" id="prev" title="Older result" ${(waitOnly ? list.length : i) <= 0 ? "disabled" : ""}>‹</button>` +
      `<span class="cnt">${waitOnly ? "NEW" : `${i + 1}/${list.length}`}</span>` +
      `<button class="b" id="next" title="Newer result" ${waitOnly || idx < 0 ? "disabled" : ""}>›</button>` : "";
    const pin = pinned();
    document.getElementById("t").innerHTML =
      `<div class="top"><span class="k">${waitOnly ? "Δ · Waiting" : "Success Delta"}</span><span class="sp"></span>${nav}` +
      `<button class="b pin ${pin ? "on" : ""}" id="pin" title="${pin ? "Stays up until you close it. Tap to make it fade 20 s after the last result" : "Fades 20 s after the last result. Tap to make it stay up until you close it"}">${PIN_SVG}<span>${pin ? "STAY" : "20s"}</span></button>` +
      `<button class="b" id="x" title="Close (opens again on the next attack, or from the DICE tab)">✕</button></div>` +
      (e ? resultHtml(e) + (e.ap ? `<div class="ap">${/^auto damage/i.test(e.ap) ? "" : "✓ "}${esc(e.ap)}</div>` : "") : "") + (w ? waitHtml(w, !!e) : "");
    const $ = (id) => document.getElementById(id);
    $("x").onclick = close;
    $("pin").onclick = () => { set(PIN, pinned() ? "0" : "1"); render(); arm(true); };
    if ($("prev")) $("prev").onclick = () => { idx = (waitOnly ? list.length : i) - 1; render(); };
    if ($("next")) $("next").onclick = () => { idx = i + 1 >= list.length ? -1 : i + 1; render(); };
    if ($("drop")) $("drop").onclick = () => ready.then(() => OBR.room.setMetadata({ [SDCANCEL]: { id: w.id, ts: Date.now() } })).catch(() => {});
    const setN = (n) => ready.then(() => OBR.room.setMetadata({ [SDN]: { id: w.id, n, ts: Date.now() } })).catch(() => {});
    if ($("nm")) $("nm").onclick = () => setN(Math.max(1, (w.n || 1) - 1));
    if ($("np")) $("np").onclick = () => setN(Math.min(12, (w.n || 1) + 1));
    // grow / shrink to fit (anchored at the bottom, so it grows upward)
    const h = Math.ceil($("t").getBoundingClientRect().height) + 2;
    if (h !== lastH) { lastH = h; ready.then(() => OBR.popover.setHeight(ID, h)).catch(() => {}); }
    // something new: restart the fade timer (if fading is on)
    const sig = JSON.stringify([list.length && list[list.length - 1].id, w && w.id, w && w.n, w && (w.defs || []).length]);
    arm(sig !== lastSig); lastSig = sig;
  }
  // Fading mode only: closes 20 s after the last change, never while an attack is still waiting or the mouse is on it
  function arm(restart) {
    if (!restart && timer) return;
    clearTimeout(timer); timer = 0;
    if (pinned() || over || liveWait(state())) return;
    timer = setTimeout(() => { if (!pinned() && !over && !liveWait(state())) close(); }, AUTO);
  }
  document.body.addEventListener("mouseenter", () => { over = true; document.body.classList.add("hold"); clearTimeout(timer); timer = 0; });
  document.body.addEventListener("mouseleave", () => { over = false; document.body.classList.remove("hold"); arm(true); });
  window.addEventListener("storage", (ev) => { if (ev.key === KEY || ev.key === PIN) render(); });
  setInterval(render, 5000);
  // tells the background page this card is up, so a new result updates it in place instead of reopening it
  const alive = () => set("ns.sdAlive:" + room, String(Date.now())); alive(); setInterval(alive, 1500);
  window.addEventListener("pagehide", () => set("ns.sdAlive:" + room, "0")); // a waiting attack runs out after 3 minutes even if nothing else happens
  render();
</script></body></html>
