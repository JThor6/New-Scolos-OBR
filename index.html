<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Scolos Dice</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
  :root { --bg:transparent; --paper:rgba(15,17,28,.55); --ink:#f1f3f9; --dim:#9aa0b8; --accent:#bb99ff; --plus:#5fd38d; --minus:#ff6b6b; }
  html, body { background:transparent !important; }
  * { box-sizing: border-box; }
  body { margin:0; zoom:0.85; font-family: system-ui, sans-serif; background:var(--bg); color:var(--ink); font-size:14px; }
  header { background:rgba(0,0,0,.6); padding:8px 12px; display:flex; flex-wrap:wrap; row-gap:4px; justify-content:space-between; align-items:center; }
  header h1 { font-family:'Bangers', Impact, sans-serif; font-weight:400; letter-spacing:1px; margin:0; font-size:22px; white-space:nowrap; }
  header span { font-family:'Bangers', Impact, sans-serif; font-size:16px; color:var(--dim); }
  main { padding:10px 12px; }
  label { display:block; font-size:11px; font-weight:700; text-transform:uppercase; color:var(--dim); margin:6px 0 3px; }
  input { width:100%; padding:7px 8px; border-radius:6px; border:2px solid #444a66; background:var(--paper); color:var(--ink); font-size:14px; }
  #roll { width:100%; margin-top:10px; padding:10px; font-family:'Bangers', Impact, sans-serif; font-size:24px; letter-spacing:1px; border:3px solid #000; border-radius:8px; background:var(--accent); color:#000; cursor:pointer; }
  #roll:disabled { opacity:.5; }
  .card { background:var(--paper); border:2px solid #444a66; border-radius:10px; padding:10px; margin-top:12px; }
  .card.big { border:3px solid var(--accent); }
  .who { font-weight:700; }
  .who small { color:var(--dim); font-weight:400; margin-left:4px; }
  .dice { display:flex; gap:6px; align-items:center; margin-top:6px; }
  .die { width:30px; height:30px; border:2px solid var(--ink); border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:900; background:rgba(10,12,20,.6); }
  .big .die { width:42px; height:42px; font-size:28px; }
  .die.p { color:var(--plus); border-color:var(--plus); }
  .die.m { color:var(--minus); border-color:var(--minus); }
  .modtag { color:var(--dim); font-weight:700; margin-left:2px; }
  .total { margin-left:auto; font-family:'Bangers', Impact, sans-serif; font-size:30px; }
  .big .total { font-size:44px; }
  .histbtn { width:100%; margin-top:14px; padding:7px; font-family:'Bangers', Impact, sans-serif; font-size:18px; letter-spacing:1px; border:2px solid #444a66; border-radius:8px; background:var(--paper); color:var(--ink); cursor:pointer; }
  .line { display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; padding:5px 2px; border-bottom:1px solid #333a55; }
  .line .n { flex-basis:100%; font-size:12px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .line .t { color:var(--dim); font-size:10px; font-weight:400; margin-left:4px; }
  .line .die { width:20px; height:20px; font-size:14px; border-width:1.5px; }
  .line .tot { margin-left:auto; font-family:'Bangers', Impact, sans-serif; font-size:22px; width:36px; text-align:right; }
  nav { display:flex; flex-wrap:wrap; gap:2px; flex-basis:100%; }
  header h1 { flex:1; }
  .hctl { display:flex; gap:3px; align-items:center; }
  nav .tab { font-size:15px; padding:1px 5px; }
  html.solid, html.solid body { background:#222639 !important; }
  html.solid header { background:#000; }
  #ru { padding:8px 12px; }
  details.rs { border:2px solid #444a66; border-radius:8px; background:var(--paper); margin:6px 0; }
  .pop { float:right; background:transparent; border:none; color:var(--dim); cursor:pointer; padding:0 2px; }
  .pop:hover { color:var(--accent); }
  details.rs summary { font-family:'Bangers', Impact, sans-serif; font-size:17px; letter-spacing:1px; padding:6px 8px; cursor:pointer; color:var(--accent); }
  .rr { padding:3px 8px 5px; font-size:13px; border-top:1px solid #333a55; }
  .rr b { display:block; }
  .oddsw { padding:4px 0 8px; }
  .odds { border-collapse:collapse; font-size:9px; width:100%; table-layout:fixed; }
  .odds th { color:#9aa0b8; font-weight:800; padding:2px 0; text-align:center; white-space:nowrap; overflow:hidden; }
  .odds td { text-align:center; padding:3px 0; border:1px solid rgba(0,0,0,.35); color:#000; font-weight:700; white-space:nowrap; overflow:hidden; letter-spacing:-.2px; }
  .odds .o5 { background:#57bb8a; } .odds .o4 { background:#a8d08d; } .odds .o3 { background:#ffd666; }
  .odds .o2 { background:#f6a35c; } .odds .o1 { background:#e67c73; } .odds .o0 { background:#8a8f9f; }

  .rr.ep { background:rgba(255,176,32,.22); border-left:4px solid #ffb020; }
  .rr.ep b { color:#ffc94d; }
  .rh { padding:6px 8px 2px; font-weight:800; color:var(--dim); text-transform:uppercase; font-size:11px; }
  .tab { font-family:'Bangers', Impact, sans-serif; font-size:16px; letter-spacing:1px; background:transparent; color:var(--dim); border:2px solid transparent; border-radius:6px; padding:1px 7px; cursor:pointer; }
  .tab.on { color:#000; background:var(--accent); }
  #sh { padding:10px 12px; }
  .sec { font-family:'Bangers', Impact, sans-serif; font-size:17px; letter-spacing:1px; margin:12px 0 4px; color:var(--accent); }
  .kv { display:flex; justify-content:space-between; padding:2px 0; border-bottom:1px solid #333a55; }
  .kv b { font-weight:800; }
  .grid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; }
  .att { background:var(--paper); border:2px solid #444a66; border-radius:8px; text-align:center; padding:4px 2px; }
  .att small { display:block; font-size:9px; color:var(--dim); text-transform:uppercase; font-weight:700; }
  .att b { font-size:20px; }
  .vit { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .box { border:2px solid #444a66; border-radius:6px; background:var(--paper); color:var(--ink); font-size:11px; font-weight:700; line-height:1.15; padding:4px 1px; cursor:pointer; min-height:52px; }
  .box.x { background:var(--minus); color:#000; border-color:#000; font-weight:800; }
  .ctl { display:flex; align-items:center; gap:6px; }
  .ctl button:disabled { opacity:.35; cursor:default; }
  .ctl button, .sbtn { background:var(--paper); color:var(--ink); border:2px solid #444a66; border-radius:6px; padding:3px 9px; font-weight:800; cursor:pointer; }
  .sbtn.on { background:var(--accent); color:#000; }
  .sk { display:flex; justify-content:space-between; font-size:13px; padding:2px 0; border-bottom:1px solid #2c3250; }
  .pre { white-space:pre-line; font-size:13px; }
  select { width:100%; padding:6px; border-radius:6px; background:var(--paper); color:var(--ink); border:2px solid #444a66; }
  .fld { border:2px solid #000; outline:1px solid #444a66; border-radius:7px; background:var(--paper); padding:2px 6px 4px; min-width:0; }
  .fld small, .att small { display:block; font-size:9px; font-weight:800; text-transform:uppercase; color:var(--dim); }
  .fld > div { font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fld.c { text-align:center; }
  .pwl { font-size:11px; line-height:1.35; white-space:normal; margin-top:2px; }
  .pwl span { color:var(--dim); font-weight:800; font-size:9px; }
  .g2, .g3, .g4, .g5, .g2b { display:grid; gap:5px; margin-top:5px; }
  .g2 { grid-template-columns:1fr 1fr; } .g3 { grid-template-columns:1fr 1fr auto; } .g4 { grid-template-columns:repeat(4,1fr); }
  .g5 { grid-template-columns:repeat(5,1fr); } .g2b { grid-template-columns:1fr auto; }
  .g3:has(.fld:nth-child(3)) { grid-template-columns:1fr 1fr 1fr; }
  .stab { display:inline-block; background:#000; color:#fff; font-weight:800; font-size:12px; letter-spacing:.5px; padding:2px 10px; border-radius:6px 6px 0 0; margin-top:10px; }
  .att { border:3px solid #000; outline:1px solid #444a66; border-radius:8px; background:var(--paper); text-align:center; padding:4px 2px; }
  .att b { font-size:22px; }
  .att.dp { background:rgba(120,120,130,.35); border-width:2px; }
  .vit { display:grid; grid-template-columns:repeat(7,1fr); gap:0; border:2px solid #000; outline:1px solid #444a66; border-radius:7px; background:var(--paper); }
  .box { border:none; border-left:1px solid #444a66; background:transparent; color:var(--ink); font-size:11.5px; font-weight:800; line-height:1.15; padding:4px 1px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; text-transform:uppercase; }
  .box:first-child { border-left:none; }
  .box b { font-size:15px; }
  .box.x { background:transparent; color:var(--ink); }
  .chk { width:20px; height:20px; border:2px solid var(--ink); border-radius:3px; background:transparent; color:var(--ink); font-weight:900; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }
  .chk.x { background:var(--minus); color:#000; border-color:#000; }
  .skt { width:100%; border-collapse:collapse; border:2px solid #000; background:var(--paper); font-size:12px; }
  .skt th { font-size:9px; text-align:left; color:var(--dim); padding:2px 3px; border-bottom:1px solid #444a66; }
  .skt td { padding:3px; border-top:1px solid #333a55; border-left:1px solid #333a55; }
  .skt td:first-child { border-left:none; }
  .lbox { border:2px solid #000; outline:1px solid #444a66; border-radius:0 7px 7px 7px; background:var(--paper); padding:5px 7px; font-size:13px; line-height:1.4; }
  @media (max-width: 330px) {
    .g4 { grid-template-columns:1fr 1fr; } .g5 { grid-template-columns:repeat(3,1fr); }
    .skt th:nth-child(3), .skt td:nth-child(3), .skt th:nth-child(4), .skt td:nth-child(4) { display:none; }
    .box { font-size:8.5px; } .box b { font-size:12px; } .chk { width:16px; height:16px; }
    .att b { font-size:18px; }
  }
  body { overflow-x:hidden; }
  .box { hyphens:auto; -webkit-hyphens:auto; }
  .skt td:first-child { overflow-wrap:anywhere; }
  .pcard { border:2px solid #000; outline:1px solid #444a66; border-radius:8px; background:var(--paper); padding:6px 8px; margin-top:6px; }
  .ptop { display:flex; align-items:baseline; gap:6px; }
  .ptop b { font-size:15px; } .ptop small { color:var(--dim); font-size:11px; flex:1; }
  .ppw { font-size:9px; font-weight:800; padding:2px 5px; border-radius:4px; background:var(--plus); color:#000; }
  .ppw.u { background:#555b75; color:var(--ink); }
  .pvit { display:flex; align-items:flex-end; gap:4px; margin-top:5px; }
  .pvit i { display:flex; flex-direction:column; align-items:center; font-style:normal; gap:1px; }
  .pvit i small { font-size:9px; font-weight:800; color:var(--dim); }
  .pvit span { width:16px; height:16px; border:2px solid var(--ink); border-radius:3px; }
  .pvit span.x { background:var(--minus); border-color:#000; }
  .pvit em { font-style:normal; font-size:12px; font-weight:700; margin-left:6px; }
  .pvit em.bad { color:var(--minus); }
  .rd { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; padding:0; margin-left:4px; border:none; border-radius:5px; background:transparent; color:var(--accent); cursor:pointer; opacity:.8; vertical-align:middle; }
  .rd:hover { opacity:1; background:rgba(187,153,255,.18); }
  .skt .rdc { width:26px; padding:0; text-align:center; border-left:none; }
  .skt .rdc .rd { margin:0; }
  .att { position:relative; }
  .rd.ra { position:absolute; bottom:3px; right:3px; margin:0; width:18px; height:18px; }
  .syncdot { color:var(--dim); font-size:13px; align-self:center; animation:spin 1s linear infinite; display:inline-block; }
  .syncdot[hidden] { display:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .line .lbl { flex:1; min-width:0; text-align:center; font-size:12px; font-weight:700; color:var(--accent); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mcard { border:2px solid #000; outline:1px solid #444a66; border-radius:8px; background:var(--paper); padding:6px 8px 8px; margin-top:8px; }
  .mcard.dead { background:rgba(150,30,40,.45); outline-color:#a33; opacity:.75; }
  .mcard.dead .mtop b { text-decoration:line-through; }
  .mtop { display:flex; align-items:center; gap:6px; margin-bottom:4px; }
  .mtop b { font-size:15px; } .mtop small { color:var(--dim); font-size:11px; flex:1; }
  .mdead.on { background:var(--minus); color:#000; }
  .mstats .fld > div { font-size:13px; white-space:normal; display:flex; align-items:center; gap:2px; }
  .pvit.mv { margin-top:6px; }
  .mw { width:18px; height:18px; border:2px solid var(--ink); border-radius:3px; background:transparent; cursor:pointer; padding:0; }
  .mw.x { background:var(--minus); border-color:#000; }
  .mtext { font-size:12px; line-height:1.35; margin-top:6px; color:var(--ink); }
  .mnote { color:#ffc94d; }
  .initbox { border:2px solid #000; outline:1px solid #6b5aa0; border-radius:8px; background:var(--paper); padding:6px 8px 8px; }
  .irow { display:flex; align-items:center; gap:6px; padding:4px 2px; border-bottom:1px solid #333a55; font-size:13px; }
  .irow.cur { background:rgba(187,153,255,.25); }
  .irow .n { color:var(--dim); width:16px; } .irow b { flex:0 1 auto; } .irow small { color:var(--dim); flex:1; font-size:10px; }
  .irow .t { font-family:'Bangers', Impact, sans-serif; font-size:18px; }
  .ix { background:transparent; border:none; color:var(--dim); cursor:pointer; font-weight:900; }
  .iadd { display:grid; grid-template-columns:1fr 54px auto; gap:5px; margin-top:6px; }
  .iadd input { padding:4px 6px; }
  .help { font-size:11px; color:var(--dim); line-height:1.35; margin:3px 0 2px; }
  .err { color:var(--minus); margin-top:8px; font-weight:700; }
  .empty { color:var(--dim); margin-top:8px; }
</style>
</head>
<body>
<header><h1>NEW SCOLOS</h1><span class="hctl"><span id="syncdot" class="syncdot" hidden title="Syncing with Google Sheets">⟳</span><button id="solid" class="tab" title="See-through / solid">◐</button><button id="size" class="tab" title="Change panel size">S</button></span><nav><button class="tab on" data-t="dice">DICE</button><button class="tab" data-t="sheet">SHEET</button><button class="tab" data-t="rules">REFERENCE</button><button class="tab" data-t="mon" id="monTab" hidden>MONSTERS</button></nav></header>
<section id="sheet" hidden><div id="sh"></div></section>
<section id="rules" hidden><div id="ru"></div></section>
<section id="mon" hidden><div id="mo"></div></section>
<main id="dice">
  <label>Modifier</label>
  <input id="modin" inputmode="numeric" placeholder="0" style="font-size:22px;font-weight:800;text-align:center;width:110px">
  <button id="roll">ROLL</button>
  <div id="err" class="err" hidden></div>
  <div id="last"></div>
  <button id="histbtn" class="histbtn">SHOW ROLL HISTORY</button>
  <div id="history" hidden><div class="empty">No rolls yet.</div></div>
</main>
<script type="module">
import OBR from "https://esm.sh/@owlbear-rodeo/sdk@3.1.0";
import { KEEP, rollKey, allRolls, fmt, INIT, initEntries } from "./shared.js";
import { TYPES, SECTIONS, getTab, sectionHtml } from "./rules.js";

const $ = (id) => document.getElementById(id);
let mod = 0, me = null, standalone = !OBR.isAvailable, localRolls = [];

// Type the modifier: "+3", "-1", "3" or blank (0). Enter rolls.
function readMod() {
  const t = $("modin").value.trim().replace(/^\+/, "").replace("−", "-");
  if (t === "") return 0;
  const n = Number(t);
  return Number.isInteger(n) && Math.abs(n) <= 30 ? n : null;
}
$("modin").onkeydown = (e) => { if (e.key === "Enter") $("roll").click(); };

function rollDie() { const a = new Uint32Array(1); crypto.getRandomValues(a); return (a[0] % 3) - 1; }

function card(r, big) {
  const dice = r.dice.map(d => `<div class="die ${d > 0 ? "p" : d < 0 ? "m" : ""}">${d > 0 ? "+" : d < 0 ? "−" : ""}</div>`).join("");
  const time = new Date(r.ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  return `<div class="card ${big ? "big" : ""}">
    <div class="who">${esc(r.who)}${r.label ? ` <small>${esc(r.label)}</small>` : ""}<small>${time}</small></div>
    <div class="dice">${dice}${r.mod ? `<span class="modtag">${fmt(r.mod)}</span>` : ""}<span class="total">${fmt(r.total)}</span></div>
  </div>`;
}

// Slot-machine reel: faces flicker, then each die locks in left to right, then the total.
const face = (d) => d > 0 ? "+" : d < 0 ? "−" : "";
const cls = (d) => `die ${d > 0 ? "p" : d < 0 ? "m" : ""}`;
function spin(r) {
  return new Promise((done) => {
    $("last").innerHTML = `<div class="card big"><div class="who">Rolling…</div><div class="dice">${
      r.dice.map((_, i) => `<div class="die" id="d${i}"></div>`).join("")}${r.mod ? `<span class="modtag">${fmt(r.mod)}</span>` : ""}<span class="total" id="tot">?</span></div></div>`;
    let locked = 0;
    const tick = setInterval(() => {
      for (let i = locked; i < 4; i++) { const d = rollDie(), el = $("d" + i); el.className = cls(d); el.textContent = face(d); }
    }, 70);
    const lockNext = () => {
      const el = $("d" + locked); el.className = cls(r.dice[locked]); el.textContent = face(r.dice[locked]);
      locked++;
      if (locked < 4) return setTimeout(lockNext, 350);
      clearInterval(tick);
      setTimeout(() => { $("last").innerHTML = card(r, true); done(); }, 300);
    };
    setTimeout(lockNext, 900);
  });
}

// Compact history: one line per roll, newest first.
function line(r) {
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const time = new Date(r.ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  return `<div class="line"><span class="n">${esc(r.who)} <span class="t">${time}</span></span><span class="dice" style="margin:0">${
    r.dice.map(d => `<div class="${cls(d)}">${face(d)}</div>`).join("")}</span><span class="modtag">${r.mod ? fmt(r.mod) : ""}</span>${r.label ? `<span class="lbl">${esc(r.label)}</span>` : ""}<span class="tot">${fmt(r.total)}</span></div>`;
}
function render(rolls) {
  $("history").innerHTML = rolls.length ? rolls.slice(0, 30).map(line).join("") : `<div class="empty">No rolls yet.</div>`;
}
$("histbtn").onclick = () => {
  const h = $("history"); h.hidden = !h.hidden;
  $("histbtn").textContent = h.hidden ? "SHOW ROLL HISTORY" : "HIDE ROLL HISTORY";
};

function showErr(msg) { $("err").textContent = msg; $("err").hidden = !msg; }

$("roll").onclick = async () => {
  showErr("");
  mod = readMod();
  if (mod === null) { showErr("Modifier must be a whole number, like +3 or -1."); return; }
  const dice = [rollDie(), rollDie(), rollDie(), rollDie()];
  const who = standalone ? "Test" : await OBR.player.getName();
  const r = { id: crypto.randomUUID(), pid: me || "local", who, dice, mod, total: dice.reduce((a, b) => a + b, 0) + mod, ts: Date.now() };
  $("roll").disabled = true;
  await spin(r);
  const err = await saveRoll(r);
  if (err) showErr(err);
  $("roll").disabled = false;
};

// Puts a roll in the shared history. Returns an error message, or "" when it worked.
async function saveRoll(r) {
  if (standalone) { localRolls = [r, ...localRolls]; render(localRolls); return ""; }
  try {
    const key = rollKey(me);
    const md = await OBR.room.getMetadata();
    const mine = Array.isArray(md[key]) ? md[key] : [];
    await OBR.room.setMetadata({ [key]: [r, ...mine].slice(0, KEEP) });
    const check = await OBR.room.getMetadata(); // over-cap writes fail silently, so read back
    if (!(check[key] || []).some(x => x.id === r.id)) return "Roll didn't reach the table (room storage may be full). Others may not see it.";
    return "";
  } catch (e) { return "Roll didn't reach the table: " + (e?.message || e); }
}

// Quick roll from the sheet: rolls with that number as the modifier and shows it spinning in the bottom-right.
const ROLL_ICON = `<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M8 12h8M12 8v8" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>`;
async function quickRoll(modText, label, whoName) {
  const m = parseInt(String(modText).replace("−", "-"), 10) || 0;
  // If the GM called for initiative, a player's next Adroitness roll is their initiative
  let initSid = "";
  if (!standalone && !whoName && label === "Adroitness") {
    const st = (await OBR.room.getMetadata())[INIT];
    if (st?.open && store.get("ns.initDone") !== st.sid) { initSid = st.sid; label = "Adroitness · Initiative"; }
  }
  const dice = [rollDie(), rollDie(), rollDie(), rollDie()];
  const who = whoName || (standalone ? "Test" : await OBR.player.getName());
  const r = { id: crypto.randomUUID(), pid: me || "local", who, label: String(label || "").slice(0, 40), dice, mod: m, total: dice.reduce((a, b) => a + b, 0) + m, ts: Date.now() };
  // the always-running background page shows it in the bottom-right roll cards
  try { localStorage.setItem("ns.toastReq", JSON.stringify(r)); } catch {}
  const err = await saveRoll(r);
  if (err && $("sherr")) { $("sherr").hidden = false; $("sherr").textContent = err; }
  if (initSid) {
    const name = String(sheetVals?.[2]?.[2] || "").trim() || who;
    await OBR.room.setMetadata({ [`${INIT}/p/${me}`]: { id: me, sid: initSid, name, total: r.total, adr: m, pc: true, r: Math.random() } }).catch(() => {});

async function bridgeGet(params) {

async function loadSheet(quiet) {
  partyOn = false;
  const id = store.get("ns.sheetId"), saved = cache.get("sheet." + id);
  if (!quiet) {
    if (saved) { sheetVals = saved; drawSheet(); quiet = true; } // show the saved copy right away
    else $("shbody").innerHTML = `<div class="empty">Loading sheet…</div>`;
  }
  sync(1);
  const r = await bridgeGet({ id }).catch(e => ({ ok: false, error: e.message }));
  sync(-1);
  if (id !== store.get("ns.sheetId") || partyOn) return; // switched away while loading
  if (!r.ok && quiet) return; // background refresh failed: keep what's on screen
  if (!r.ok) {
    if (/code/i.test(r.error || "")) store.set("ns.code", "");
    if (!isGM) store.set("ns.sheetId", "");
    return connectForm(r.error);
  }
  cache.set("sheet." + id, r.values);
  if (JSON.stringify(r.values) === JSON.stringify(sheetVals) && $("shbody")?.querySelector(".fld")) return; // nothing changed
  sheetVals = r.values; drawSheet();
}

// Always-on power and the daily Extraordinary Power options, read from the character's type tab in the Master file
async function fillPowers() {
  const type = V("C4").trim().toLowerCase();
  const tab = TYPES.find(t => t.trim().toLowerCase() === type);
  if (!tab || !$("pwlist")) return;
  try {
    const v = await getTab(tab);
    const always = [], daily = [];
    for (const row of v) {
      const b = String(row[1] || "").trim(), c = String(row[2] || "").trim();
      if (/^always on/i.test(b)) { const name = b.replace(/^always on/i, "").replace(/\([^)]*\)/g, "").replace(/^[\s:]+/, "").trim(); always.push(name || c); }
      else if (/^extraordinary power/i.test(b) && c) daily.push(c.replace(/\s*\((once|one) per day\)\s*/ig, " ").trim());
    }
    if ($("pwlist")) $("pwlist").innerHTML =
      (always.length ? `<div><span>ALWAYS ON:</span> ${always.map(esc2).join(", ")}</div>` : "") +
      (daily.length ? `<div><span>DAILY:</span> ${daily.map(esc2).join(" · ")}</div>` : "");
  } catch { /* the sheet still works without it */ }
}
function setCell(a1, v) { const m = a1.match(/^([A-L])(\d+)$/); sheetVals[+m[2] - 1][m[1].charCodeAt(0) - 65] = v; }

async function save(body, apply) {
  if (busy) return; busy = true;
  const before = JSON.stringify(sheetVals);
  apply(); drawSheet(); // show it right away
  const r = await bridgePost(body).catch(e => ({ ok: false, error: e.message }));
  busy = false;
  if (r.ok) { loadSheet(true); return; } // re-read so the sheet's own formulas (like Damage Penalty) show up
  if (!r.ok) { sheetVals = JSON.parse(before); drawSheet(); $("sherr").hidden = false; $("sherr").textContent = "Didn't save to the sheet: " + (r.error || "unknown error") + " (Is the sheet shared with Jake as Editor?)"; }
}

// Keep the sheet current while it's open (picks up edits made in Google Sheets too)
setInterval(() => { if ($("sheet").hidden || busy || !$("shbody")) return; partyOn ? showParty() : (sheetVals && loadSheet(true)); }, 30000);

// Only real characters: a Main Sheet titled "New Scolos Character Sheet" with a name filled in, and not the Master file
async function characterSheets() {
  const list = await bridgeGet({ list: 1 });
  if (!list.ok) throw new Error(list.error);
  const all = await Promise.all(list.sheets.filter(f => !/master/i.test(f.name)).map(async f => {
    const r = await bridgeGet({ id: f.id }).catch(() => null);
    if (!r || !r.ok) return null;
    const v = r.values, title = String(v[1]?.[1] || "").trim(), name = String(v[2]?.[2] || "").trim();
    return /character sheet/i.test(title) && name ? { id: f.id, name, values: v } : null;
  }));
  const out = all.filter(Boolean).sort((a, b) => a.name.localeCompare(b.name));
  cache.set("chars", out);
  for (const c of out) cache.set("sheet." + c.id, c.values);
  return out;
}
// GM: refresh the character list in the background and add any new names to the dropdown
async function refreshCharList() {
  sync(1);
  try {
    const fresh = await characterSheets();
    const pick = $("pick"); if (!pick) return;
    const have = new Set([...pick.options].map(o => o.value));
    for (const c of fresh) if (!have.has(c.id)) pick.insertAdjacentHTML("beforeend", `<option value="${c.id}">${esc2(c.name)}</option>`);
  } catch {} finally { sync(-1); }
}

  drawInitList();
  document.querySelectorAll("#mo .rd").forEach(b => b.onclick = (e) => { e.stopPropagation(); quickRoll(b.dataset.m, b.dataset.l, b.dataset.w); });
  document.querySelectorAll("#mo .mw, #mo .mdead").forEach(b => b.onclick = () => monSet(+b.dataset.r, b.dataset.c ? +b.dataset.c : 20, !!b.dataset.on));
}
async function monSet(row, col, on) {
  const before = JSON.stringify(monVals);
  monVals[row - 1] = monVals[row - 1] || []; monVals[row - 1][col - 1] = on ? (col === 20 ? "TRUE" : "X") : "";
  drawMonsters(); // show it right away
  sync(1);
  const r = await fetch(BRIDGE, { method: "POST", body: JSON.stringify({ code: store.get("ns.code"), id: monId(), tracker: 1, row, col, on }) }).then(x => x.json()).catch(e => ({ ok: false, error: e.message }));
  sync(-1);
  if (!r.ok) { monVals = JSON.parse(before); drawMonsters(); $("mo").insertAdjacentHTML("afterbegin", `<div class="err">Didn't save: ${esc2(r.error)}</div>`); }
  else cache.set("mon." + monId(), monVals);
  if (col === 20) syncDeadGroups();
}
// When every monster in a group is dead, take that group off the initiative bar (and back on if one is revived)
async function syncDeadGroups() {
  const v = monVals || [], c = (row, i) => String(v[row]?.[i] ?? "").trim();
  const hdr = Math.max(0, v.findIndex(r => String(r?.[0] || "").trim().toLowerCase() === "name"));
  const alive = new Map();
  for (let row = hdr + 1; row < v.length; row++) {
    const name = c(row, 0); if (!name) continue;
    const g = c(row, 1) || name, dead = /^(true|x|yes|dead)$/i.test(c(row, 19));
    alive.set(g, (alive.get(g) || 0) + (dead ? 0 : 1));
  }
  const md = await OBR.room.getMetadata(), st = md[INIT]; if (!st?.open) return;
  const removed = new Set(st.removed || []);
  for (const [g, n] of alive) { const id = "m:" + g; if (n === 0) removed.add(id); else removed.delete(id); }
  await OBR.room.setMetadata({ [INIT]: { ...st, removed: [...removed] } });
}

// ---------------- INITIATIVE (GM controls) ----------------
let initMd = {};
function drawInitList() {
  const box = $("iList"); if (!box) return;
  const st = initMd[INIT], list = st?.open ? initEntries(initMd) : [];
  box.innerHTML = !st?.open ? `<div class="empty" style="font-size:12px">No combat running. Call for initiative to start.</div>`
    : list.length ? list.map((e, i) => `<div class="irow ${e.id === st.cur ? "cur" : ""}"><span class="n">${i + 1}</span><b>${esc2(e.name)}</b><small>${e.pc ? "player" : ""}</small><span class="t">${fmt(e.total)}</span><button class="ix" data-id="${esc2(e.id)}" title="Remove">✕</button></div>`).join("")
    : `<div class="empty" style="font-size:12px">Waiting for rolls… Players roll Adroitness on their SHEET tab.</div>`;
  box.querySelectorAll(".ix").forEach(b => b.onclick = async () => {
    const s = (await OBR.room.getMetadata())[INIT]; if (!s) return;
    await OBR.room.setMetadata({ [INIT]: { ...s, removed: [...(s.removed || []), b.dataset.id] } });
  });
}
async function callInitiative() {
  const sid = crypto.randomUUID().slice(0, 8);
  await OBR.room.setMetadata({ [INIT]: { sid, open: true, cur: "", round: 1, removed: [] }, [INIT + "/m"]: [] });
}
async function endInitiative() {
  const s = (await OBR.room.getMetadata())[INIT]; if (s) await OBR.room.setMetadata({ [INIT]: { ...s, open: false } });
}
// Each monster group rolls once (4 dice + the first living member's Adroitness) and stays together in the order
async function rollMonsterInit() {
  const md = await OBR.room.getMetadata(), st = md[INIT];
  if (!st?.open) await callInitiative();
  const sid = (await OBR.room.getMetadata())[INIT].sid;
  const have = new Set(((await OBR.room.getMetadata())[INIT + "/m"] || []).filter(e => e.sid === sid).map(e => e.id));
  const v = monVals || [], c = (row, i) => String(v[row]?.[i] ?? "").trim();
  const hdr = Math.max(0, v.findIndex(r => String(r?.[0] || "").trim().toLowerCase() === "name"));
  const groups = new Map();
  for (let row = hdr + 1; row < v.length; row++) {
    const name = c(row, 0); if (!name || /^(true|x|yes|dead)$/i.test(c(row, 19))) continue;
    const g = c(row, 1) || name;
    if (!groups.has(g)) groups.set(g, { adr: parseInt(c(row, 4)) || 0, n: 0 });
    groups.get(g).n++;
  }
  const add = [];
  for (const [g, info] of groups) {
    const id = "m:" + g; if (have.has(id)) continue;
    const dice = [rollDie(), rollDie(), rollDie(), rollDie()], total = dice.reduce((a, b) => a + b, 0) + info.adr;
    const label = info.n > 1 ? `${g} ×${info.n}` : g;
    add.push({ id, sid, name: label, total, adr: info.adr, pc: false, r: Math.random() });
    const roll = { id: crypto.randomUUID(), pid: me || "local", who: label, label: "Adroitness · Initiative", dice, mod: info.adr, total, ts: Date.now() };
    try { localStorage.setItem("ns.toastReq", JSON.stringify(roll)); } catch {}
    await saveRoll(roll);
  }
  const cur = (await OBR.room.getMetadata())[INIT + "/m"] || [];
  await OBR.room.setMetadata({ [INIT + "/m"]: [...cur.filter(e => e.sid === sid), ...add] });
}
// Add a late arrival by hand (monster or anyone), with their initiative number
async function addInitEntry() {
  const name = $("iName").value.trim(), num = parseInt($("iNum").value.replace("−", "-").replace("+", ""), 10);
  if (!name || isNaN(num)) return;
  const md = await OBR.room.getMetadata(); if (!md[INIT]?.open) await callInitiative();
  const sid = (await OBR.room.getMetadata())[INIT].sid, cur = (await OBR.room.getMetadata())[INIT + "/m"] || [];
  await OBR.room.setMetadata({ [INIT + "/m"]: [...cur.filter(e => e.sid === sid), { id: "x:" + crypto.randomUUID().slice(0, 6), sid, name, total: num, adr: 0, pc: false, r: Math.random() }] });
  $("iName").value = ""; $("iNum").value = "";
}

// ---------------- PARTY OVERVIEW ----------------
// Everyone's name, type, power used today and vitality track, read-only. For healers and the GM.
let partyOn = false;
async function showParty() {
  partyOn = true;
  const body = $("shbody") || ($("sh").insertAdjacentHTML("beforeend", `<div id="shbody"></div>`), $("shbody"));
  const saved = cache.get("chars");
  if (saved?.length) drawParty(body, saved.map(c => c.values));
  else body.innerHTML = `<div class="empty">Loading party…</div>`;
  sync(1);
  try {
    const chars = (await characterSheets()).map(c => c.values);
    if (!partyOn) return;
    drawParty(body, chars);
  } catch (e) { if (!saved?.length) body.innerHTML = `<div class="err">Couldn't load the party: ${esc2(e.message || e)}</div>`; }
  finally { sync(-1); }
}
function drawParty(body, chars) {
  {
    const cell = (v, a1) => { const m = a1.match(/^([A-L])(\d+)$/); return String(v[+m[2] - 1]?.[m[1].charCodeAt(0) - 65] ?? "").trim(); };
    body.innerHTML = chars.length ? chars.map(v => {
      const marks = "BCDEFGH".split("").map(c => !!cell(v, c + "16"));
      const worst = marks.lastIndexOf(true);
      const status = worst < 0 ? "Unhurt" : cell(v, "BCDEFGH"[worst] + "15").replace(/^\S+\s+/, "");
      const used = cell(v, "F6").toUpperCase() === "TRUE";
      return `<div class="pcard">
        <div class="ptop"><b>${esc2(cell(v, "C3"))}</b><small>${esc2(cell(v, "C4"))}</small><span class="ppw ${used ? "u" : ""}">${used ? "POWER USED" : "POWER READY"}</span></div>
        <div class="pvit">${marks.map((m, i) => `<i><small>${["LW", "LW", "LW", "MW", "CW", "KO", "D"][i]}</small><span class="${m ? "x" : ""}"></span></i>`).join("")}<em class="${worst >= 4 ? "bad" : ""}">${esc2(status)}</em></div>
      </div>`;
    }).join("") : `<div class="empty">No characters found.</div>`;
  }
}

// See-through by default; ◐ switches the whole panel to solid gray (remembered per player)
function applySolid() { const on = store.get("ns.solid") === "1"; document.documentElement.classList.toggle("solid", on); $("solid").classList.toggle("on", on); }
$("solid").onclick = () => { store.set("ns.solid", store.get("ns.solid") === "1" ? "" : "1"); applySolid(); };
applySolid();

// ---------------- PANEL SIZE (S / M / L, remembered per player) ----------------
const SIZES = { S: [264, 680], L: [520, 1400] };
function applySize() {
  const k = SIZES[store.get("ns.size")] ? store.get("ns.size") : "S";
  $("size").textContent = k;
  if (standalone) return;
  OBR.action.setWidth(SIZES[k][0]).catch(() => {});
  if (k === "L") OBR.viewport.getHeight().then(vh => OBR.action.setHeight(Math.max(500, vh - 70))).catch(() => OBR.action.setHeight(SIZES.L[1]).catch(() => {})); // fill the screen top to bottom
  else OBR.action.setHeight(SIZES[k][1]).catch(() => {});
}
$("size").onclick = () => { store.set("ns.size", store.get("ns.size") === "L" ? "S" : "L"); applySize(); };

// ---------------- RULES TAB ----------------
const POP_ICON = `<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
// Opens one rules section in its own see-through panel in the upper right; it stays up while you use the sheet.
async function popOut(k) {
  if (standalone) return window.open("popout.html?k=" + encodeURIComponent(k));
  const u = new URL("popout.html", location.href);
  const ref = new URLSearchParams(location.search).get("obrref"); if (ref) u.searchParams.set("obrref", ref);
  u.searchParams.set("k", k);
  const vw = await OBR.viewport.getWidth(), vh = await OBR.viewport.getHeight();
  OBR.popover.open({ id: "com.newscolos.rules", url: u.href, width: 340, height: Math.max(360, Math.round(vh * 0.75)),
    anchorReference: "POSITION", anchorPosition: { left: vw - 70, top: 70 },
    anchorOrigin: { horizontal: "RIGHT", vertical: "TOP" }, transformOrigin: { horizontal: "RIGHT", vertical: "TOP" },
    disableClickAway: true, hidePaper: true }).catch(() => {});
}
function showRules() {
  if (!store.get("ns.code")) { $("ru").innerHTML = `<div class="empty">Open the SHEET tab and enter the table code first.</div>`; return; }
  if ($("ru").dataset.ready) return;
  $("ru").dataset.ready = "1";
  $("ru").innerHTML = SECTIONS.map(([t, k]) => `<details class="rs" data-k="${k}"><summary>${esc2(t.toUpperCase())}<button class="pop" data-k="${k}" title="Pop out">${POP_ICON}</button></summary><div class="rb"></div></details>`).join("");
  document.querySelectorAll(".pop").forEach(b => b.onclick = (e) => { e.preventDefault(); e.stopPropagation(); popOut(b.dataset.k); });
  document.querySelectorAll("details.rs").forEach(d => d.addEventListener("toggle", async () => {
    const body = d.querySelector(".rb");
    if (!d.open || body.dataset.done) return;
    body.innerHTML = `<div class="rr">Loading…</div>`;
    try { body.innerHTML = await sectionHtml(d.dataset.k) || "<div class='rr'>Nothing here yet.</div>"; body.dataset.done = "1"; }
    catch (e) { body.innerHTML = `<div class="rr err">Couldn't load: ${esc2(e.message || e)}</div>`; }
  }));
}

if (standalone) {
  document.querySelector("nav").insertAdjacentHTML("beforeend", `<span style="color:var(--dim);font-size:10px">TEST</span>`);
} else {
  OBR.onReady(async () => {
    me = await OBR.player.getId();
    isGM = (await OBR.player.getRole()) === "GM";
    $("monTab").hidden = !isGM;
    if (isGM) { initMd = await OBR.room.getMetadata(); OBR.room.onMetadataChange((m) => { initMd = m; drawInitList(); }); }
    applySize();
    render(allRolls(await OBR.room.getMetadata()));
    OBR.room.onMetadataChange((md) => render(allRolls(md)));
  });
}
</script>
