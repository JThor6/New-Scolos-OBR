<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="module">
import OBR from "https://esm.sh/@owlbear-rodeo/sdk@3.1.0";
import { allRolls, INIT, initEntries, markList, rollLog, rollKey, KEEP, sameName } from "./shared.js";
// Runs all session, even when the dice panel is closed.
// Shows rolls as small cards at the bottom middle of the map. Up to 8 at once (two rows of 4, middle cards first),
// so when everyone rolls together (initiative) the whole table's results are visible.
const TOAST = "com.newscolos.dice/toast";
const W = 210, H = 74, GAP = 6, SLOTS = 8, PER_ROW = 4, SHOW_MS = 9000; // 9 s on screen (hover keeps a card up)
const busyUntil = new Array(SLOTS).fill(0);
// A card the mouse is resting on says so in localStorage ("held until" time), so a new roll never lands on top of it
const held = (id) => { try { return Number(localStorage.getItem("ns.hold:" + id) || 0) > Date.now(); } catch { return false; } };
// Where the bottom row of roll cards starts (the Success Delta card sits just left of it)
let rowLeft = 0;

async function showRoll(r, spin) {
  const now = Date.now();
  let slot = busyUntil.findIndex((t, i) => t < now && !held(TOAST + "/" + i));
  if (slot < 0) { // all full: replace the oldest one nobody is hovering
    const free = busyUntil.map((t, i) => [t, i]).filter(([, i]) => !held(TOAST + "/" + i)).sort((a, b) => a[0] - b[0]);
    slot = free.length ? free[0][1] : busyUntil.indexOf(Math.min(...busyUntil)); }
  const show = SHOW_MS + (spin ? 2000 : 0);
  busyUntil[slot] = now + show + 400;
  const id = TOAST + "/" + slot;
  const url = new URL("go.html", location.href); url.searchParams.set("p", "toast");
  const ref = new URLSearchParams(location.search).get("obrref"); if (ref) url.searchParams.set("obrref", ref);
  url.searchParams.set("id", id);
  url.searchParams.set("ms", show);
  url.searchParams.set("who", r.who);
  if (r.char) url.searchParams.set("char", r.char);
  url.searchParams.set("dice", r.dice.join(","));
  url.searchParams.set("mod", r.mod || 0);
  url.searchParams.set("total", r.total);
  if (r.label) url.searchParams.set("label", r.label);
  if (r.ks) url.searchParams.set("ks", "1"); else if (r.pw) url.searchParams.set("pw", "1"); // Kill Shot red card, daily power gold card
  if (r.cop) { url.searchParams.set("cop", "1"); if (r.max != null) url.searchParams.set("max", r.max); spin = false; } // Combat Option Point used: no dice
  if (r.ap || r.bs) { url.searchParams.set("ap", r.ap || "bullet stop"); spin = false; } // a power switched on: no dice
  if (r.wnd) url.searchParams.set("wnd", r.wnd); // the card shows it on the name line, whatever the label's length
  if (spin) url.searchParams.set("spin", "1");
  const vw = await OBR.viewport.getWidth(), vh = await OBR.viewport.getHeight();
  // Cards sit at the bottom middle of the map, just above Owlbear's bottom toolbar, out of the way of the
  // REFERENCE pop-out (upper right). If the New Scolos panel is open on the left, they center in the space beside it.
  let left = 0;
  try { if (await OBR.action.isOpen()) left = ((await OBR.action.getWidth()) || 520) + 40; } catch {}
  const space = vw - left - 20, per = Math.max(1, Math.min(PER_ROW, Math.floor((space + GAP) / (W + GAP))));
  const order = [1, 2, 0, 3].filter(i => i < per).concat([...Array(per).keys()].filter(i => i > 3)); // middle cards first
  const idx = slot % per, row = Math.floor(slot / per), col = per === 1 ? 0 : (order[idx] ?? idx);
  const rowW = per * W + (per - 1) * GAP, x0 = left + (vw - left - rowW) / 2;
  rowLeft = x0;
  await OBR.popover.open({ // every card the same size: room for the longest skill name (3 lines)
    id, url: url.href, width: W, height: H + 32,
    anchorReference: "POSITION",
    anchorPosition: { left: Math.round(x0 + col * (W + GAP)), top: vh - 80 - row * (H + 32 + GAP) },
    anchorOrigin: { horizontal: "LEFT", vertical: "BOTTOM" },
    transformOrigin: { horizontal: "LEFT", vertical: "BOTTOM" },
    disableClickAway: true, hidePaper: true,
  });
}

// ---------------- Success Delta ----------------
// In or out of combat, an attack roll (Ranged Weapons, Melee Weapon Fighting, Martial Arts, Unconventional Weapons,
// Spellcasting, Meltdown, a monster's Attack) waits for Adroitness rolls by other people: the defenders.
// Most attacks have one defender. Area-capable ones (Spellcasting, Unconventional Weapons, Meltdown, monster Attacks) show
// − / + on the card to set how many: the next that many different people's Adroitness rolls each get their own result.
// Every screen works it out from the same shared rolls, so everyone sees the same thing. Nothing gets marked on a sheet.
// Success Delta = attack total - defense total (ties go to the attacker). Damage = Delta + Damage Bonus - defender's Armor Bonus.
// Wounds (Main Sheet row 15): 1-2 Light, 3-4 Medium, 5-6 Critical, 7-8 Down & KO'ed, 9+ Dead.
// The card itself is sdcard.html, just left of the roll cards. It reads this screen's results and the waiting attack from
// localStorage ("ns.sd:<room>"), so it updates in place; ‹ › pages through results; 📌 picks "stays up" or "fades after 30 s".
const SD = "com.newscolos.dice/delta", SD_W = 280, ATTACK_WAIT = 3 * 60e3, SD_KEEP = 30;
const SDCANCEL = "com.newscolos.dice/sdcancel"; // room metadata: { id } of an attack someone dropped with ✕
const SDN = "com.newscolos.dice/sdn";           // room metadata: { id, n, ts } how many defenders an attack has
const MULTI = /spellcast|unconventional|meltdown|shockwave|^attack\b/i;
let openAttack = null, myId = "", lastCancel = "", lastSdn = 0, sd = { list: [], wait: null };
const nameOf = (r) => r.char || r.who;
const isAdr = (r) => /^(?:⚡\s*)?adroitness\b/i.test(String(r.label || "")) && !/initiative/i.test(String(r.label || ""));
const sdKey = () => "ns.sd:" + OBR.room.id;
const sdSave = () => { try { localStorage.setItem(sdKey(), JSON.stringify(sd)); } catch {} };
function syncWait() {
  const a = openAttack;
  sd.wait = a ? { id: a.id, att: nameOf(a), who: a.char ? a.who : "", at: a.total, l: String(a.label || "").slice(0, 46),
    sp: /spellcast|smite/i.test(a.label || "") ? 1 : 0, multi: a.multi, tg: a.tg || null, notg: a.notg ? 1 : 0, n: a.n, defs: a.defs, at0: a.at0 } : null;
  sdSave();
}
// One screen works out each result: the one whose roll is the defense (the defender's player, or the GM for monsters).
// It saves the result into the room like a roll, so every screen shows the same card and Roll History line,
// including anyone who joins later. Other screens only keep track of the attack and who has defended.
function combatCheck(r, mine) {
  if (r.cop || r.ap || r.sd || !Array.isArray(r.dice) || !r.dice.length) return;
  if (r.atk) {
    // 🎯 Targets on and tokens selected: exactly those defend (one each); otherwise the next Adroitness roll(s)
    const tg = Array.isArray(r.tg) && r.tg.length ? r.tg.slice(0, 12) : null;
    openAttack = { ...r, at0: Date.now(), n: tg ? tg.length : 1, defs: [], tg, multi: tg || MULTI.test(String(r.label || "")) ? 1 : 0 };
    syncWait(); openCard().catch(() => {}); return;
  }
  const a = openAttack, who = nameOf(r);
  if (!a || !isAdr(r) || who === nameOf(a) || a.defs.includes(who) || a.defs.length >= a.n || Date.now() - a.at0 > ATTACK_WAIT) return;
  if (a.tg && !a.tg.some(t => sameName(t, who) || sameName(t, r.who))) return; // not one of the targets
  a.defs.push(who); syncWait();
  if (mine) makeDelta(a, r).catch(() => {});
  // Backup: if the defender's screen missed the attack (joined or reloaded after it was rolled), it can't work it out.
  // The attacker's screen always saw it, so it does it after 4 seconds if nobody else has.
  else if (a.pid === myId) { const id = "sd-" + a.id + "-" + r.id; setTimeout(() => { if (!seenIds.has(id) && !sd.list.some(x => x.id === id)) makeDelta(a, r).catch(() => {}); }, 4000); }
}
async function makeDelta(a, d) {
  const e = { id: "sd-" + a.id + "-" + d.id, aid: a.id, sd: 1, pid: myId, ts: (d.ts || Date.now()) + 1, who: nameOf(a), dice: [], total: a.total - d.total,
    att: nameOf(a), def: nameOf(d), at: a.total, dt: d.total, delta: a.total - d.total };
  if (a.db != null) { e.db = a.db; if (a.dbk) e.dbk = a.dbk; } else if (a.pwd) e.dbk = "power"; else if (a.sp) { e.sp = 1; e.dbk = "spell"; }
  if (d.ab != null) e.ab = d.ab;
  seenIds.add(e.id);
  addResult(e);
  // saved under its own key (…/rolls/<player>~sd), so it can never collide with the panel saving that player's next roll
  const key = rollKey(myId) + "~sd", md = await OBR.room.getMetadata(), list = Array.isArray(md[key]) ? md[key] : [];
  // only the last 3 per player go in the room (it holds ~16 kB for everyone); each screen keeps its own 30 for ‹ ›
  if (!list.some(x => x.id === e.id)) await OBR.room.setMetadata({ [key]: [e, ...list].slice(0, 3) });
}
let seenIds = new Set();
function addResult(e) {
  try { rollLog(OBR.room.id, [e]); } catch {}
  if (!e.aid) e.aid = String(e.id || "").split("-")[1] || ""; // results saved before Nov 25 didn't carry the attack id
  if (!sd.list.some(x => x.id === e.id)) { sd.list.push(e); sd.list = sd.list.slice(-SD_KEEP); }
  sdSave(); openCard().catch(() => {});
}
// Opens (or reopens) the card: just left of the roll cards, on the bottom row; if there's no room, at the left edge beside the panel.
// It sizes itself to what it shows, growing upward.
async function openCard() {
  try { if (Date.now() - Number(localStorage.getItem("ns.sdAlive:" + OBR.room.id) || 0) < 3500) return; } catch {} // already showing
  const url = new URL("go.html", location.href); url.searchParams.set("p", "sdcard"); url.searchParams.set("room", OBR.room.id);
  const ref = new URLSearchParams(location.search).get("obrref"); if (ref) url.searchParams.set("obrref", ref);
  const vw = await OBR.viewport.getWidth(), vh = await OBR.viewport.getHeight();
  let left = 0; try { if (await OBR.action.isOpen()) left = ((await OBR.action.getWidth()) || 520) + 40; } catch {}
  const x0 = rowLeft || left + (vw - left) / 2, x = Math.max(left + 8, Math.round(x0 - SD_W - GAP));
  const h = sd.list.length ? (sd.wait ? 270 : 196) : 112; // first guess; the card fixes it
  await OBR.popover.close(SD).catch(() => {});
  await OBR.popover.open({ id: SD, url: url.href, width: SD_W, height: h,
    anchorReference: "POSITION", anchorPosition: { left: x, top: vh - 80 },
    anchorOrigin: { horizontal: "LEFT", vertical: "BOTTOM" }, transformOrigin: { horizontal: "LEFT", vertical: "BOTTOM" },
    disableClickAway: true, hidePaper: true });
}
// ✕ on a waiting attack, and − / + defenders, come in through room metadata so every screen follows
// What the GM's AUTO DAMAGE marked ("Medium Wound marked on Hive Runner 2"): shown on the matching result card
const APPLIED = "com.newscolos.dice/applied";
function sdMeta(md) {
  const ap = Array.isArray(md[APPLIED]) ? md[APPLIED] : []; let ch = false;
  for (const a of ap) { const e = sd.list.find(x => x.id === a.id); if (e && e.ap !== a.t) { e.ap = String(a.t).slice(0, 120); ch = true; } }
  if (ch) sdSave();
  const c = md[SDCANCEL]; if (c?.id && c.id !== lastCancel) { lastCancel = c.id; if (openAttack?.id === c.id) { openAttack = null; syncWait(); } }
  const n = md[SDN]; if (n?.ts && n.ts !== lastSdn) { lastSdn = n.ts;
    if (openAttack?.id === n.id && openAttack.n !== n.n) { openAttack.n = Math.max(1, Math.min(12, Number(n.n) || 1)); syncWait(); } }
}

// Announcements show for 5 seconds, then close themselves
// One message at a time: a new one first clears the old one and its timer. Before, the 5-second close timer
// of "Roll for initiative!" could fire after a quick NEXT and take the leader's "Your turn!" down with it.
let noteId = "", noteTimer = 0;
async function note(msg, kind, ms = 5000) {
  try {
    clearTimeout(noteTimer);
    if (noteId) { const old = noteId; noteId = ""; await OBR.notification.close(old).catch(() => {}); }
    const id = await OBR.notification.show(msg, kind); noteId = id;
    noteTimer = setTimeout(() => { if (noteId === id) { noteId = ""; OBR.notification.close(id).catch(() => {}); } }, ms);
  } catch {}
}
OBR.onReady(async () => {
  // Right-click a token → "Mark" panel: Dead, Unconscious, or your own condition, shown above its head
  const markMenu = async (n) => {
    const u = new URL("go.html", location.href); u.searchParams.set("p", "marks");
    const ref = new URLSearchParams(location.search).get("obrref"); if (ref) u.searchParams.set("obrref", ref);
    OBR.contextMenu.create({ id: "com.newscolos.markmenu",
      icons: [{ icon: new URL("mark.svg", location.href).pathname, label: "Mark", filter: { every: [{ key: "type", value: "IMAGE" }] } }],
      embed: { url: u.href, height: 8 + Math.ceil(n / 2) * 42 + 42 + 36 } }).catch(() => {});
  };
  let markCount = markList(await OBR.room.getMetadata()).length;
  markMenu(markCount);
  OBR.room.onMetadataChange((md) => { const n = markList(md).length; if (n !== markCount) { markCount = n; markMenu(n); } });
  const me = await OBR.player.getId();
  const seen = new Set(allRolls(await OBR.room.getMetadata()).map(r => r.id)); seenIds = seen; myId = me;
  { const md = await OBR.room.getMetadata(); lastCancel = md[SDCANCEL]?.id || ""; lastSdn = md[SDN]?.ts || 0; }
  // this screen's Success Delta results survive a reload; a waiting attack doesn't (its rolls were before the reload)
  try { const old = JSON.parse(localStorage.getItem(sdKey()) || "{}"); sd = { list: Array.isArray(old.list) ? old.list.slice(-SD_KEEP) : [], wait: null }; } catch {}
  sdSave();
  window.addEventListener("storage", (e) => { if (e.key === "ns.sdShow" && e.newValue) openCard().catch(() => {}); }); // Δ on the DICE tab
  const isGM = (await OBR.player.getRole()) === "GM";
  // Initiative: tell players to roll, and show the bar across the top while combat is on
  const BAR = "com.newscolos.initbar", LEFT = 545; // starts just past the New Scolos panel at L size, so it never overlaps (S or L)
  let barOpenedAt = 0, barCount = "", lastSid = (await OBR.room.getMetadata())[INIT]?.sid || "";
  let lastCur = "";
  async function initUpdate(md) {
    const st = md[INIT];
    if (!st?.open || !st.cur) lastCur = ""; // new combat starts fresh, so its first turn always pings
    // "Your turn" ping for the player whose turn it is
    if (st?.open && st.cur && st.cur !== lastCur && !isGM) { // players only: the GM never gets these
      lastCur = st.cur;
      if (st.cur === me) note("⚔ Your turn!", "SUCCESS");
      else { // soft heads-up for whoever is on deck
        const list = initEntries(md), i = list.findIndex(e => e.id === st.cur);
        if (list.length > 1 && i >= 0 && list[(i + 1) % list.length].id === me) note("On deck: your turn is next", "DEFAULT", 3000);
      }
    }
    if (st?.open && st.sid !== lastSid) {
      lastSid = st.sid;
      if (!isGM) note("⚔ Roll for initiative! Your next Adroitness roll (on your CHARACTER SHEET tab) counts.", "INFO");
    }
    const n = st?.open ? initEntries(md).length : 0;
    let small = false; try { small = localStorage.getItem("ns.barMin") === "1"; } catch {}
    const key = n + (small ? "m" : "");
    if (key === barCount) return;
    barCount = key;
    if (!n) { OBR.popover.close(BAR).catch(() => {}); OBR.popover.close("com.newscolos.initlist").catch(() => {}); try { localStorage.setItem("ns.initList", ""); } catch {} return; }
    let vw = 1200; try { vw = await OBR.viewport.getWidth(); } catch {}
    const url = new URL("go.html", location.href); url.searchParams.set("p", "initbar");
    const ref = new URLSearchParams(location.search).get("obrref"); if (ref) url.searchParams.set("obrref", ref);
    barOpenedAt = Date.now();
    OBR.popover.open({ id: BAR, url: url.href, width: small ? 54 : Math.max(300, vw - LEFT - 110), height: 54, hidePaper: true,
      // full bar starts right of Owlbear's top-left toolbar; minimized it's a small ⚔ box at the top right
      anchorReference: "POSITION", anchorPosition: { left: small ? vw - 90 : LEFT, top: 12 },
      anchorOrigin: { horizontal: small ? "RIGHT" : "LEFT", vertical: "TOP" }, transformOrigin: { horizontal: small ? "RIGHT" : "LEFT", vertical: "TOP" },
      disableClickAway: true }).catch(() => { barCount = ""; }); // didn't open: the watchdog below tries again
  }
  initUpdate(await OBR.room.getMetadata());
  // Watchdog: while combat is on, make sure the bar is really on this screen (late joiners, a reload, a failed open).
  // The bar writes a heartbeat every 1.5 s; no heartbeat for 6 s means it isn't showing, so open it again.
  setInterval(async () => {
    try {
      const md = await OBR.room.getMetadata();
      if (!md[INIT]?.open || !initEntries(md).length) return;
      const alive = Number(localStorage.getItem("ns.barAlive") || 0);
      if (Date.now() - alive > 6000 && Date.now() - barOpenedAt > 10000) { barCount = ""; initUpdate(md); } // 10 s grace while it loads
    } catch {}
  }, 3000);
  // Joined while combat is already on and haven't rolled initiative yet: ask now
  { const md = await OBR.room.getMetadata(), st = md[INIT];
    if (!isGM && st?.open && st.sid && md[`${INIT}/p/${me}`]?.sid !== st.sid) note("⚔ Combat is on! Roll for initiative: your next Adroitness roll (on your CHARACTER SHEET tab) counts.", "INFO", 8000); }
  window.addEventListener("storage", async (e) => { if (e.key === "ns.barMin") initUpdate(await OBR.room.getMetadata()); });
  // other players' rolls
  // keep this browser's 100-roll log growing even while the panel is closed
  rollLog(OBR.room.id, allRolls(await OBR.room.getMetadata()));
  OBR.room.onMetadataChange((md) => {
    rollLog(OBR.room.id, allRolls(md));
    initUpdate(md);
    sdMeta(md);
    for (const r of allRolls(md).reverse()) { // oldest first
      if (seen.has(r.id)) continue;
      seen.add(r.id);
      if (r.sd) { if (r.pid !== me) addResult({ ...r }); continue; } // a Success Delta another screen worked out
      if (r.pid !== me) { showRoll(r, false).catch(() => {}); combatCheck(r, false); }
    }
  });
  // your own rolls from the sheet's roll buttons (sent from the panel; spins as it lands)
  window.addEventListener("storage", (e) => {
    if (e.key !== "ns.toastReq" || !e.newValue) return;
    try { const r = JSON.parse(e.newValue); if (!seen.has(r.id)) { seen.add(r.id); showRoll(r, true).catch(() => {}); combatCheck(r, true); } } catch {}
  });
});
</script></body></html>
